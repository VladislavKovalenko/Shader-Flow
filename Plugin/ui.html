            _drawQuadWithProg(_passthroughProg, texture, true, [], t, canvas.width, canvas.height);
          } else if (program) {
            _drawQuadWithProg(program, texture, !!texture, S.uniforms, t, canvas.width, canvas.height);
          }
        }
      } else {
        renderFrame(shaderLayers, t);
      }
    } catch(e) {
      if (_onError) _onError(e);
    }
    if (_onFrame) _onFrame(t);
  }

  function stopLoop() {
    if (animId) cancelAnimationFrame(animId);
    animId = null;
  }

  function getPixels(w, h) {
    if (!gl) return null;
    w = Math.max(1, Math.round(w || 1));
    h = Math.max(1, Math.round(h || 1));
    _ensurePingPong(w, h);

    let layers = null;
    if (ShaderLayers.hasLayers()) {
      layers = ShaderLayers.getVisibleLayersData();
    }

    const outTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, outTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const outFB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, outFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outTex, 0);

    gl.viewport(0, 0, w, h);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    const hasMasterMask = MasterMaskState.masks.some(m => m.enabled);
    const visible = layers ? layers.filter(l => l.visible && l._prog) : [];

    if (visible.length === 0) {
      if (texture) {
        if (hasMasterMask) {
          _ensurePassthrough();
          gl.bindFramebuffer(gl.FRAMEBUFFER, pingPongFBs[0]);
          gl.viewport(0, 0, w, h);
          gl.clearColor(0,0,0,0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          _drawQuadWithProg(_passthroughProg, texture, true, [], getTime(), w, h);
          applyMasterMask(pingPongTexs[0], w, h, getTime(), outFB);
        } else {
          _ensurePassthrough();
          gl.bindFramebuffer(gl.FRAMEBUFFER, outFB);
          gl.viewport(0, 0, w, h);
          gl.clearColor(0,0,0,0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          _drawQuadWithProg(_passthroughProg, texture, true, [], getTime(), w, h);
        }
      } else if (program) {
        if (hasMasterMask) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, pingPongFBs[0]);
          gl.viewport(0, 0, w, h);
          gl.clearColor(0,0,0,0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          _drawQuadWithProg(program, texture, !!texture, S.uniforms, getTime(), w, h);
          applyMasterMask(pingPongTexs[0], w, h, getTime(), outFB);
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, outFB);
          gl.viewport(0, 0, w, h);
          gl.clearColor(0,0,0,0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          _drawQuadWithProg(program, texture, !!texture, S.uniforms, getTime(), w, h);
        }
      }
    } else {
      _ensurePingPong(w, h);
      const visible = layers.filter(l => l.visible && l._prog);
      if (visible.length === 0) {
        if (texture) {
          _ensurePassthrough();
          _drawQuadWithProg(_passthroughProg, texture, true, [], getTime(), w, h);
        }
      } else {
        let readIdx = 0, writeIdx = 1;
        let prevTex = texture;
        const hasMasterMask = MasterMaskState.masks.some(m => m.enabled);

        for (let i = 0; i < visible.length; i++) {
          const layer = visible[i];
          const isLast = i === visible.length - 1;
          const drawToOut = isLast && !hasMasterMask;
          const targetFB = drawToOut ? outFB : pingPongFBs[writeIdx];
          const inputTex = i === 0 ? prevTex : pingPongTexs[readIdx];
          const layerTex = _drawLayerToScratch(layer._prog, inputTex, i === 0 ? !!texture : true, layer.uniforms, getTime(), w, h);
          _applyLayerMask(prevTex, layerTex, layer.masks, getTime(), targetFB, w, h);
          prevTex = pingPongTexs[writeIdx];
          if (!drawToOut) {
            const tmp = readIdx; readIdx = writeIdx; writeIdx = tmp;
          }
        }

        if (hasMasterMask) {
          console.log("[MasterMask] Applying master mask in getPixels");
          applyMasterMask(prevTex, w, h, getTime(), outFB);
        }
      }
    }

    const pixels = new Uint8Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, outFB);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteTexture(outTex);
    gl.deleteFramebuffer(outFB);

    ppWidth = 0; ppHeight = 0;
    _ensurePingPong(gl.canvas.width, gl.canvas.height);

    const flipped = new Uint8Array(w * h * 4);
    for (let row = 0; row < h; row++) {
      const src = (h - 1 - row) * w * 4;
      const dst = row * w * 4;
      flipped.set(pixels.subarray(src, src + w * 4), dst);
    }
    return { pixels: flipped, width: w, height: h };
  }
  function renderGenerateToTexture(w, h, time) {
    if (!program) return null;
    w = Math.max(1, Math.round(w || 1));
    h = Math.max(1, Math.round(h || 1));

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    _drawQuadWithProg(program, texture, !!texture, S.uniforms, time, w, h);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fb);

    return tex;
  }
  function setGenerateUniforms(uniforms) {
    _generateUniforms = uniforms.map(u => ({
      ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
    }));
  }

  // Компилирует отдельную программу для слоя/стадии (без изменения
  // глобального program). Возвращает program или null при ошибке.
  function compileProgram(fragSrc) {
    if (!gl) return null;
    try { return _buildProg(fragSrc); }
    catch (e) { return null; }
  }

  // Композиция стека генератор-стадий (без входной текстуры — каждый
  // слой рисует "с нуля" поверх результата предыдущего через ping-pong).
  function deleteProgram(prog) {
    if (prog && gl) { try { gl.deleteProgram(prog); } catch (e) {} }
  }

  // Экспортируемый API движка рендера.
  return {
    init, buildProgram, buildProgramFromLayers,
    uploadTexture, clearTexture,
    renderFrame, renderGenerateToTexture,
    setGenerateUniforms, getPixels, compileProgram, deleteProgram,
    getTime, startLoop, stopLoop,
    applyLayerMask: _applyLayerMask,
    getMaskShaderSource: function(mask) {
      if (!_maskProg) _ensureMaskProgs();
      if (!MASK_FRAG_SRC) return '';
      if (!mask || mask.type === 'code') return MASK_FRAG_SRC;
      const lines = MASK_FRAG_SRC.split('\n');
      // заменяем объявление uType на комментарий с фактическим типом
      const typeCode = _MASK_CODE[mask.type] !== undefined ? _MASK_CODE[mask.type] : 0;
      for (let i = 0; i < lines.length; i++) {
        if (/^\s*uniform\s+int\s+uType\s*;/.test(lines[i])) {
          lines[i] = `// uType = ${typeCode} (${MASK_TYPES[mask.type] ? MASK_TYPES[mask.type].label : mask.type})`;
          break;
        }
      }
      const params = [];
      params.push(`// Mask parameters (actual values for this mask):`);
      params.push(`//   uType    = ${typeCode}`);
      params.push(`//   uInvert  = ${mask.invert ? 1 : 0}`);
      params.push(`//   uStrength= ${Number(mask.strength).toFixed(3)}`);
      params.push(`//   uFeather = ${Number(mask.feather).toFixed(3)}`);
      params.push(`//   uCenter  = vec2(${Number(mask.cx).toFixed(3)}, ${Number(mask.cy).toFixed(3)})`);
      params.push(`//   uSize    = vec2(${Number(mask.sx).toFixed(3)}, ${Number(mask.sy).toFixed(3)})`);
      params.push(`//   uRot     = ${Number(mask.rot).toFixed(3)}`);
      if (mask.type === 'polygon') params.push(`//   uSides   = ${mask.sides}`);
      if (mask.type === 'star')    params.push(`//   uPoints  = ${mask.points}`);
      if (mask.type === 'rrect')   params.push(`//   uRadius  = ${Number(mask.radius).toFixed(3)}`);
      if (mask.type === 'line')    params.push(`//   uThickness = ${Number(mask.thickness).toFixed(3)}`);
      if (mask.type === 'noise') {
        params.push(`//   uNoiseType = ${mask.noiseType}`);
        params.push(`//   uScale   = ${Number(mask.scale).toFixed(2)}`);
        params.push(`//   uSpeed   = ${Number(mask.speed).toFixed(2)}`);
        params.push(`//   uThreshold = ${Number(mask.threshold).toFixed(3)}`);
      }
      params.push(`//   uUneven  = ${Number(mask.uneven || 0).toFixed(3)}  (${mask.unevenType === 'sharp' ? 'Sharp' : 'Soft'})`);
      params.push(`// Coverage is output in the alpha channel: gl_FragColor = vec4(cov, cov, cov, cov)`);
      return params.join('\n') + '\n\n' + lines.join('\n');
    },
    compileUserMask: function(fragSrc) {
      if (!gl) return null;
      try { return _buildProg(fragSrc); }
      catch (e) { return null; }
    },
    setFrameRate: function(fps) { _frameInterval = fps > 0 ? 1000 / fps : 0; }
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   UNIFORM PARSER
═══════════════════════════════════════════════════════════════════ */

const UniformParser = (() => {
  const RE = /^\s*uniform\s+(float|int|bool|vec2|vec3|vec4|sampler2D)\s+(\w+)\s*;/gm;

  const BUILTIN = new Set(['iResolution','iTime','iMouse','uTexture','uHasTexture']);

  function parse(glsl) {
    const found = [];
    let m;
    RE.lastIndex = 0;
    while ((m = RE.exec(glsl)) !== null) {
      const type = m[1], name = m[2];
      if (BUILTIN.has(name)) continue;
      found.push({ name, glslType: type });
    }
    return found;
  }

  function sync(currentUniforms, parsed) {
    const result = [];
    for (const p of parsed) {
      const existing = currentUniforms.find(u => u.name === p.name);
      if (existing && typeCompatible(existing.type, p.glslType)) {
        result.push(existing);
      } else {
        const def = makeDefault(p.name, p.glslType);
        if (def !== null) result.push(def);
      }
    }
    return result;
  }

  function typeCompatible(uiType, glslType) {
    if (glslType === 'vec3') return uiType === 'vec3' || uiType === 'vec3color';
    return uiType === glslType;
  }

  function makeDefault(name, glslType) {
    switch (glslType) {
      case 'float': {
        // Умные диапазоны на основе имени параметра
        let min = 0.0, max = 1.0, value = 0.5;
        const ln = name.toLowerCase();

        // Количество / счётчики
        if (/count|tile|num|amount|quantity|segments|steps|iter|cells|rows|cols/i.test(ln)) {
          min = 1; max = 100; value = 10;
        }
        // Углы и повороты
        else if (/angle|rotat|degree|rot|turn|twist/i.test(ln)) {
          min = 0; max = 360; value = 0;
        }
        // Размеры и масштабы
        else if (/scale|radius|size|width|height|thick|border|length|dist|range/i.test(ln)) {
          min = 0; max = 10; value = 1;
        }
        // Скорость и частота
        else if (/speed|freq|rate|velocity|pace|tempo/i.test(ln)) {
          min = 0; max = 5; value = 1;
        }
        // Прозрачность и интенсивность
        else if (/opacity|alpha|strength|intensity|mix|blend|power|factor|weight/i.test(ln)) {
          min = 0; max = 1; value = 0.5;
        }
        // Смещения (могут быть отрицательными)
        else if (/offset|shift|bias|displace|drift|translate|move|pan/i.test(ln)) {
          min = -1; max = 1; value = 0;
        }
        // Искажения
        else if (/distort|warp|bend|curve|twist|ripple|wave/i.test(ln)) {
          min = 0; max = 2; value = 0.5;
        }
        // Время и задержки
        else if (/time|delay|duration|period|phase/i.test(ln)) {
          min = 0; max = 10; value = 1;
        }
        // Позиции (0..1 для UV)
        else if (/pos|center|origin|anchor|pivot/i.test(ln)) {
          min = 0; max = 1; value = 0.5;
        }
        // Детализация и качество
        else if (/detail|octave|level|depth|resolution|quality/i.test(ln)) {
          min = 1; max = 8; value = 4;
        }
        // Мягкость и размытие
        else if (/soft|blur|smooth|feather|fade|sharp/i.test(ln)) {
          min = 0; max = 1; value = 0.1;
        }

        return { name, type: 'float', value, min, max };
      }
      case 'int': {
        let min = 0, max = 10, value = 5;
        const ln = name.toLowerCase();

        if (/count|num|amount|quantity|segments|steps|iter|cells|rows|cols/i.test(ln)) {
          min = 1; max = 100; value = 10;
        } else if (/detail|octave|level|depth|resolution|quality/i.test(ln)) {
          min = 1; max = 8; value = 4;
        } else if (/sides|points|edges|vertices/i.test(ln)) {
          min = 3; max = 12; value = 6;
        }

        return { name, type: 'int', value, min, max };
      }
      case 'bool':      return { name, type: 'bool',      value: false };
      case 'vec2':      return { name, type: 'vec2',      value: [0.5, 0.5] };
      case 'vec3': {
        const isColor = /color|col/i.test(name);
        return {
          name,
          type: isColor ? 'vec3color' : 'vec3',
          value: [0.5, 0.5, 0.5]
        };
      }
      case 'vec4':
      case 'sampler2D': return null;
      default:          return { name, type: 'float', value: 0.5, min: 0, max: 1 };
    }
  }

  return { parse, sync, makeDefault };
})();

/* ═══════════════════════════════════════════════════════════════════
   COLOR PICKER — кастомный попап (RGB / HSB / HEX)
   ═══════════════════════════════════════════════════════════════════ */

const ColorPicker = (() => {
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  function rgbToHex(r, g, b) {
    const h = v => ('0' + Math.round(clamp(v, 0, 1) * 255).toString(16)).slice(-2);
    return '#' + h(r) + h(g) + h(b);
  }
  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
    if (!m) return [0, 0, 0];
    const n = m[1];
    return [
      parseInt(n.slice(0, 2), 16) / 255,
      parseInt(n.slice(2, 4), 16) / 255,
      parseInt(n.slice(4, 6), 16) / 255
    ];
  }
  // RGB (0..1) -> HSB (h:0..360, s:0..1, b:0..1)
  function rgbToHsb(r, g, b) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    const s = max === 0 ? 0 : d / max;
    return [h, s, max];
  }
  // HSB (h:0..360, s:0..1, b:0..1) -> RGB (0..1)
  function hsbToRgb(h, s, b) {
    h = ((h % 360) + 360) % 360;
    const c = b * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = b - c;
    let r = 0, g = 0, bl = 0;
    if (h < 60)       { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; bl = x; }
    else if (h < 240) { g = x; bl = c; }
    else if (h < 300) { r = x; bl = c; }
    else              { r = c; bl = x; }
    return [r + m, g + m, bl + m];
  }

  let pop = null;
  let state = null;   // { anchor, rgb, onCommit, svDragging }

  function build() {
    pop = document.createElement('div');
    pop.className = 'color-pop';
    pop.style.display = 'none';
    pop.innerHTML = `
      <div class="cp-sv"><div class="cp-sv-handle"></div></div>
      <div class="cp-hue"><div class="cp-hue-handle"></div></div>
      <div class="cp-fields">
        <div class="cp-group">
          <span class="cp-label">RGB</span>
          <input class="cp-num cp-r" type="number" min="0" max="255" step="1">
          <input class="cp-num cp-g" type="number" min="0" max="255" step="1">
          <input class="cp-num cp-b" type="number" min="0" max="255" step="1">
        </div>
        <div class="cp-group">
          <span class="cp-label">HSB</span>
          <input class="cp-num cp-h" type="number" min="0" max="360" step="1">
          <input class="cp-num cp-s" type="number" min="0" max="100" step="1">
          <input class="cp-num cp-v" type="number" min="0" max="100" step="1">
        </div>
        <div class="cp-group">
          <span class="cp-label">HEX</span>
          <input class="cp-hex" type="text" maxlength="7">
        </div>
      </div>`;
    document.body.appendChild(pop);

    const sv = pop.querySelector('.cp-sv');
    const svHandle = pop.querySelector('.cp-sv-handle');
    const hue = pop.querySelector('.cp-hue');
    const hueHandle = pop.querySelector('.cp-hue-handle');

    const rI = pop.querySelector('.cp-r'), gI = pop.querySelector('.cp-g'), bI = pop.querySelector('.cp-b');
    const hI = pop.querySelector('.cp-h'), sI = pop.querySelector('.cp-s'), vI = pop.querySelector('.cp-v');
    const hexI = pop.querySelector('.cp-hex');

    function commit() {
      if (state && state.onCommit) state.onCommit(state.rgb.slice());
      if (state && state.anchor) state.anchor.style.background = rgbToHex(state.rgb[0], state.rgb[1], state.rgb[2]);
    }

    function syncFields() {
      const [h, s, b] = rgbToHsb(state.rgb[0], state.rgb[1], state.rgb[2]);
      rI.value = Math.round(state.rgb[0] * 255);
      gI.value = Math.round(state.rgb[1] * 255);
      bI.value = Math.round(state.rgb[2] * 255);
      hI.value = Math.round(h);
      sI.value = Math.round(s * 100);
      vI.value = Math.round(b * 100);
      hexI.value = rgbToHex(state.rgb[0], state.rgb[1], state.rgb[2]).toUpperCase();
      // SV square: hue determines background, handle position by s (x) / v (y)
      sv.style.background = `hsl(${h}, 100%, 50%)`;
      svHandle.style.left = (s * 100) + '%';
      svHandle.style.top = ((1 - b) * 100) + '%';
      hueHandle.style.left = (h / 360 * 100) + '%';
    }

    function setRgb(rgb) { state.rgb = rgb; syncFields(); commit(); }

    function svPos(e) {
      const r = sv.getBoundingClientRect();
      const x = clamp((e.clientX - r.left) / r.width, 0, 1);
      const y = clamp((e.clientY - r.top) / r.height, 0, 1);
      const [hh, , ] = rgbToHsb(state.rgb[0], state.rgb[1], state.rgb[2]);
      setRgb(hsbToRgb(hh, x, 1 - y));
    }
    function huePos(e) {
      const r = hue.getBoundingClientRect();
      const x = clamp((e.clientX - r.left) / r.width, 0, 1);
      const [ , s, b] = rgbToHsb(state.rgb[0], state.rgb[1], state.rgb[2]);
      setRgb(hsbToRgb(x * 360, s, b));
    }

    sv.addEventListener('pointerdown', e => { state.svDragging = true; try { sv.setPointerCapture(e.pointerId); } catch(_){} svPos(e); });
    sv.addEventListener('pointermove', e => { if (state.svDragging) svPos(e); });
    sv.addEventListener('pointerup', e => { state.svDragging = false; try { sv.releaseCapture(); } catch(_){} });

    hue.addEventListener('pointerdown', e => { state.hueDragging = true; try { hue.setPointerCapture(e.pointerId); } catch(_){} huePos(e); });
    hue.addEventListener('pointermove', e => { if (state.hueDragging) huePos(e); });
    hue.addEventListener('pointerup', e => { state.hueDragging = false; try { hue.releaseCapture(); } catch(_){} });

    function numHandler(getter) {
      return () => {
        const rgb = getter();
        if (rgb) setRgb(rgb);
      };
    }
    const cR = () => { const v = clamp(parseInt(rI.value) || 0, 0, 255) / 255; return [v, state.rgb[1], state.rgb[2]]; };
    const cG = () => { const v = clamp(parseInt(gI.value) || 0, 0, 255) / 255; return [state.rgb[0], v, state.rgb[2]]; };
    const cB = () => { const v = clamp(parseInt(bI.value) || 0, 0, 255) / 255; return [state.rgb[0], state.rgb[1], v]; };
    const cH = () => { const [ , s, b] = rgbToHsb(state.rgb[0], state.rgb[1], state.rgb[2]); return hsbToRgb(clamp(parseInt(hI.value) || 0, 0, 360), s, b); };
    const cS = () => { const [ h, , b] = rgbToHsb(state.rgb[0], state.rgb[1], state.rgb[2]); return hsbToRgb(h, clamp(parseInt(sI.value) || 0, 0, 100) / 100, b); };
    const cV = () => { const [ h, s, ] = rgbToHsb(state.rgb[0], state.rgb[1], state.rgb[2]); return hsbToRgb(h, s, clamp(parseInt(vI.value) || 0, 0, 100) / 100); };

    [rI, gI, bI].forEach((el, i) => el.addEventListener('input', numHandler([cR, cG, cB][i])));
    [hI, sI, vI].forEach((el, i) => el.addEventListener('input', numHandler([cH, cS, cV][i])));
    hexI.addEventListener('input', () => {
      const rgb = hexToRgb(hexI.value);
      if (/^#?[0-9a-f]{6}$/i.test(hexI.value.trim())) setRgb(rgb);
    });

    // клик внутри попапа не закрывает его
    pop.addEventListener('pointerdown', e => e.stopPropagation());
  }

  function open(anchor, rgb, onCommit) {
    if (!pop) build();
    state = { anchor, rgb: rgb.slice(), onCommit, svDragging: false, hueDragging: false };
    pop.style.display = 'block';
    // позиция справа от параметра.
    // position:fixed задаётся в координатах вёрстки (без zoom на <html>),
    // поэтому делим все координаты на текущий коэффициент UI Scale.
    const zoom = parseFloat(document.documentElement.style.zoom) || 1;
    const r = anchor.getBoundingClientRect();
    const pw = 232, ph = pop.offsetHeight || 250;
    let left = (r.right + 8) / zoom;
    let top = r.top / zoom;
    if (left + pw > window.innerWidth / zoom - 8) left = (r.left - 8) / zoom - pw;
    if (left < 8) left = 8;
    if (top + ph > window.innerHeight / zoom - 8) top = Math.max(8, window.innerHeight / zoom - 8 - ph);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
    // первичная синхронизация полей под текущий цвет
    const [h, s, b] = rgbToHsb(state.rgb[0], state.rgb[1], state.rgb[2]);
    pop.querySelector('.cp-sv').style.background = `hsl(${h}, 100%, 50%)`;
    pop.querySelector('.cp-sv-handle').style.left = (s * 100) + '%';
    pop.querySelector('.cp-sv-handle').style.top = ((1 - b) * 100) + '%';
    pop.querySelector('.cp-hue-handle').style.left = (h / 360 * 100) + '%';
    pop.querySelector('.cp-r').value = Math.round(state.rgb[0] * 255);
    pop.querySelector('.cp-g').value = Math.round(state.rgb[1] * 255);
    pop.querySelector('.cp-b').value = Math.round(state.rgb[2] * 255);
    pop.querySelector('.cp-h').value = Math.round(h);
    pop.querySelector('.cp-s').value = Math.round(s * 100);
    pop.querySelector('.cp-v').value = Math.round(b * 100);
    pop.querySelector('.cp-hex').value = rgbToHex(state.rgb[0], state.rgb[1], state.rgb[2]).toUpperCase();
  }

  function close() { if (pop) pop.style.display = 'none'; state = null; }

  // закрытие по клику вне попапа
  document.addEventListener('pointerdown', e => {
    if (pop && pop.style.display !== 'none' && !pop.contains(e.target)) close();
  });

  return { open, close };
})();

/* ═══════════════════════════════════════════════════════════════════
   UNIFORMS UI
   ═══════════════════════════════════════════════════════════════════ */

const UniformsUI = (() => {
  const list = document.getElementById('uniforms-list');
  let _onChange = null;
  function onChange(cb) { _onChange = cb; }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16)/255;
    const g = parseInt(hex.slice(3,5),16)/255;
    const b = parseInt(hex.slice(5,7),16)/255;
    return [r, g, b];
  }
  function rgbToHex(r, g, b) {
    const h = v => ('0'+Math.round(v*255).toString(16)).slice(-2);
    return '#'+h(r)+h(g)+h(b);
  }

  function renderAll() {
    list.innerHTML = '';
    if (S.uniforms.length === 0) {
      list.innerHTML = '<div style="padding:16px;text-align:center;color:#444;font-size:11px;">Нет параметров.<br>Парсятся из GLSL или добавь вручную.</div>';
      return;
    }
    S.uniforms.forEach((u, idx) => renderRow(u, idx));
  }

  function renderRow(u, idx) {
    const row = document.createElement('div');
    row.className = 'uniform-row';
    row.dataset.idx = idx;

    const hdr = document.createElement('div');
    hdr.className = 'uniform-header';

    const badge = document.createElement('span');
    badge.className = 'uniform-type-badge';
    badge.textContent = u.type === 'vec3color' ? 'vec3' : u.type;

    const nameEl = document.createElement('span');
    nameEl.className = 'uniform-name';
    nameEl.textContent = u.name;

    const delBtn = document.createElement('button');
    delBtn.className = 'uniform-delete';
    delBtn.textContent = '×';
    delBtn.setAttribute('data-tip', 'Delete parameter');
    delBtn.addEventListener('click', () => {
      S.uniforms.splice(idx, 1);
      renderAll();
      if (_onChange) _onChange('delete');
    });

    hdr.append(badge, nameEl, delBtn);
    row.appendChild(hdr);

    const ctrl = buildControl(u, idx);
    row.appendChild(ctrl);
    list.appendChild(row);
  }

  function buildControl(u, idx) {
    const wrap = document.createElement('div');
    if (u.type === 'float' || u.type === 'int') {
        const valRow = document.createElement('div');
        valRow.style.cssText = 'display:flex;align-items:center;gap:6px;';
        const slider = document.createElement('input');
        slider.type = 'range';
        slider.className = 'u-slider';
        const step = u.type === 'int' ? '1' : '0.001';
        slider.min  = u.min !== undefined ? u.min : 0;
        slider.max  = u.max !== undefined ? u.max : 1;
        slider.step = step;
        slider.value = u.value;
        const valLabel = document.createElement('span');
        valLabel.className = 'uniform-value';
        valLabel.style.minWidth = '44px';
        valLabel.textContent = fmt(u.value, u.type);
        
        slider.addEventListener('pointerdown', (e) => {
            try { slider.setPointerCapture(e.pointerId); } catch (_) {}
            UndoRedo.pushImmediate(); // Snapshot BEFORE dragging
        });
        slider.addEventListener('input', () => {
            const v = u.type === 'int' ? parseInt(slider.value) : parseFloat(slider.value);
            S.uniforms[idx].value = v;
            valLabel.textContent = fmt(v, u.type);
            if (_onChange) _onChange('value');
        });
        slider.addEventListener('change', () => { UndoRedo.pushImmediate(); }); // Snapshot AFTER
        
        valRow.append(slider, valLabel);
        wrap.appendChild(valRow);
    } else if (u.type === 'bool') {
        const toggleWrap = document.createElement('div');
        toggleWrap.className = 'u-toggle-wrap';
        const label = document.createElement('label');
        label.className = 'u-toggle';
        const inp = document.createElement('input');
        inp.type = 'checkbox';
        inp.checked = !!u.value;
        const slider = document.createElement('div');
        slider.className = 'u-toggle-slider';
        label.append(inp, slider);
        const textEl = document.createElement('span');
        textEl.style.cssText = 'font-size:11px;color:#888;';
        textEl.textContent = u.value ? 'true' : 'false';
        
        inp.addEventListener('mousedown', () => { UndoRedo.pushImmediate(); }); // BEFORE
        inp.addEventListener('change', () => {
            S.uniforms[idx].value = inp.checked;
            textEl.textContent = inp.checked ? 'true' : 'false';
            if (_onChange) _onChange('value');
            UndoRedo.pushImmediate(); // AFTER
        });
        
        toggleWrap.append(label, textEl);
        wrap.appendChild(toggleWrap);
    } else if (u.type === 'vec3color') {
        const colorRow = document.createElement('div');
        colorRow.className = 'u-color-row';
        const v = u.value;
        const hexVal = rgbToHex(v[0], v[1], v[2]);
        const swatch = document.createElement('div');
        swatch.className = 'u-color-swatch';
        swatch.style.background = hexVal;
        const hexInput = document.createElement('input');
        hexInput.type = 'text';
        hexInput.className = 'u-color-hex';
        hexInput.value = hexVal.slice(1).toUpperCase();
        hexInput.maxLength = 6;
        
        let colorPushTimer = null;
        const applyRgb = (rgb) => {
            S.uniforms[idx].value = rgb;
            swatch.style.background = rgbToHex(rgb[0], rgb[1], rgb[2]);
            hexInput.value = rgbToHex(rgb[0], rgb[1], rgb[2]).slice(1).toUpperCase();
            if (_onChange) _onChange('value');
            clearTimeout(colorPushTimer);
            colorPushTimer = setTimeout(() => UndoRedo.pushImmediate(), 300); // Debounced AFTER
        };
        
        swatch.addEventListener('click', (e) => {
            e.stopPropagation();
            UndoRedo.pushImmediate(); // BEFORE opening picker
            ColorPicker.open(swatch, v, (rgb) => applyRgb(rgb));
        });
        hexInput.addEventListener('focus', () => { UndoRedo.pushImmediate(); }); // BEFORE typing
        hexInput.addEventListener('change', () => {
            const h = '#' + hexInput.value.replace('#','').padStart(6,'0');
            const rgb = hexToRgb(h);
            applyRgb(rgb);
        });
        colorRow.append(swatch, hexInput);
        wrap.appendChild(colorRow);
    } else if (u.type === 'vec2' || u.type === 'vec3') {
        const dims = u.type === 'vec2' ? 2 : 3;
        const vecRow = document.createElement('div');
        vecRow.className = 'u-vec-row';
        for (let d = 0; d < dims; d++) {
            const inp = document.createElement('input');
            inp.type = 'number';
            inp.className = 'u-vec-input';
            inp.value = (u.value[d] || 0).toFixed(3);
            inp.step = '0.01';
            inp.addEventListener('focus', () => { UndoRedo.pushImmediate(); }); // BEFORE typing
            inp.addEventListener('change', () => {
                S.uniforms[idx].value[d] = parseFloat(inp.value) || 0;
                if (_onChange) _onChange('value');
                UndoRedo.pushImmediate(); // AFTER
            });
            vecRow.appendChild(inp);
        }
        wrap.appendChild(vecRow);
    }
    return wrap;
  }

  function fmt(v, type) {
    if (type === 'int') return String(Math.round(v));
    return v.toFixed(3);
  }

  return { renderAll, onChange };
})();

/* ═══════════════════════════════════════════════════════════════════
   MASK EDITOR — модальная панель управления стеком масок активного слоя.
   Редактирует напрямую массив layer.masks (живой объект слоя), поэтому
   изменения сразу влияют на превью. Каждая правка вызывает UndoRedo.push().
═══════════════════════════════════════════════════════════════════════ */

const MaskEditor = (() => {
  let overlay = null, panel = null;
  let curKind = null, curLayer = null, selectedId = null;
  let editingId = null;
  let selectedAnchor = -1;
  let dragAnchor = -1;
  let dragHandleType = null;
  let previewCvs = null, previewTimer = null;
  let pvSx = 1, pvSy = 1, pvAspect = 1, pvScale = 1;   // геометрия превью (для drag-хиттестов)
  let maskCodeVisible = false, maskCodeTimer = null;

  function getLayer(kind, id) {
    if (kind === 'master') return MasterMaskState;
    return ShaderLayers.getLayer(id);
  }

  // Обновляет область <>Code текущей выбранной маски:
  // для обычных типов — сгенерированный GLSL (только чтение),
  // для типа 'code' — редактируемый фрагментный шейдер пользователя.
  function renderMaskCode() {
    if (!panel || !maskCodeVisible) return;
    const codeSection = panel.querySelector('#mask-code-section');
    const codeEditor = panel.querySelector('#mask-code-editor');
    const codeHead = panel.querySelector('#mask-code-head');
    const codeError = panel.querySelector('#mask-code-error');
    if (!codeEditor) return;
    const m = (curLayer.masks || []).find(x => x.id === selectedId);
    if (!m) { codeSection.style.display = 'none'; return; }
    if (m.type === 'code') {
      codeHead.textContent = 'Fragment Shader — editable';
      codeEditor.readOnly = false;
      codeEditor.value = m.code || '';
      codeError.textContent = '';
      codeError.classList.remove('visible');
      } else {
        codeHead.textContent = MASK_TYPES[m.type].label + ' — generated (read-only)';
        codeEditor.readOnly = true;
        codeEditor.value = GL.getMaskShaderSource(m);
        codeError.textContent = '';
        codeError.classList.remove('visible');
      }
  }

  function open(kind, id) {
    curKind = kind;
    curLayer = getLayer(kind, id);
    if (!curLayer) return;
    if (!curLayer.masks) curLayer.masks = [];
    selectedId = curLayer.masks.length ? curLayer.masks[curLayer.masks.length - 1].id : null;
    selectedAnchor = -1;
    buildOverlay();
    renderList();
    renderParams();
    renderPreview();
  }

  function close() {
    if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    overlay = null; panel = null; curLayer = null; previewCvs = null;
  }

  function buildOverlay() {
    if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    overlay = document.createElement('div');
    overlay.className = 'mask-overlay';
    overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });

    panel = document.createElement('div');
    panel.className = 'mask-panel';
    panel.innerHTML = `
      <div class="mask-panel-head">
        <span class="mask-panel-title" data-tip="Mask Stack editor for the selected shader layer">Mask Stack</span>
        <button class="mask-code-btn" id="mask-code-toggle" data-tip="Show the generated mask code or edit the Fragment Shader">&#60;&#62; Code</button>
        <button class="mask-close" data-tip="Close Mask Stack">×</button>
      </div>
      <div class="mask-body">
        <div class="mask-left-col">
          <div class="mask-section">
            <div class="mask-section-head">
              <span>Mask List</span>
              <div class="mask-add-wrap">
                <button class="mask-add-btn" data-tip="Add a new mask (Primitives, Procedural, Custom, Code)">+ Add</button>
                <div class="mask-add-menu" style="display:none"></div>
              </div>
            </div>
            <div class="mask-list"></div>
          </div>
          <div class="mask-section mask-params-section">
            <div class="mask-section-head"><span>Mask Parameters</span></div>
            <div class="mask-params"></div>
          </div>
          <div class="mask-section mask-code-section" id="mask-code-section" style="display:none">
            <div class="mask-section-head">
              <span id="mask-code-head">Mask Shader</span>
            </div>
            <textarea id="mask-code-editor" class="mask-code-editor" spellcheck="false" autocomplete="off" autocorrect="off"></textarea>
            <div id="mask-code-error" class="mask-code-error"></div>
          </div>
        </div>
        <div class="mask-preview-col">
          <div class="mask-section-head"><span>Mask Stack Preview</span></div>
          <div class="mask-preview-wrap">
            <canvas class="mask-preview-canvas"></canvas>
          </div>
          <div class="mask-preview-hint" data-tip="Interaction guide for the Mask Stack Preview canvas">Selected mask shows a Bounding Box: drag inside to move, drag 8 handles to scale, drag the top rotation handle to rotate · Free Form Bezier: drag anchor = move, drag green/blue handles = bend, click segment = add anchor, right-click anchor = delete, double-click anchor = Smooth/Corner, Alt + double-click = delete, Alt + drag handle = independent handles, Ctrl/Cmd + click handle = reset handle</div>
        </div>
      </div>
    `;
    overlay.appendChild(panel);
    document.body.appendChild(overlay);

    panel.querySelector('.mask-close').addEventListener('click', close);

    // ── Code area (view generated GLSL / edit user fragment shader) ──
    const codeToggle = panel.querySelector('#mask-code-toggle');
    const codeSection = panel.querySelector('#mask-code-section');
    const codeEditor = panel.querySelector('#mask-code-editor');
    const codeHead = panel.querySelector('#mask-code-head');
    const codeError = panel.querySelector('#mask-code-error');

    codeToggle.addEventListener('click', () => {
      maskCodeVisible = !maskCodeVisible;
      codeSection.style.display = maskCodeVisible ? 'flex' : 'none';
      codeToggle.classList.toggle('active', maskCodeVisible);
      if (maskCodeVisible) renderMaskCode();
    });

    codeEditor.addEventListener('input', () => {
      const m = (curLayer.masks || []).find(x => x.id === selectedId);
      if (!m || m.type !== 'code') return;
      m.code = codeEditor.value;
      clearTimeout(maskCodeTimer);
      maskCodeTimer = setTimeout(() => {
        const prog = GL.compileUserMask(m.code);
        if (prog) {
          codeError.textContent = '';
          codeError.classList.remove('visible');
        } else {
          codeError.textContent = '⚠ Shader compilation failed (see console)';
          codeError.classList.add('visible');
        }
        afterChange();
        renderPreview();
      }, 300);
    });

    // Add menu
    const addWrap = panel.querySelector('.mask-add-wrap');
    const addBtn = panel.querySelector('.mask-add-btn');
    const menu = panel.querySelector('.mask-add-menu');
    const groups = {
      'Primitives': ['circle','ellipse','rect','rrect','square','polygon','star','line'],
      'Procedural': ['noise'],
      'Custom': ['freeform'],
      'Code': ['code'],
    };
    for (const g in groups) {
      const gEl = document.createElement('div'); gEl.className = 'mask-add-group';
      gEl.textContent = g;
      menu.appendChild(gEl);
      for (const t of groups[g]) {
        const it = document.createElement('div');
        it.className = 'mask-add-item';
        it.textContent = MASK_TYPES[t].label;
        it.addEventListener('click', () => {
          addMask(t);
          menu.style.display = 'none';
        });
        menu.appendChild(it);
      }
    }
    addBtn.addEventListener('click', e => {
      e.stopPropagation();
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', function hideMenu(e){
      if (!addWrap.contains(e.target)) menu.style.display = 'none';
    });

    previewCvs = panel.querySelector('.mask-preview-canvas');
    previewCvs.addEventListener('pointerdown', onPreviewDown);
    previewCvs.addEventListener('pointermove', onPreviewMove);
    previewCvs.addEventListener('pointerup', onPreviewUp);
    previewCvs.addEventListener('pointerleave', onPreviewUp);
    previewCvs.addEventListener('dblclick', onPreviewDblClick);
    previewCvs.addEventListener('contextmenu', e => e.preventDefault());
  }

  function onPreviewDblClick(e) {
    const m = (curLayer.masks || []).find(x => x.id === selectedId);

    if (!m || m.type !== 'freeform') return;

    const r = previewCvs.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * previewCvs.width;
    const py = (e.clientY - r.top) / r.height * previewCvs.height;

    const anchors = ensureFreeformAnchors(m);
    const vi = nearestVertex(m, px, py);

    if (vi < 0) return;

    if (e.altKey) {
      if (anchors.length > 3) {
        anchors.splice(vi, 1);

        if (selectedAnchor === vi) selectedAnchor = -1;
        if (selectedAnchor > vi) selectedAnchor--;
      } else {
        setStatus('Free Form must have at least 3 anchors', 'error');
      }
    } else {
      toggleFreeAnchorMode(m, vi);
      selectedAnchor = vi;
    }

    afterChange();
    renderPreview();
  }

  function addMask(type) {
    if (!curLayer) return;
    if ((curLayer.masks || []).length >= MASKS_MAX) {
      setStatus('Max ' + MASKS_MAX + ' masks per layer reached', 'error');
      return;
    }
    const m = MaskModel.create(type);
    curLayer.masks.push(m);
    selectedId = m.id;
    selectedAnchor = -1;
    afterChange();
    renderList();
    renderParams();
    renderPreview();
  }

  function removeMask(id) {
    if (!curLayer) return;
    curLayer.masks = curLayer.masks.filter(m => m.id !== id);
    if (selectedId === id) selectedId = curLayer.masks.length ? curLayer.masks[curLayer.masks.length - 1].id : null;
    selectedAnchor = -1;
    afterChange();
    renderList();
    renderParams();
    renderPreview();
  }

  function afterChange() {
    if (curKind === 'shader') ShaderLayers.renderList(); else ShaderLayers.renderList();
    renderPreview();
    renderMaskCode();
    updateMasterMaskButton();
    UndoRedo.push();
  }

  function renderList() {
    if (!panel) return;
    const listEl = panel.querySelector('.mask-list');
    listEl.innerHTML = '';
    (curLayer.masks || []).forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'mask-item' + (m.id === selectedId ? ' selected' : '');
      row.draggable = true;
      row.dataset.id = m.id;

      const vis = document.createElement('button');
      vis.className = 'mask-vis' + (m.enabled ? '' : ' off');
      vis.textContent = m.enabled ? '◉' : '○';
      vis.addEventListener('click', e => { e.stopPropagation(); m.enabled = !m.enabled; afterChange(); renderList(); renderParams(); });

      const name = document.createElement('span');
      name.className = 'mask-name';
      name.textContent = (i + 1) + '. ' + (m.name || MASK_TYPES[m.type].label);

      const del = document.createElement('button');
      del.className = 'mask-del';
      del.textContent = '×';
      del.addEventListener('click', e => { e.stopPropagation(); removeMask(m.id); });

      vis.setAttribute('data-tip', 'Enable / disable the mask');
      name.setAttribute('data-tip', 'Double-click to rename the mask');
      del.setAttribute('data-tip', 'Delete the mask');
      row.append(vis, name, del);
      row.addEventListener('click', () => {
        // во время редактирования имени ничего не делаем — blur инпута сам
        // зафиксирует/отменит правку и перерисует список
        if (editingId) return;
        // НЕ перестраиваем список, если маска уже выбрана — иначе между двумя
        // кликами dblclick DOM уничтожается и переименование не запустится.
        if (m.id === selectedId) { renderParams(); renderPreview(); return; }
        selectedId = m.id;
        selectedAnchor = -1;
        renderList();
        renderParams();
        renderPreview();
      });
      // двойной клик по строке — переименование (на уровне строки, чтобы
      // перестроение списка по клику не мешало запуску редактирования)
      row.addEventListener('dblclick', e => {
        e.stopPropagation();
        const nm = row.querySelector('.mask-name');
        if (nm) startRename(row, m, nm);
      });

      row.addEventListener('dragstart', e => { row.classList.add('dragging'); e.dataTransfer.setData('text/plain', m.id); });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', e => e.preventDefault());
      row.addEventListener('drop', e => {
        e.preventDefault();
        const fromId = e.dataTransfer.getData('text/plain');
        const arr = curLayer.masks;
        const fi = arr.findIndex(x => x.id === fromId);
        const ti = arr.findIndex(x => x.id === m.id);
        if (fi === -1 || ti === -1 || fi === ti) return;
        const [mv] = arr.splice(fi, 1);
        arr.splice(ti, 0, mv);
        afterChange(); renderList(); renderPreview();
      });

      listEl.appendChild(row);
    });

    if (curLayer.masks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'mask-empty';
      empty.textContent = 'No masks. Use “+ Add”.';
      listEl.appendChild(empty);
    }
  }

  function renameMask(m, newName) {
    if (newName && newName.trim()) m.name = newName.trim();
    editingId = null;
    renderList();
    afterChange();
  }

  function startRename(row, m, nameEl) {
    if (editingId) return;                       // уже идёт редактирование — не накладываем
    if (row.querySelector('.mask-rename')) return;
    editingId = m.id;
    const input = document.createElement('input');
    input.className = 'mask-rename';
    input.value = m.name || MASK_TYPES[m.type].label;
    input.style.flex = '1';
    input.style.fontSize = '11px';
    nameEl.replaceWith(input);
    input.focus();
    input.select();
    const commit = () => renameMask(m, input.value);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.stopPropagation(); editingId = null; renderList(); }
    });
    input.addEventListener('blur', commit);
  }

  function slider(parent, label, min, max, step, value, onInput) {
    const row = document.createElement('div');
    row.className = 'mask-field';
    const lab = document.createElement('label');
    lab.textContent = label;
    const inp = document.createElement('input');
    inp.type = 'range';
    inp.className = 'u-slider';
    inp.min = min; inp.max = max; inp.step = step; inp.value = value;
    const val = document.createElement('span');
    val.className = 'mask-val';
    val.textContent = (typeof value === 'number') ? (step >= 1 ? value.toFixed(0) : value.toFixed(2)) : value;
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      val.textContent = step >= 1 ? v.toFixed(0) : v.toFixed(2);
      onInput(v);
    });
    inp.addEventListener('change', () => { afterChange(); });
    row.setAttribute('data-tip', label + ' of the current mask');
    row.append(lab, inp, val);
    parent.appendChild(row);
  }

  function checkbox(parent, label, value, onChange) {
    const row = document.createElement('div');
    row.className = 'mask-field mask-check';
    const lab = document.createElement('label');
    lab.textContent = label;
    const inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.checked = !!value;
    inp.addEventListener('change', () => { onChange(inp.checked); afterChange(); });
    row.setAttribute('data-tip', label + ' of the current mask');
    row.append(lab, inp);
    parent.appendChild(row);
  }

  function dropdown(parent, label, options, value, onChange) {
    const row = document.createElement('div');
    row.className = 'mask-field mask-check';
    const lab = document.createElement('label');
    lab.textContent = label;
    const sel = document.createElement('select');
    sel.className = 'mask-select';
    for (const [val, txt] of options) {
      const opt = document.createElement('option');
      opt.value = val; opt.textContent = txt;
      if (val === value) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', () => { onChange(sel.value); afterChange(); });
    row.setAttribute('data-tip', label + ' of the current mask');
    row.append(lab, sel);
    parent.appendChild(row);
  }

  function renderParams() {
    if (!panel) return;
    const host = panel.querySelector('.mask-params');
    host.innerHTML = '';
    // живое обновление области <>Code при изменении любого параметра
    host.addEventListener('input', () => renderMaskCode());
    host.addEventListener('change', () => renderMaskCode());
    const m = (curLayer.masks || []).find(x => x.id === selectedId);
    if (!m) {
      host.innerHTML = '<div class="mask-empty">Select a mask to edit its parameters.</div>';
      return;
    }

    const title = document.createElement('div');
    title.className = 'mask-params-title';
    title.setAttribute('data-tip', 'Parameters for the selected mask type');
    title.textContent = MASK_TYPES[m.type].label + ' — Parameters';
    host.appendChild(title);

    checkbox(host, 'Enable', m.enabled, v => { m.enabled = v; renderList(); });
    checkbox(host, 'Invert', m.invert, v => { m.invert = v; });
    slider(host, 'Strength', 0, 1, 0.01, m.strength, v => { m.strength = v; });
    slider(host, 'Feather', 0, 1, 0.01, m.feather, v => { m.feather = v; });

    if (MASK_TYPES[m.type].primitive && m.type !== 'noise') {
      slider(host, 'Edge Uneven', 0, 1, 0.01, m.uneven || 0, v => { m.uneven = v; });
      dropdown(host, 'Edge Uneven Type', [['soft','Soft'],['sharp','Sharp']], m.unevenType || 'soft',
        v => { m.unevenType = v; });
    }

    if (MASK_TYPES[m.type].primitive && m.type !== 'noise') {
      slider(host, 'Center X', 0, 1, 0.01, m.cx, v => { m.cx = v; });
      slider(host, 'Center Y', 0, 1, 0.01, m.cy, v => { m.cy = v; });
      slider(host, 'Size X', 0.01, 1, 0.01, m.sx, v => { m.sx = v; });
      if (m.type !== 'circle' && m.type !== 'square') {
        slider(host, 'Size Y', 0.01, 1, 0.01, m.sy, v => { m.sy = v; });
      }
      slider(host, 'Rotation', 0, 6.2832, 0.01, m.rot, v => { m.rot = v; });
      if (m.type === 'polygon') slider(host, 'Sides', 3, 12, 1, m.sides, v => { m.sides = v; });
      if (m.type === 'star') slider(host, 'Points', 3, 16, 1, m.points, v => { m.points = v; });
      if (m.type === 'rrect') slider(host, 'Corner Radius', 0, 0.5, 0.01, m.radius, v => { m.radius = v; });
      if (m.type === 'line') slider(host, 'Thickness', 0.005, 0.5, 0.005, m.thickness, v => { m.thickness = v; });
    }

    if (m.type === 'noise') {
      dropdown(host, 'Noise Type', NOISE_TYPES, m.noiseType || 'fbm', v => { m.noiseType = v; });
      slider(host, 'Scale', 0.5, 30, 0.1, m.scale, v => { m.scale = v; });
      slider(host, 'Speed', 0, 3, 0.01, m.speed, v => { m.speed = v; });
      slider(host, 'Threshold', 0, 1, 0.01, m.threshold, v => { m.threshold = v; });
    }

    if (m.type === 'freeform') {
      buildFreeformUI(host, m);
    }

    renderMaskCode();
  }

  // ── PREVIEW (live canvas with dashed mask boundaries) ──
  // Координаты строятся в той же системе, что и шейдер маски:
  // шейдер делает p.x *= aspect (aspect = ширина/высота канваса),
  // поэтому здесь мы переводим «shader-space» точку границы в пиксели превью
  // через uv = center + (bx/aspect, by), px = uv*Sx, py = (1-uv)*Sy.
  // Пунктир всегда рисуется по БАЗОВОЙ форме (Edge Uneven его не искажает —
  // он влияет только на итоговый рендер маски).

  // Перевод shader-space точки (bx,by) маски в пиксели превью.
  function shaderToScreen(m, bx, by) {
    const uvx = m.cx + bx / pvAspect;
    const uvy = m.cy + by;
    return [uvx * pvSx, (1 - uvy) * pvSy];
  }

  // Граница маски в shader-space (без Edge Uneven), повёрнутая на m.rot.
  function maskBoundaryPoint(m, t) {
    const rot = m.rot;
    function rot2(x, y) {
      const c = Math.cos(rot), s = Math.sin(rot);
      return [x * c - y * s, x * s + y * c];
    }
    switch (m.type) {
      case 'circle': {
        const r = m.sx;
        return rot2(Math.cos(t) * r, Math.sin(t) * r);
      }
      case 'ellipse': {
        const [x, y] = rot2(Math.cos(t) * m.sx, Math.sin(t) * m.sy);
        return [x, y];
      }
      case 'square':
      case 'rect': {
        // контур прямоугольника (4 угла), с поворотом
        const hw = m.sx, hh = m.sy;
        const cor = [
          [-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]
        ];
        const N = cor.length;
        const seg = Math.PI * 2 / N;
        const a = t;
        const k = Math.floor(a / seg);
        const local = a - k * seg;
        const p0 = cor[((k % N) + N) % N];
        const p1 = cor[(((k + 1) % N) + N) % N];
        const f = local / seg;
        return rot2(p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f);
      }
      case 'rrect': {
        // округлённый прямоугольник в shader-space (соответствует рендеру маски).
        // Обходим периметр: верх → ПВ угол → право → НП угол → низ → НЛ угол →
        // лево → ВЛ угол, по часовой стрелке. du — длина, пройденная по t.
        const hw = m.sx, hh = m.sy;
        const r = Math.min(m.radius || 0, hw, hh);
        const straight = 2 * ((hw - r) + (hh - r));
        const round = 2 * Math.PI * r;
        const peri = straight + round;
        let d = t / (Math.PI * 2) * peri;
        // каждый сегмент: функция возвращает точку и уменьшает d на свою длину
        const segTop = () => { const f = d / (hw - r); d -= (hw - r); return [-hw + r + f * 2 * (hw - r), hh]; };
        const arcTR  = () => { const a = Math.PI / 2 - d / r; d -= (Math.PI / 2) * r; return [hw - r + Math.cos(a) * r, hh - r + Math.sin(a) * r]; };
        const segR   = () => { const f = d / (hh - r); d -= (hh - r); return [hw, hh - r - f * 2 * (hh - r)]; };
        const arcBR  = () => { const a = 0 - d / r; d -= (Math.PI / 2) * r; return [hw - r + Math.cos(a) * r, -hh + r + Math.sin(a) * r]; };
        const segBot = () => { const f = d / (hw - r); d -= (hw - r); return [hw - r - f * 2 * (hw - r), -hh]; };
        const arcBL  = () => { const a = -Math.PI / 2 - d / r; d -= (Math.PI / 2) * r; return [-hw + r + Math.cos(a) * r, -hh + r + Math.sin(a) * r]; };
        const segL   = () => { const f = d / (hh - r); d -= (hh - r); return [-hw, -hh + r + f * 2 * (hh - r)]; };
        const arcTL  = () => { const a = -Math.PI - d / r; d -= (Math.PI / 2) * r; return [-hw + r + Math.cos(a) * r, hh - r + Math.sin(a) * r]; };
        const edges = [segTop, arcTR, segR, arcBR, segBot, arcBL, segL, arcTL];
        for (const e of edges) {
          if (d <= 0) { const p = e(); return rot2(p[0], p[1]); }
        }
        const p = edges[edges.length - 1]();
        return rot2(p[0], p[1]);
      }
      case 'line': {
        const hw = m.sx, hh = m.thickness * 0.5;
        const cor = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
        const N = cor.length, s2 = Math.PI * 2 / N;
        const k = Math.floor(t / s2);
        const f = (t - k * s2) / s2;
        const p0 = cor[((k % N) + N) % N], p1 = cor[(((k + 1) % N) + N) % N];
        return rot2(p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f);
      }
      case 'polygon': {
        const n = Math.max(3, Math.round(m.sides));
        const R = m.sx;
        const seg = Math.PI * 2 / n;
        const a = t - Math.PI / 2;
        const k = Math.floor(a / seg);
        const f = (a - k * seg) / seg;
        const p0 = [Math.cos(k * seg + Math.PI / 2) * R, Math.sin(k * seg + Math.PI / 2) * R];
        const p1 = [Math.cos((k + 1) * seg + Math.PI / 2) * R, Math.sin((k + 1) * seg + Math.PI / 2) * R];
        return rot2(p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f);
      }
      case 'star': {
        const n = Math.max(3, Math.round(m.points)) * 2;
        const R = m.sx, rin = m.sx * 0.5;
        const seg = Math.PI * 2 / n;
        const a = t - Math.PI / 2;
        const k = Math.floor(a / seg);
        const f = (a - k * seg) / seg;
        const rr = (k % 2 === 0) ? R : rin;
        const rr2 = (((k + 1) % 2) === 0) ? R : rin;
        const p0 = [Math.cos(k * seg + Math.PI / 2) * rr, Math.sin(k * seg + Math.PI / 2) * rr];
        const p1 = [Math.cos((k + 1) * seg + Math.PI / 2) * rr2, Math.sin((k + 1) * seg + Math.PI / 2) * rr2];
        return rot2(p0[0] + (p1[0] - p0[0]) * f, p0[1] + (p1[1] - p0[1]) * f);
      }
      default: {
        const r = m.sx;
        return rot2(Math.cos(t) * r, Math.sin(t) * r);
      }
    }
  }

  function maskPath(ctx, m) {
    ctx.beginPath();
      if (m.type === 'code') return;   // у пользовательского шейдера нет геометрии для пунктира
      if (m.type === 'freeform') {
        const pts = flattenFreeformMask(m, FREE_MAX_PREVIEW_POINTS);

        if (pts.length === 0) return;

        for (let i = 0; i <= pts.length; i++) {
          const p = pts[i % pts.length];
          const [px, py] = shaderToScreen(m, p.x, p.y);

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }

        ctx.closePath();
        return;
      }
    const N = 200;
    for (let i = 0; i <= N; i++) {
      const t = (Math.PI * 2 / N) * i;
      const [bx, by] = maskBoundaryPoint(m, t);
      const [px, py] = shaderToScreen(m, bx, by);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // Ограничивающий прямоугольник фигуры (примитива) в shader-space,
  // полученный сэмплированием границы maskBoundaryPoint.
  function maskBBoxShader(m) {
    let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    const N = 128;
    for (let i = 0; i < N; i++) {
      const [bx, by] = maskBoundaryPoint(m, (Math.PI * 2 / N) * i);
      if (bx < minx) minx = bx; if (bx > maxx) maxx = bx;
      if (by < miny) miny = by; if (by > maxy) maxy = by;
    }
    return { minx, maxx, miny, maxy };
  }
  function maskBBoxScreen(m) {
    const b = maskBBoxShader(m);
    const [x0, y0] = shaderToScreen(m, b.minx, b.miny);
    const [x1, y1] = shaderToScreen(m, b.maxx, b.maxy);
    return { minx: Math.min(x0, x1), maxx: Math.max(x0, x1), miny: Math.min(y0, y1), maxy: Math.max(y0, y1) };
  }

  // ── Единая система трансформации (Bounding Box, как в Figma) ──
  // Локальные полуразмеры фигуры (в shader-space), по которым строится рамка.
  function localExtents(m) {
    if (m.type === 'circle') return { hw: m.sx, hh: m.sx };
    if (m.type === 'square') { const s = Math.min(m.sx, m.sy); return { hw: s, hh: s }; }
    if (m.type === 'line') return { hw: m.sx, hh: Math.max(0.001, m.thickness * 0.5) };
    // ellipse/rect/rrect/polygon/star — ось X = sx, ось Y = sy (звезда/полигон вписаны в радиус sx)
    if (m.type === 'polygon' || m.type === 'star') return { hw: m.sx, hh: m.sx };
    return { hw: m.sx, hh: m.sy };
  }
  // Локальная точка (lx,ly) → экран (с учётом rot и центра)
  function localToScreen(m, lx, ly) {
    const c = Math.cos(m.rot), s = Math.sin(m.rot);
    const bx = lx * c - ly * s, by = lx * s + ly * c;
    return shaderToScreen(m, bx, by);
  }
  // Локальная точка → UV (мировые координаты)
  function localToUV(m, lx, ly) {
    const c = Math.cos(m.rot), s = Math.sin(m.rot);
    const bx = lx * c - ly * s, by = lx * s + ly * c;
    return { x: m.cx + bx / pvAspect, y: m.cy + by };
  }
  // UV → локальная точка (обратное преобразование)
  function uvToLocal(m, uvx, uvy) {
    const bx = (uvx - m.cx) * pvAspect, by = uvy - m.cy;
    const c = Math.cos(m.rot), s = Math.sin(m.rot);
    return { x: bx * c + by * s, y: -bx * s + by * c };
  }
  // Определения ручек Bounding Box (в локальных координатах)
  const HANDLE_DEFS = {
    tl: { lx: -1, ly: 1,  cursor: 'nwse-resize' },
    tr: { lx: 1,  ly: 1,  cursor: 'nesw-resize' },
    br: { lx: 1,  ly: -1, cursor: 'nwse-resize' },
    bl: { lx: -1, ly: -1, cursor: 'nesw-resize' },
    t:  { lx: 0,  ly: 1,  cursor: 'ns-resize' },
    r:  { lx: 1,  ly: 0,  cursor: 'ew-resize' },
    b:  { lx: 0,  ly: -1, cursor: 'ns-resize' },
    l:  { lx: -1, ly: 0,  cursor: 'ew-resize' },
  };
  function handleLocalPos(m, name, hw, hh) {
    const d = HANDLE_DEFS[name];
    return { x: d.lx * hw, y: d.ly * hh };
  }
  // Экранные позиции 8 ручек Bounding Box
  function handleScreenPositions(m) {
    const { hw, hh } = localExtents(m);
    const pos = {};
    for (const k in HANDLE_DEFS) {
      const lp = handleLocalPos(m, k, hw, hh);
      pos[k] = localToScreen(m, lp.x, lp.y);
    }
    return pos;
  }
  function rotationHandleScreen(m) {
    const { hw, hh } = localExtents(m);
    const gap = 22 * pvScale;
    // точка на 0.5*scale выше верхней середины, в UV
    const topUV = localToUV(m, 0, hh);
    const up = { x: 0, y: gap / (pvSx) }; // маленький сдвиг вверх в UV-экранных пикселях
    // проще: сдвинуть верхнюю середину вверх на gap пикселей экрана
    const [tx, ty] = localToScreen(m, 0, hh);
    return [tx, ty - gap];
  }
  // Какая ручка (или 'rot') под курсором? возвращает имя или null
  function handleAtCursor(m, px, py) {
    const pos = handleScreenPositions(m);
    for (const k of ['tl','tr','br','bl','t','r','b','l']) {
      const [hx, hy] = pos[k];
      if (Math.abs(px - hx) <= HITR() && Math.abs(py - hy) <= HITR()) return k;
    }
    const [rx, ry] = rotationHandleScreen(m);
    if (Math.abs(px - rx) <= HITR() && Math.abs(py - ry) <= HITR()) return 'rot';
    return null;
  }
  // Находится ли точка внутри Bounding Box (в локальных координатах по модулю <= hw,hh)
  function pointInBBox(m, px, py) {
    const uvx = px / pvSx, uvy = 1 - py / pvSy;
    const lp = uvToLocal(m, uvx, uvy);
    const { hw, hh } = localExtents(m);
    return Math.abs(lp.x) <= hw * 1.02 && Math.abs(lp.y) <= hh * 1.02;
  }
  function freeformBBoxShader(m) {
    let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;

    for (const p of freeAnchorPositions(m)) {
      if (p.x < minx) minx = p.x;
      if (p.x > maxx) maxx = p.x;
      if (p.y < miny) miny = p.y;
      if (p.y > maxy) maxy = p.y;
    }

    return { minx, maxx, miny, maxy };
  }
  function freeformBBoxScreen(m) {
    const b = freeformBBoxShader(m);
    const [x0, y0] = shaderToScreen(m, b.minx, b.miny);
    const [x1, y1] = shaderToScreen(m, b.maxx, b.maxy);
    return { minx: Math.min(x0, x1), maxx: Math.max(x0, x1), miny: Math.min(y0, y1), maxy: Math.max(y0, y1) };
  }

  function pointInMask(m, px, py) {
    // в shader-space: bx = (uvx-cx)*aspect, by = uvy-cy
    const uvx = px / pvSx, uvy = 1 - py / pvSy;
    let bx = (uvx - m.cx) * pvAspect;
    let by = uvy - m.cy;
    if (m.type === 'freeform') {
      const pts = freeAnchorPositions(m);
      if (pts.length < 3) return false;
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
        if (((yi > by) !== (yj > by)) && (bx < (xj - xi) * (by - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }
    // поворот назад на -rot
    const c = Math.cos(-m.rot), s = Math.sin(-m.rot);
    const rx = bx * c - by * s, ry = bx * s + by * c;
    let inside;
    if (m.type === 'circle') inside = (rx * rx + ry * ry) <= (m.sx * m.sx * 1.15 * 1.15);
    else if (m.type === 'line') inside = (Math.abs(rx) <= m.sx * 1.15) && (Math.abs(ry) <= m.thickness * 0.5 * 1.15);
    else inside = (Math.abs(rx) <= m.sx * 1.15) && (Math.abs(ry) <= m.sy * 1.15);
    return inside;
  }

  function screenToShader(px, py) {
    const uvx = px / pvSx, uvy = 1 - py / pvSy;
    return { x: (uvx - 0) * pvAspect, y: uvy };   // относительно глобального центра UV (0,0)
  }

  function drawPreview() {
    if (!previewCvs || !curLayer) return;
    // Холст превью делаем того же разрешения, что и основной GL-канвас («другие
    // preview окна» плагина), чтобы фон и пунктир границ не растягивались и
    // совпадали с отрисованной маской (шейдер делает p.x *= aspect).
    const wrap = previewCvs.parentElement;
    const glCanvas = document.getElementById('gl-canvas');
    let rw = 512, rh = 512;
    if (glCanvas && glCanvas.height > 0) { rw = glCanvas.width; rh = glCanvas.height; }
    // внутреннее разрешение — как у GL-канваса (с ограничением, чтобы не было гигантским)
    const cap = 1600;
    const sc = Math.min(1, cap / Math.max(rw, rh));
    const iw = Math.max(2, Math.round(rw * sc));
    const ih = Math.max(2, Math.round(rh * sc));
    // CSS-размер — вписываем в доступное место, сохраняя пропорции (без искажения)
    const aw = Math.max(120, wrap.clientWidth - 24);
    const ah = Math.max(120, wrap.clientHeight - 24);
    let cw = aw, ch = Math.floor(cw * ih / iw);
    if (ch > ah) { ch = ah; cw = Math.floor(ch * iw / ih); }
    // Всегда сбрасываем размер — это гарантированно очищает холст и
    // убирает «шлейфы» от пунктира/маски при перетаскивании.
    previewCvs.width = iw;
    previewCvs.height = ih;
    previewCvs.style.width = cw + 'px';
    previewCvs.style.height = ch + 'px';
    const W = iw, H = ih;
    pvSx = iw; pvSy = ih; pvAspect = iw / ih;
    // масштаб оформления относительно базового разрешения 512, чтобы толщина
    // пунктира/точек была одинаковой на экране при любом разрешении канваса
    const SCALE = W / 512;
    pvScale = SCALE;
    const ctx = previewCvs.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    // Фон — живое превью того раздела, из которого вызван Mask Stack
    // (Generator Preview для генератор-слоя, Effect Preview для эффект-слоя).
    try {
      const glCanvas = document.getElementById('gl-canvas');
      if (glCanvas && glCanvas.width > 0) {
        ctx.drawImage(glCanvas, 0, 0, W, H);
      } else {
        ctx.fillStyle = '#1a1a1e';
        ctx.fillRect(0, 0, W, H);
      }
    } catch (e) {
      ctx.fillStyle = '#1a1a1e';
      ctx.fillRect(0, 0, W, H);
    }
    // рамкаCanvas
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
    // сетка
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 8; i++) {
      const p = i / 8 * W;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, H); ctx.stroke();
      const q = i / 8 * H;
      ctx.beginPath(); ctx.moveTo(0, q); ctx.lineTo(W, q); ctx.stroke();
    }

    (curLayer.masks || []).forEach(m => {
      if (!m.enabled) return;
      maskPath(ctx, m);
      const sel = m.id === selectedId;
      ctx.setLineDash([6 * SCALE, 4 * SCALE]);
      ctx.lineWidth = (sel ? 2.5 : 1.5) * SCALE;

// Плавный шум
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));

  for (int i = 0; i < 5; i++) {
    value += amplitude * noise(p);
    p *= 2.0;
    amplitude *= 0.5;
  }
  return value;

//   ⚠️  Интенсивные блюры (большой радиус) работают медленно.
//       Лучше делать два прохода (горизонталь + вертикаль) двумя
//       отдельными шейдерами в Layer Effects.
//
//   ⚠️  gl_FragColor.a — не забывай про альфу, иначе эффект
//       будет непрозрачным поверх прозрачных слоёв.
//
//   ⚠️  Избегай ветвлений (if/else) внутри циклов — на GPU
//       все ветки выполняются всегда, это дорого.
//       Используй step() и mix() вместо if:
//       float mask = step(0.5, brightness);  // 0 или 1
//       color = mix(colorA, colorB, mask);
//
// ─── РАБОЧИЙ ПРИМЕР: Sharpen + Vignette + Tint ───────────────

precision mediump float;

uniform float uSharpness;   // сила резкости
uniform float uVignette;    // сила виньетки
uniform vec3  uTintColor;   // color
uniform float uTintAmount;  // смешение тинта

void main() {
  if (uHasTexture == 0) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
    return;
  }

  vec2 uv     = gl_FragCoord.xy / iResolution.xy;
  vec2 texel  = 1.0 / iResolution.xy;

  // ── Unsharp Mask (резкость) ──────────────────────────────
  vec4 center = texture2D(uTexture, uv);
  vec4 blur   =
    texture2D(uTexture, uv + texel * vec2(-1.0,  0.0)) +
    texture2D(uTexture, uv + texel * vec2( 1.0,  0.0)) +
    texture2D(uTexture, uv + texel * vec2( 0.0, -1.0)) +
    texture2D(uTexture, uv + texel * vec2( 0.0,  1.0));
  blur /= 4.0;

  vec3 sharp = center.rgb + (center.rgb - blur.rgb) * uSharpness;
  sharp = clamp(sharp, 0.0, 1.0);

  // ── Цветовой тинт ────────────────────────────────────────
  vec3 tinted = mix(sharp, sharp * uTintColor * 2.0, uTintAmount);

  // ── Виньетка ──────────────────────────────────────────────
  float vig = uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);
  vig = pow(max(vig * 16.0, 0.0), uVignette);
  tinted *= vig;

  gl_FragColor = vec4(tinted, center.a);
}`,
    uniforms: [
      { name: 'uSharpness',   type: 'float',     value: 1.5, min: 0.0, max: 5.0  },
      { name: 'uVignette',    type: 'float',     value: 0.4, min: 0.0, max: 1.0  },
      { name: 'uTintColor',   type: 'vec3color', value: [1.0, 0.9, 0.8] },
      { name: 'uTintAmount',  type: 'float',     value: 0.2, min: 0.0, max: 1.0  },
    ]
  },
];

// Рендер миниатюры
function renderThumb(canvas, preset, isEffect) {
  try {
    const tgl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!tgl) return;

    function compSh(type, src) {
      const sh = tgl.createShader(type);
      tgl.shaderSource(sh, src);
      tgl.compileShader(sh);
      if (!tgl.getShaderParameter(sh, tgl.COMPILE_STATUS)) { tgl.deleteShader(sh); return null; }
      return sh;
    }

    function buildProg(fragSrc) {
      const BUILTIN = ['iResolution','iTime','iMouse','uTexture','uHasTexture'];
      let cleaned = fragSrc;
      for (const name of BUILTIN) {
        const re = new RegExp(`^[ \\t]*uniform\\s+\\w+\\s+${name}\\s*;`, 'gm');
        cleaned = cleaned.replace(re, `// ${name}`);
      }
      const fSrc = `precision mediump float;
uniform vec2 iResolution; uniform float iTime; uniform vec2 iMouse;
uniform sampler2D uTexture; uniform int uHasTexture;
` + cleaned;
      const vs = compSh(tgl.VERTEX_SHADER, `attribute vec2 aPos; void main(){gl_Position=vec4(aPos,0,1);}`);
      const fs = compSh(tgl.FRAGMENT_SHADER, fSrc);
      if (!vs || !fs) return null;
      const p = tgl.createProgram();
      tgl.attachShader(p, vs); tgl.attachShader(p, fs);
      tgl.linkProgram(p);
      tgl.deleteShader(vs); tgl.deleteShader(fs);
      return tgl.getProgramParameter(p, tgl.LINK_STATUS) ? p : null;
    }

    function setU(prog, name, type, val) {
      const loc = tgl.getUniformLocation(prog, name);
      if (!loc) return;
      if (type === 'vec2')  tgl.uniform2fv(loc, val);
      else if (type === 'float') tgl.uniform1f(loc, val);
      else if (type === 'int')   tgl.uniform1i(loc, val);
      else if (type === 'vec3' || type === 'vec3color') tgl.uniform3fv(loc, val);
    }

    function drawQuad(prog, inputTex, hasT, uniforms, time) {
      tgl.useProgram(prog);
      setU(prog, 'iResolution', 'vec2', [canvas.width, canvas.height]);
      setU(prog, 'iTime', 'float', time);
      setU(prog, 'iMouse', 'vec2', [0.5, 0.5]);

      tgl.activeTexture(tgl.TEXTURE0);
      tgl.bindTexture(tgl.TEXTURE_2D, inputTex || null);
      const texLoc = tgl.getUniformLocation(prog, 'uTexture');
      if (texLoc) tgl.uniform1i(texLoc, 0);
      const hasLoc = tgl.getUniformLocation(prog, 'uHasTexture');
      if (hasLoc) tgl.uniform1i(hasLoc, hasT ? 1 : 0);

      for (const u of (uniforms || [])) setU(prog, u.name, u.type, u.value);

      const posLoc = tgl.getAttribLocation(prog, 'aPos');
      tgl.bindBuffer(tgl.ARRAY_BUFFER, quadB);
      tgl.enableVertexAttribArray(posLoc);
      tgl.vertexAttribPointer(posLoc, 2, tgl.FLOAT, false, 0, 0);
      tgl.drawArrays(tgl.TRIANGLE_STRIP, 0, 4);
    }

    const quadB = tgl.createBuffer();
    tgl.bindBuffer(tgl.ARRAY_BUFFER, quadB);
    tgl.bufferData(tgl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), tgl.STATIC_DRAW);

    const w = canvas.width, h = canvas.height;

    if (isEffect) {
      const gradPreset = PRESETS.find(p => p.name.includes('Gradient Waves'));
      if (!gradPreset) return;

      const baseProg = buildProg(gradPreset.code);
      if (!baseProg) return;

      const baseTex = tgl.createTexture();
      tgl.bindTexture(tgl.TEXTURE_2D, baseTex);
      tgl.texImage2D(tgl.TEXTURE_2D, 0, tgl.RGBA, w, h, 0, tgl.RGBA, tgl.UNSIGNED_BYTE, null);
      tgl.texParameteri(tgl.TEXTURE_2D, tgl.TEXTURE_MIN_FILTER, tgl.LINEAR);
      tgl.texParameteri(tgl.TEXTURE_2D, tgl.TEXTURE_MAG_FILTER, tgl.LINEAR);
      tgl.texParameteri(tgl.TEXTURE_2D, tgl.TEXTURE_WRAP_S, tgl.CLAMP_TO_EDGE);
      tgl.texParameteri(tgl.TEXTURE_2D, tgl.TEXTURE_WRAP_T, tgl.CLAMP_TO_EDGE);

      const baseFB = tgl.createFramebuffer();
      tgl.bindFramebuffer(tgl.FRAMEBUFFER, baseFB);
      tgl.framebufferTexture2D(tgl.FRAMEBUFFER, tgl.COLOR_ATTACHMENT0, tgl.TEXTURE_2D, baseTex, 0);
      tgl.viewport(0, 0, w, h);
      tgl.clearColor(0,0,0,1);
      tgl.clear(tgl.COLOR_BUFFER_BIT);
      drawQuad(baseProg, null, false, gradPreset.uniforms, 2.5);

      tgl.bindFramebuffer(tgl.FRAMEBUFFER, null);

      const effectProg = buildProg(preset.code);
      if (!effectProg) return;

      tgl.viewport(0, 0, w, h);
      tgl.clearColor(0,0,0,1);
      tgl.clear(tgl.COLOR_BUFFER_BIT);
      drawQuad(effectProg, baseTex, true, preset.uniforms, 2.0);
    } else {
      const prog = buildProg(preset.code);
      if (!prog) return;
      tgl.viewport(0, 0, w, h);
      tgl.clearColor(0,0,0,1);
      tgl.clear(tgl.COLOR_BUFFER_BIT);
      drawQuad(prog, null, false, preset.uniforms, 2.0);
    }

  } catch(e) { console.warn('Thumb failed:', preset.name, e); }
}

function updateLineNumbers() {
  const textarea = document.getElementById('code-editor');
  const container = document.getElementById('line-numbers');
  const lines = textarea.value.split('\n').length;
  let html = '';
  for (let i = 1; i <= lines; i++) {
    html += `<span class="line-num">${i}</span>`;
  }
  container.innerHTML = html;
  container.scrollTop = textarea.scrollTop;

  const label = document.getElementById('code-editor-label');
  if (label) {
    const lines = textarea.value.split('\n').length;
    const chars = textarea.value.length;
    const active = ShaderLayers.getActive && ShaderLayers.getActive();
    const name = active ? active.name : 'Default shader';
    label.textContent = name + ' · ' + lines + ' lines · ' + chars + ' chars';
  }
}

function setError(msg) {
  const bar = document.getElementById('error-bar');
  const textEl = document.getElementById('error-text');
  const copyBtn = document.getElementById('error-copy');

  if (msg) {
    const cleaned = msg.replace(/\n/g, ' ').trim();
    textEl.textContent = '⚠ ' + cleaned;
    bar.classList.add('visible');

    copyBtn.textContent = 'Copy';
    copyBtn.classList.remove('copied');
    copyBtn.onclick = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = cleaned;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = '✓ Copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      } catch(e) {
        copyBtn.textContent = 'Failed';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      }
    };
  } else {
    textEl.textContent = '';
    bar.classList.remove('visible');
  }
}

function compile() {
  const code = document.getElementById('code-editor').value;
  try {
    GL.buildProgram(code);
    setError(null);
    setStatus('✅ Compiled successfully', 'success');

    const parsed = UniformParser.parse(code);
    S.uniforms = UniformParser.sync(S.uniforms, parsed);
    UniformsUI.renderAll();

    EditorState.generate.code     = code;
    EditorState.generate.uniforms = S.uniforms.map(u => ({
      ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
    }));

    return true;
  } catch(e) {
    setError(e.message);
    setStatus('❌ Compilation failed', 'error');
    return false;
  }
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res(rd.result.split(',')[1]);
    rd.onerror = rej;
    rd.readAsDataURL(blob);
  });
}
