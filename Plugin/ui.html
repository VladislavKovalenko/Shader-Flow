<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #ffffff;
  --bg-1: #f3f3f3;
  --bg-2: #e8e8e8;
  --bg-3: #d0d0d0;
  --border: #191A23;
  --border-focus: #B9FF66;
  --text-0: #191A23;
  --text-1: #191A23;
  --text-2: #444444;
  --text-3: #888888;
  --accent: #B9FF66;
  --accent-hover: #a8f050;
  --danger: #f24822;
  --success: #191A23;
  --radius-s: 7px;
  --radius-m: 14px;
  --radius-l: 45px;
  --font: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

html, body {
  height: 100%;
}
body {
  font-family: var(--font);
  font-size: 13px;
  background: var(--bg-0);
  color: var(--text-1);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }

/* ─── LAYOUT ─── */
#app { display: flex; flex-direction: column; height: 100%; }

/* ─── TOP BAR ─── */
#topbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 12px;
  height: 48px;
  background: var(--bg-0);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-0);
  letter-spacing: -0.2px;
  margin-right: 8px;
  white-space: nowrap;
  font-family: var(--font);
}

.topbar-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  opacity: 0.2;
  margin: 0 6px;
}

.tab-pill {
  padding: 5px 12px;
  border-radius: var(--radius-s);
  font-size: 13px;
  font-weight: 400;
  font-family: var(--font);
  background: none;
  border: none;
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  white-space: nowrap;
  height: 32px;
  display: flex;
  align-items: center;
}
.tab-pill:hover {
  color: var(--text-0);
  background: var(--bg-1);
}
.tab-pill.active {
  background: var(--accent);
  color: var(--text-0);
  font-weight: 500;
  border-radius: var(--radius-s);
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.node-badge {
  font-size: 13px;
  font-family: var(--font);
  color: var(--text-3);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar-undo-btn {
  width: 30px;
  height: 30px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text-2);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.12s;
  font-family: var(--font);
  flex-shrink: 0;
}
.topbar-undo-btn:hover:not(:disabled) {
  border-color: var(--border);
  color: var(--text-0);
  background: var(--accent);
}
.topbar-undo-btn:disabled { opacity: 0.25; cursor: not-allowed; }

/* ─── MAIN ─── */
#main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* ─── LEFT PANEL ─── */
#left-panel {
  width: 224px;
  flex-shrink: 0;
  background: var(--bg-0);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── CENTER ─── */
#center {
  flex: 1;
  display: none;
  flex-direction: column;
  overflow: hidden;
  min-width: 120px;
}

/* ─── EDITOR ─── */
#code-editor-header {
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 36px;
  background: var(--bg-0);
  border-bottom: 1px solid var(--border);
  gap: 8px;
  flex-shrink: 0;
}

#code-editor-label {
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-mono);
}

#editor-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

#code-editor {
  width: 100%;
  height: 100%;
  resize: none;
  background: #fafafa;
  color: #191A23;
  border: none;
  outline: none;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.7;
  padding: 10px 10px 10px 48px;
  tab-size: 2;
  white-space: pre;
  overflow: auto;
  caret-color: var(--border);
  letter-spacing: 0.2px;
}

#line-numbers {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 40px;
  background: var(--bg-1);
  border-right: 1px solid #e0e0e0;
  padding: 10px 0;
  overflow: hidden;
  pointer-events: none;
}
.line-num {
  display: block;
  width: 100%;
  text-align: right;
  padding-right: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.7;
  color: #b0b0b0;
}

/* ─── ERROR BAR ─── */
#error-bar {
  padding: 0 12px;
  height: 0;
  background: #fff0ee;
  border-top: 1px solid #f5c5be;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--danger);
  display: none;
  align-items: center;
  gap: 8px;
  overflow: hidden;
  transition: height 0.15s;
  cursor: text;
  user-select: text;
}
#error-bar.visible {
  display: flex;
  height: 30px;
}
#error-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#error-copy {
  flex-shrink: 0;
  padding: 2px 8px;
  background: rgba(242, 72, 34, 0.08);
  border: 1px solid rgba(242, 72, 34, 0.3);
  border-radius: var(--radius-s);
  color: var(--danger);
  font-family: var(--font);
  font-size: 11px;
  cursor: pointer;
}
#error-copy:hover { background: rgba(242, 72, 34, 0.15); }
#error-copy.copied {
  color: #191A23;
  border-color: var(--accent);
  background: rgba(185, 255, 102, 0.15);
}

/* ─── PANEL DIVIDER ─── */
#panel-divider {
  width: 4px;
  flex-shrink: 0;
  background: var(--border);
  cursor: col-resize;
  position: relative;
  transition: background 0.15s;
  z-index: 10;
}
#panel-divider:hover,
#panel-divider.dragging {
  background: var(--accent);
}
#panel-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 32px;
  border-radius: 1px;
  background: rgba(255,255,255,0.4);
}

/* ─── RIGHT PANEL (PREVIEW) ─── */
#right-panel {
  flex-shrink: 0;
  min-width: 160px;
  background: var(--bg-1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#preview-header {
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 36px;
  background: var(--bg-0);
  border-bottom: 1px solid var(--border);
  gap: 8px;
  flex-shrink: 0;
}

.preview-title {
  font-size: 13px;
  font-family: var(--font);
  color: var(--text-0);
  flex: 1;
  font-weight: 500;
}

.preview-size-label {
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-mono);
}

#preview-canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: repeating-conic-gradient(#ffffff 0% 25%, #b3b3b3 0% 50%) 0 0 / 16px 16px;
}

#gl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

#anim-overlay {
  position: absolute;
  bottom: 8px; right: 8px;
  display: flex; gap: 4px;
}

.anim-btn {
  width: 28px;
  height: 28px;
  background: rgba(255,255,255,0.9);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text-0);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  transition: 0.12s;
  font-family: var(--font);
}
.anim-btn:hover {
  background: var(--accent);
  border-color: var(--border);
}
.anim-btn.active {
  background: var(--accent);
  border-color: var(--border);
  color: var(--text-0);
}

#fps-label {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 10px;
  color: rgba(0,0,0,0.3);
  font-family: var(--font-mono);
  pointer-events: none;
}

/* ─── BOTTOM BAR ─── */
#bottombar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  height: 48px;
  background: var(--bg-0);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#status-label {
  flex: 1;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#status-label.success { color: var(--text-0); }
#status-label.error   { color: var(--danger); }
#status-label.info    { color: var(--text-0); }

/* ─── BUTTONS ─── */
.btn {
  padding: 0 16px;
  height: 34px;
  border-radius: var(--radius-m);
  font-size: 13px;
  font-weight: 400;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  transition: background 0.12s, opacity 0.12s;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: -0.1px;
}

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-0);
}
.btn-ghost:hover {
  background: var(--bg-1);
}
.btn-ghost.active {
  background: var(--accent);
  border-color: var(--border);
  color: var(--text-0);
}

.btn-primary {
  background: var(--accent);
  color: var(--text-0);
  border: 1px solid var(--border);
  box-shadow: 0px 4px 0px 0px var(--border);
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

.btn-secondary {
  background: var(--bg-0);
  color: var(--text-0);
  border: 1px solid var(--border);
  box-shadow: 0px 4px 0px 0px var(--border);
}
.btn-secondary:hover { background: var(--bg-1); }

/* ─── LEFT PANEL INTERNALS ─── */
#left-panel-header {
  padding: 0 12px;
  height: 36px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text-0);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  font-family: var(--font);
  background: var(--bg-1);
}
#left-panel-header span { flex: 1; }

#uniforms-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

/* ── Uniform row ── */
.uniform-row {
  padding: 8px 12px 10px;
  border-bottom: 1px solid #e8e8e8;
}
.uniform-row:hover { background: var(--bg-1); }

.uniform-header {
  display: flex;
  align-items: center;
  margin-bottom: 7px;
  gap: 5px;
}

.uniform-name {
  font-size: 13px;
  color: var(--text-0);
  font-family: var(--font);
  font-weight: 500;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.uniform-type-badge {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-0);
  background: var(--accent);
  border: none;
  padding: 2px 6px;
  border-radius: var(--radius-s);
  font-family: var(--font-mono);
  letter-spacing: 0.2px;
}

.uniform-delete {
  width: 18px;
  height: 18px;
  background: none;
  border: none;
  color: var(--text-3);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-s);
  transition: 0.1s;
  line-height: 1;
  font-family: var(--font);
}
.uniform-delete:hover {
  color: var(--danger);
  background: rgba(242, 72, 34, 0.08);
}

.uniform-value {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-0);
  font-variant-numeric: tabular-nums;
  min-width: 44px;
  text-align: right;
  font-family: var(--font-mono);
}

/* ── Slider ── */
.slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.u-slider {
  -webkit-appearance: none;
  flex: 1;
  height: 16px;
  border-radius: 8px;
  background: var(--bg-3);
  outline: none;
  cursor: pointer;
  margin: 4px 0;
  touch-action: none;
}
.u-slider:hover { background: var(--border); }
.u-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--bg-0);
  border: 2px solid var(--border);
  cursor: pointer;
  transition: box-shadow 0.1s;
}
.u-slider::-webkit-slider-thumb:hover {
  background: var(--accent);
}
.u-slider:focus::-webkit-slider-thumb {
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(185, 255, 102, 0.4);
}

/* ── Color ── */
.u-color-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.u-color-swatch {
  width: 30px;
  height: 22px;
  border-radius: var(--radius-s);
  border: 1px solid var(--border);
  cursor: pointer;
  flex-shrink: 0;
}
.u-color-swatch:hover { border-color: var(--border); box-shadow: 0 0 0 2px var(--accent); }
.u-color-input { display: none; }
.u-color-hex {
  font-size: 12px;
  font-family: var(--font-mono);
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: 3px 6px;
  width: 76px;
  outline: none;
  color: var(--text-0);
}
.u-color-hex:focus { border-color: var(--border); box-shadow: 0 0 0 2px var(--accent); }

/* ── Color Picker Popover ── */
.color-pop {
  position: fixed;
  z-index: 500;
  width: 232px;
  padding: 10px;
  background: var(--bg-1, #1a1c1e);
  border: 1px solid var(--border, #333);
  border-radius: var(--radius-m, 8px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  user-select: none;
}
.color-pop .cp-sv {
  position: relative;
  width: 100%;
  height: 130px;
  border-radius: 4px;
  cursor: crosshair;
  background: hsl(0,100%,50%);
}
.color-pop .cp-sv::before,
.color-pop .cp-sv::after {
  content: ''; position: absolute; inset: 0; border-radius: 4px;
}
.color-pop .cp-sv::before { background: linear-gradient(to right, #fff, rgba(255,255,255,0)); }
.color-pop .cp-sv::after  { background: linear-gradient(to top, #000, rgba(0,0,0,0)); }
.color-pop .cp-sv-handle {
  position: absolute; width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
  transform: translate(-50%, -50%); pointer-events: none;
}
.color-pop .cp-hue {
  position: relative;
  width: 100%; height: 14px; margin-top: 10px; border-radius: 4px; cursor: pointer;
  background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
}
.color-pop .cp-hue-handle {
  position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.6);
  transform: translate(-50%, -50%); pointer-events: none;
}
.color-pop .cp-fields { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.color-pop .cp-group { display: flex; align-items: center; gap: 4px; }
.color-pop .cp-label { width: 32px; font-size: 10px; color: #888; font-family: var(--font-mono, monospace); }
.color-pop .cp-num {
  width: 100%; flex: 1; min-width: 0; background: var(--bg-0, #111);
  border: 1px solid var(--border, #333); border-radius: 4px; color: var(--text-0, #eee);
  padding: 3px 5px; font-size: 11px; outline: none;
}
.color-pop .cp-num:focus { border-color: var(--accent, #b9ff66); }
.color-pop .cp-hex {
  flex: 1; background: var(--bg-0, #111); border: 1px solid var(--border, #333);
  border-radius: 4px; color: var(--text-0, #eee); padding: 3px 6px; font-size: 11px;
  font-family: var(--font-mono, monospace); outline: none; min-width: 0;
}
.color-pop .cp-hex:focus { border-color: var(--accent, #b9ff66); }

/* ── Vec inputs ── */
.u-vec-row { display: flex; gap: 4px; }
.u-vec-input {
  flex: 1;
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text-0);
  font-size: 12px;
  font-family: var(--font-mono);
  padding: 3px 4px;
  outline: none;
  min-width: 0;
  text-align: center;
}
.u-vec-input:focus { box-shadow: 0 0 0 2px var(--accent); }

/* ── Bool toggle ── */
.u-toggle-wrap { display: flex; align-items: center; gap: 8px; }
.u-toggle { position: relative; width: 28px; height: 15px; }
.u-toggle input { opacity: 0; width: 0; height: 0; }
.u-toggle-slider {
  position: absolute; inset: 0;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.u-toggle input:checked + .u-toggle-slider {
  background: var(--accent);
  border-color: var(--border);
}
.u-toggle-slider::before {
  content: '';
  position: absolute;
  width: 11px; height: 11px;
  left: 1px; top: 1px;
  background: var(--bg-0);
  border-radius: 50%;
  transition: transform 0.15s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.u-toggle input:checked + .u-toggle-slider::before { transform: translateX(13px); }
.u-toggle-text { font-size: 13px; color: var(--text-2); font-family: var(--font); }

/* ─── LEFT BOTTOM ─── */
#left-bottom {
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  background: var(--bg-0);
}

/* Resolution row */
.res-row { display: flex; align-items: center; gap: 8px; }
.res-label {
  font-size: 13px;
  color: var(--text-2);
  font-family: var(--font);
  white-space: nowrap;
  min-width: 48px;
}
.res-select {
  flex: 1;
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text-0);
  font-size: 13px;
  font-family: var(--font);
  padding: 5px 24px 5px 8px;
  outline: none;
  cursor: pointer;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23191A23' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 8px center;
}
.res-select:focus { box-shadow: 0 0 0 2px var(--accent); }

/* ─── LIBRARY TREE ─── */
.lib-folder {
  margin: 4px 0;
}
.lib-folder-title {
  font-weight: 600;
  color: #333;
  padding: 4px 6px;
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
}
.lib-folder-title:hover {
  background-color: rgba(0, 0, 0, 0.04);
}
.lib-file {
  padding: 4px 8px;
  margin: 2px 0 2px 8px;
  color: #555;
  border-radius: 4px;
  cursor: pointer;
}
.lib-file:hover {
  background-color: rgba(0, 116, 217, 0.08);
  color: #0074d9;
}
.lib-file.selected {
  background-color: rgba(0, 116, 217, 0.18);
  color: #0074d9;
  font-weight: 600;
}

.lib-file {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}
.lib-folder-content.collapsed {
  display: none !important;
}
.lib-folder-title::before {
  content: "▼ ";
  font-size: 9px;
  display: inline-block;
  width: 12px;
}
.lib-folder-title.collapsed::before {
  content: "▶ ";
}

.lib-empty-state {

/* ─── RESIZE HANDLE ─── */
#resize-handle {

  bottom: 0; right: 0;

  z-index: 500;
  opacity: 0;
}
#resize-handle::after {
  content: '';
  position: absolute;
  bottom: 3px; right: 3px;
  width: 8px; height: 8px;
  border-right: 2px solid var(--border);
  border-bottom: 2px solid var(--border);
}
#resize-handle:hover::after { border-color: var(--accent); }
#panel-divider.hidden { display: none; }

/* ─── COLLAPSIBLE LAYER PANELS ─── */
.collapsible-panel {
  display: none;
  flex-direction: column;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  max-height: 220px;

}

.panel-section-header {
  padding: 0 12px;
  height: 36px;
  font-size: 11px;
  font-weight: 600;

  border-bottom: 1px solid var(--border);

  align-items: center;
  font-family: var(--font);

}
.panel-section-header span.panel-title { flex: 1; }
.panel-section-header .arrow-icon {

}

}

.collapsible-content {
  overflow-y: auto;

  padding: 2px 0;
}
.collapsible-content.collapsed {

}

.empty-state {
  padding: 12px;

  color: rgba(0,0,0,0.3);

}

.layer-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 8px;
  margin: 2px 8px;
  background: #f5f5f5;
  border-radius: 4px;

}
.layer-item:hover {
  border-color: #0074d9;
}
.layer-item .layer-delete-btn {

  border: none;
  color: #999;
  cursor: pointer;
  padding: 2px 4px;
  font-size: 10px;
  border-radius: 3px;
}
.layer-item .layer-delete-btn:hover {
  color: #f44336;
  background: rgba(244,67,54,0.08);
}

/* ─── EFFECT LAYER LEGACY STYLES (used by ShaderLayers.renderList) ─── */
.effect-layer-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-bottom: 1px solid #e8e8e8;

  transition: background 0.1s;
}
.effect-layer-row:hover { background: var(--bg-1); }
.effect-layer-row[draggable="true"] { cursor: grab; }
.effect-layer-row.dragging { opacity: 0.4; background: var(--accent); }
.effect-layer-row.active {
  background: #f0ffe0;
  border-left: 3px solid var(--border);

}

.effect-layer-name {
  flex: 1;
  font-size: 13px;
  font-family: var(--font);

}

.effect-layer-vis {
  width: 16px; height: 16px;
  background: none; border: none;
  color: var(--text-3);
  font-size: 13px;
  cursor: pointer;

  border-radius: var(--radius-s);

  flex-shrink: 0;
  line-height: 1;
  font-family: var(--font);
}
.effect-layer-vis:hover { color: var(--text-0); }
.effect-layer-vis.hidden-layer { opacity: 0.35; }

.effect-layer-del {
  width: 18px; height: 18px;
  background: none; border: none;
  color: var(--text-3);
  font-size: 16px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  border-radius: var(--radius-s); transition: 0.1s;
  line-height: 1;
  font-family: var(--font);
  flex-shrink: 0;
}
.effect-layer-del:hover {
  color: var(--danger);
  background: rgba(242, 72, 34, 0.08);
}
.effect-layer-masks {
  width: auto; min-width: 18px; height: 18px;
  padding: 0 4px;
  background: none; border: none;
  color: var(--text-3);
  font-size: 12px; font-weight: 600;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  border-radius: var(--radius-s); transition: 0.1s;
  line-height: 1; font-family: var(--font);
  flex-shrink: 0;
}
.effect-layer-masks:hover {
  color: var(--accent);
  background: rgba(255, 107, 53, 0.10);
}

/* ─── MASK EDITOR ─── */
.mask-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  box-sizing: border-box;
  overflow: auto;
}
.mask-panel {
  width: min(1040px, 96%); height: min(760px, 96%);
  background: var(--bg-0); border: 1px solid var(--border);
  border-radius: 0;
  display: flex; flex-direction: column; overflow: hidden;
  font-family: var(--font); color: var(--text-0);
}
.mask-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: var(--bg-1);
}
.mask-panel-title { font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
.mask-close {
  width: 24px; height: 24px; border: none; background: none;
  color: var(--text-2); font-size: 18px; cursor: pointer; border-radius: 0;
}
.mask-close:hover { color: var(--danger); background: rgba(242,72,34,0.08); }
.mask-code-btn {
  margin-right: auto;
  margin-left: 12px;
  height: 24px; padding: 0 10px;
  border: 1px solid var(--border);
  background: var(--bg-0);
  color: var(--text-2);
  font-size: 11px; font-family: var(--font-mono);
  cursor: pointer; border-radius: 0;
}
.mask-code-btn:hover { color: var(--text-0); border-color: var(--accent); }
.mask-code-btn.active { color: #191A23; background: var(--accent); border-color: var(--accent); }
.mask-body { display: flex; flex: 1; min-height: 0; }
.mask-left-col {
  flex: 0 0 30%; max-width: 30%; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.mask-section { display: flex; flex-direction: column; min-height: 0; }
.mask-section:not(:last-child) { border-bottom: 1px solid var(--border); }
.mask-params-section { flex: 1; min-height: 0; }
.mask-section-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
  color: var(--text-1); background: var(--bg-1);
}
.mask-list {
  max-height: 180px; overflow-y: auto; padding: 6px;
}
.mask-item {
  display: flex; align-items: center; gap: 6px; padding: 5px 8px; margin-bottom: 3px;
  border-radius: 0; cursor: pointer; border: 1px solid transparent; font-size: 12px;
}
.mask-item:hover { background: var(--bg-1); }
.mask-item.selected { background: var(--bg-2); border-color: var(--accent); }
.mask-item .mask-vis { width: 18px; height: 18px; border: none; background: none; color: var(--text-2); cursor: pointer; font-size: 13px; }
.mask-item .mask-vis.off { opacity: 0.4; }
.mask-item .mask-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mask-item .mask-del { width: 16px; height: 16px; border: none; background: none; color: var(--text-3); cursor: pointer; font-size: 14px; }
 .mask-item .mask-del:hover { color: var(--danger); }
 .mask-rename {
   flex: 1; min-width: 0; font-size: 11px; padding: 1px 4px; border-radius: 0;
   border: 1px solid var(--accent); background: var(--bg-0); color: var(--text-1);
   outline: none;
 }
.mask-empty { color: var(--text-3); font-size: 12px; padding: 14px; text-align: center; }
.mask-params {
  flex: 1; overflow-y: auto; padding: 12px 14px;
}
.mask-params-title { font-size: 12px; font-weight: 600; margin-bottom: 10px; color: var(--accent); }
.mask-field { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; }
.mask-field.mask-check { grid-template-columns: 120px auto; }
.mask-field label { color: var(--text-0); font-size: 13px; font-weight: 500; }
.mask-field input[type=range] { width: 100%; }
.mask-val { color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; font-family: var(--font-mono); }
.mask-select {
  background: var(--bg-0); border: 1px solid var(--border); border-radius: 0;
  color: var(--text-0); font-size: 12px; font-family: var(--font);
  padding: 3px 6px; outline: none; cursor: pointer; min-width: 90px;
}
.mask-select:focus { border-color: var(--accent); }
.mask-code-section { flex: 0 0 auto; max-height: 40%; min-height: 0; }
.mask-code-editor {
  flex: 1; min-height: 120px; resize: none; width: 100%;
  background: #fafafa; color: #191A23; border: none; outline: none;
  font-family: var(--font-mono); font-size: 11px; line-height: 1.5;
  padding: 10px; tab-size: 2; white-space: pre; overflow: auto;
  box-sizing: border-box;
}
.mask-code-editor[readonly] { background: #f3f3f3; color: #555; }
.mask-code-error {
  display: none; padding: 4px 10px; font-size: 11px; font-family: var(--font-mono);
  color: var(--danger); background: #fff0ee; border-top: 1px solid #f5c5be;
}
.mask-code-error.visible { display: block; }

.mask-add-wrap { position: relative; }
.mask-add-btn {
  font-size: 11px; padding: 2px 8px; border: 1px solid var(--border);
  background: var(--bg-1); color: var(--text-0); border-radius: 0; cursor: pointer;
}
.mask-add-btn:hover { background: var(--accent); }
.mask-add-menu {
  position: absolute; right: 0; top: 26px; z-index: 10;
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 0;
  min-width: 170px; max-height: 360px; overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.mask-add-group { font-size: 10px; text-transform: uppercase; color: var(--text-3); padding: 6px 10px 2px; }
.mask-add-item { font-size: 12px; padding: 5px 10px; cursor: pointer; }
.mask-add-item:hover { background: var(--accent); }

.mask-preview-col { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.mask-preview-wrap {
  flex: 1; padding: 12px; display: flex; align-items: center; justify-content: center;
  background: var(--bg-2); min-height: 0; overflow: hidden;
}
.mask-preview-canvas {
  border: 1px solid var(--border); background: #1a1a1e; cursor: move; touch-action: none; display: block;
}
.mask-preview-hint {
  padding: 6px 12px; font-size: 11px; color: var(--text-3);
  border-top: 1px solid var(--border); background: var(--bg-1);
}

.mask-note { font-size: 11px; color: var(--text-3); margin: 6px 0; }
.mask-brush-wrap { display: flex; justify-content: center; padding: 8px 0; }
.mask-brush-canvas {
  width: 256px; height: 256px; border: 1px solid var(--border); border-radius: 0;
  cursor: crosshair; touch-action: none; background: #111;
}
.mask-clear-btn {
  margin-top: 8px; font-size: 11px; padding: 4px 10px; border: 1px solid var(--border);
  background: var(--bg-1); color: var(--text-0); border-radius: 0; cursor: pointer;
}
.mask-clear-btn:hover { background: var(--danger); }

/* Force select to shrink and never overflow its row */
.res-select {
  min-width: 0;
  max-width: 100%;
}
/* Label must not force row to expand either */
.res-label {
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Settings tab must scroll internally instead of pushing layout */
#settings-tab-content {
  overflow-y: auto;
  min-height: 0;

/* ── Library file type icons ── */
.lib-file-icon {

}
.lib-file-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

const DEFAULT_SHADER = `precision mediump float;

uniform float uSpeed;
uniform float uScale;
uniform vec3  uColor1;
uniform vec3  uColor2;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i), hash(i + vec2(1,0)), f.x),
    mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x),
    f.y
  );
}

void main() {
  vec2 uv = gl_FragCoord.xy / iResolution.xy;
  
  float t = iTime * uSpeed;
  float n = noise(uv * uScale + vec2(t * 0.3, t * 0.2));
  n += 0.5 * noise(uv * uScale * 2.0 + vec2(t * 0.5, -t * 0.4));
  n /= 1.5;
  
  vec3 noiseCol = mix(uColor1, uColor2, n);

    gl_FragColor = vec4(noiseCol, tex.a);
  } else {
    gl_FragColor = vec4(noiseCol, 1.0);
  }
}`;

const DEFAULT_SHADER_TEMPLATE = `// ═══════════════════════════════════════════════════════════════════════════
//  SHADER FLOW — TEMPLATE SHADER (Generator)
// ═══════════════════════════════════════════════════════════════════════════
//
//  Welcome! This template demonstrates the core concepts of Shader Flow.

//
//  1. GENERATOR LAYERS (like this one) create images FROM SCRATCH.

//     Use them for: gradients, noise, patterns, procedural art.
//

//      uniform vec3 uGlowColor;   // color picker ✓
//      uniform vec3 uAccentCol;   // color picker ✓

//
//  ━━ NAMING CONVENTIONS (auto-detected ranges) ━━━━━━━━━━━━━━━━━━━━━━━━━━━

//
//    float uCount, uTiles, uAmount, uIterations  → slider [1..100]
//    float uAngle, uRotation, uTwist             → slider [0..360]
//    float uSpeed, uFrequency, uRate             → slider [0..5]
//    float uScale, uRadius, uSize, uWidth        → slider [0..10]
//    float uOpacity, uStrength, uMix, uBlend     → slider [0..1]
//    float uOffset, uShift, uBias                → slider [-1..1]
//    float uDistort, uWarp, uCurve               → slider [0..2]
//    float uSoftness, uBlur, uFeather            → slider [0..1]
//
//    vec3  uMyColor, uBaseCol, uAccentColor      → COLOR PICKER (auto!)

//

//
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

//    ✓ Use 1.0 not 1, 0.5 not .5 (floats need decimal points)

//
//    Write your final color to: gl_FragColor = vec4(red, green, blue, alpha);
//    Alpha = 1.0 for opaque, 0.0 for fully transparent.
//
// ═══════════════════════════════════════════════════════════════════════════


precision mediump float;


// ── Parameters (auto-detected by Shader Flow) ─────────────────────────────


uniform float uSpeed;        // Animation speed
uniform float uScale;        // Pattern scale
uniform float uIridescence;  // Iridescent color shift intensity
uniform vec3  uColorA;       // Primary fluid color
uniform vec3  uColorB;       // Secondary fluid color
uniform vec3  uColorC;       // Highlight / accent color


// ── Helper: pseudo-random hash ───────────────────────────────────────────
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}


// ── Helper: smooth 2D noise ──────────────────────────────────────────────
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}


// ── Helper: fractal Brownian motion ──────────────────────────────────────
float fbm(vec2 p) {
  float value = 0.0;
  float amplitude = 0.5;
  for (int i = 0; i < 5; i++) {
    value += amplitude * noise(p);
    p *= 2.0;
    amplitude *= 0.5;
  }
  return value;
}


// ── Helper: iridescent color palette ─────────────────────────────────────
vec3 iridescent(float t, vec3 c1, vec3 c2, vec3 c3) {
  // Create rainbow-like color cycling based on interference patterns
  float phase = t * 6.28318;
  vec3 col = c1 * (0.5 + 0.5 * sin(phase));
  col += c2 * (0.5 + 0.5 * sin(phase + 2.094));  // +120°
  col += c3 * (0.5 + 0.5 * sin(phase + 4.188));  // +240°
  return col / 1.5;
}


// ── Main shader: Iridescent Fluid ────────────────────────────────────────
void main() {
  // Normalized UV coordinates
  vec2 uv = gl_FragCoord.xy / iResolution.xy;
  
  // Aspect-ratio correction
  vec2 uvAspect = uv;
  uvAspect.x *= iResolution.x / iResolution.y;
  
  // Time-based animation
  float t = iTime * uSpeed;
  
  // ── Domain warping: create flowing liquid shapes ─────────────────────
  // First pass: base distortion
  vec2 q = uvAspect * uScale;
  float n1 = fbm(q + vec2(t * 0.2, t * 0.15));
  
  // Second pass: warp coordinates using first noise layer
  vec2 warp1 = vec2(
    fbm(q + vec2(n1 * 2.0 + t * 0.3, n1 * 1.5 - t * 0.2)),
    fbm(q + vec2(n1 * 1.5 - t * 0.25, n1 * 2.0 + t * 0.3))
  );
  
  // Third pass: deeper warp for organic flow
  vec2 warp2 = vec2(
    fbm(q + warp1 * 3.0 + vec2(t * 0.1, -t * 0.15)),
    fbm(q + warp1 * 3.0 + vec2(-t * 0.15, t * 0.1))
  );
  
  // Final fluid pattern
  float fluid = fbm(q + warp2 * 2.5);
  
  // ── Iridescent coloring ──────────────────────────────────────────────
  // Use warp magnitude to drive color shifts (like oil on water)
  float warpStrength = length(warp2) * uIridescence;
  float colorPhase = fluid + warpStrength * 0.5 + t * 0.1;
  
  vec3 col = iridescent(colorPhase, uColorA, uColorB, uColorC);
  
  // ── Add depth and highlights ─────────────────────────────────────────
  // Fresnel-like effect: brighter at edges of fluid forms
  float edge = abs(fluid - 0.5) * 2.0;
  edge = pow(edge, 2.0);
  
  // Bright highlights in high-contrast areas
  float highlight = smoothstep(0.6, 0.9, fluid) * (1.0 - edge);
  col += uColorC * highlight * 0.4;
  
  // Subtle color variation based on warp
  col *= 0.85 + 0.3 * warpStrength;
  
  // ── Vignette (focus attention to center) ─────────────────────────────
  float vig = uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);
  vig = pow(vig * 16.0, 0.3);
  col *= 0.7 + 0.3 * vig;
  
  // ── Final adjustments ────────────────────────────────────────────────
  // Boost saturation slightly
  float luminance = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(luminance), col, 1.2);
  
  // Clamp to valid color range
  col = clamp(col, 0.0, 1.0);
  
  // Output: RGB + Alpha (1.0 = fully opaque)
  gl_FragColor = vec4(col, 1.0);
}`;

/* ═══════════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════════ */

// Замкнутая Catmull-Rom кривая через точки pts, триангулированная в ~steps*N
// вершин. curv[i] — натяжение (tension 0..1) для сегмента i→i+1 (1 = петли/
// сильный изгиб, 0 = прямая). Определена глобально (вне IIFE), чтобы быть
// доступной и из MaskEditor (предпросмотр), и из движка масок GL.
function tessellateFreeform(pts, steps, curv) {
  const n = pts.length;
  if (n < 3) return pts.map(p => ({ x: p.x, y: p.y }));
  const out = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const T = (curv && curv[i] != null) ? curv[i] : 0.5;
    const m1x = (p2.x - p0.x) * T, m1y = (p2.y - p0.y) * T;
    const m2x = (p3.x - p1.x) * T, m2y = (p3.y - p1.y) * T;
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const x = (2 * p1.x - 2 * p2.x + m1x + m2x) * t3 + (-3 * p1.x + 3 * p2.x - 2 * m1x - m2x) * t2 + m1x * t + p1.x;
      const y = (2 * p1.y - 2 * p2.y + m1y + m2y) * t3 + (-3 * p1.y + 3 * p2.y - 2 * m1y - m2y) * t2 + m1y * t + p1.y;
      out.push({ x, y });
    }
  }
  return out;
}

/* =============================================================
   FREE FORM BEZIER ANCHORS
   ============================================================= */

const FREE_MAX_SHADER_POINTS = 127;
const FREE_MAX_PREVIEW_POINTS = 512;

function _normalizeFreeAnchor(a) {
  const hIn = a.hIn || {};
  const hOut = a.hOut || {};

  return {
    x: a.x || 0,
    y: a.y || 0,
    mode: a.mode === 'smooth' ? 'smooth' : 'corner',
    hIn: {
      x: hIn.x || 0,
      y: hIn.y || 0
    },
    hOut: {
      x: hOut.x || 0,
      y: hOut.y || 0
    }
  };
}

function cubicBezierPoint(p0, p1, p2, p3, t) {
  const it = 1 - t;
  const it2 = it * it;
  const t2 = t * t;

  return {
    x:
      it2 * it * p0.x +
      3 * it2 * t * p1.x +
      3 * it * t2 * p2.x +
      t2 * t * p3.x,
    y:
      it2 * it * p0.y +
      3 * it2 * t * p1.y +
      3 * it * t2 * p2.y +
      t2 * t * p3.y
  };
}

function ensureFreeformAnchors(m) {
  if (!m) return [];

  if (Array.isArray(m.anchors) && m.anchors.length > 0) {
    for (let i = 0; i < m.anchors.length; i++) {
      const a = m.anchors[i];

      if (!a.hIn) a.hIn = { x: 0, y: 0 };
      if (!a.hOut) a.hOut = { x: 0, y: 0 };
      if (a.mode !== 'smooth') a.mode = 'corner';

      a.hIn.x = a.hIn.x || 0;
      a.hIn.y = a.hIn.y || 0;
      a.hOut.x = a.hOut.x || 0;
      a.hOut.y = a.hOut.y || 0;
    }

    return m.anchors;
  }

  const pts = Array.isArray(m.pts) ? m.pts : [];

  const anchors = pts.map(p =>
    _normalizeFreeAnchor({
      x: p.x,
      y: p.y,
      mode: 'corner',
      hIn: { x: 0, y: 0 },
      hOut: { x: 0, y: 0 }
    })
  );

  const n = anchors.length;

  const curved =
    m.smooth ||
    (Array.isArray(m.curv) && m.curv.some(c => c != null && Math.abs(c) > 0.001));

  if (curved && n >= 3) {
    for (let i = 0; i < n; i++) {
      const prev = anchors[(i - 1 + n) % n];
      const cur = anchors[i];
      const next = anchors[(i + 1) % n];

      let tx = next.x - prev.x;
      let ty = next.y - prev.y;

      const len = Math.hypot(tx, ty);

      if (len > 1e-6) {
        tx /= len;
        ty /= len;
      } else {
        tx = 1;
        ty = 0;
      }

      const inLen = Math.hypot(cur.x - prev.x, cur.y - prev.y) * 0.25;
      const outLen = Math.hypot(next.x - cur.x, next.y - cur.y) * 0.25;

      cur.mode = 'smooth';
      cur.hIn = { x: -tx * inLen, y: -ty * inLen };
      cur.hOut = { x: tx * outLen, y: ty * outLen };
    }
  }

  m.anchors = anchors;
  return m.anchors;
}

function freeAnchorPositions(m) {
  return ensureFreeformAnchors(m).map(a => ({ x: a.x, y: a.y }));
}

function freeSegmentHasCurve(a, b) {
  const hasOut =
    a.hOut &&
    (Math.abs(a.hOut.x) > 1e-6 || Math.abs(a.hOut.y) > 1e-6);

  const hasIn =
    b.hIn &&
    (Math.abs(b.hIn.x) > 1e-6 || Math.abs(b.hIn.y) > 1e-6);

  return !!(hasOut || hasIn);
}

function flattenFreeformMask(m, maxPoints = FREE_MAX_SHADER_POINTS) {
  const anchors = ensureFreeformAnchors(m);
  const n = anchors.length;

  if (n === 0) return [];
  if (n < 3) return anchors.map(a => ({ x: a.x, y: a.y }));

  let curveCount = 0;

  for (let i = 0; i < n; i++) {
    const a = anchors[i];
    const b = anchors[(i + 1) % n];

    if (freeSegmentHasCurve(a, b)) curveCount++;
  }

  let subdiv = 12;

  if (curveCount > 0) {
    const available = Math.max(0, maxPoints - n);
    const per = Math.floor(available / curveCount);
    subdiv = Math.max(2, Math.min(24, per + 1));
  }

  const out = [];

  for (let i = 0; i < n; i++) {
    const a = anchors[i];
    const b = anchors[(i + 1) % n];

    out.push({ x: a.x, y: a.y });

    if (freeSegmentHasCurve(a, b)) {
      const p0 = { x: a.x, y: a.y };
      const p1 = { x: a.x + a.hOut.x, y: a.y + a.hOut.y };
      const p2 = { x: b.x + b.hIn.x, y: b.y + b.hIn.y };
      const p3 = { x: b.x, y: b.y };

      for (let s = 1; s < subdiv; s++) {
        const t = s / subdiv;
        const p = cubicBezierPoint(p0, p1, p2, p3, t);
        out.push({ x: p.x, y: p.y });
      }
    }
  }

  if (out.length > maxPoints) {
    const decimated = [];
    const step = out.length / maxPoints;

    for (let i = 0; i < maxPoints; i++) {
      const idx = Math.min(out.length - 1, Math.floor(i * step));
      decimated.push(out[idx]);
    }

    return decimated;
  }

  return out;
}

function makeFreeAnchorSmooth(m, i) {
  const anchors = ensureFreeformAnchors(m);
  const n = anchors.length;
  const a = anchors[i];

  if (!a || n < 3) return;

  const outLen = Math.hypot(a.hOut.x, a.hOut.y);
  const inLen = Math.hypot(a.hIn.x, a.hIn.y);

  if (outLen > 1e-6) {
    const scale = inLen > 1e-6 ? inLen / outLen : 1;

    a.hIn = {
      x: -a.hOut.x * scale,
      y: -a.hOut.y * scale
    };
  } else if (inLen > 1e-6) {
    const scale = outLen > 1e-6 ? outLen / inLen : 1;

    a.hOut = {
      x: -a.hIn.x * scale,
      y: -a.hIn.y * scale
    };
  } else {
    const prev = anchors[(i - 1 + n) % n];
    const next = anchors[(i + 1) % n];

    let tx = next.x - prev.x;
    let ty = next.y - prev.y;

    const len = Math.hypot(tx, ty);

    if (len > 1e-6) {
      tx /= len;
      ty /= len;
    } else {
      tx = 1;
      ty = 0;
    }

    const autoInLen = Math.hypot(a.x - prev.x, a.y - prev.y) * 0.25;
    const autoOutLen = Math.hypot(next.x - a.x, next.y - a.y) * 0.25;

    a.hIn = { x: -tx * autoInLen, y: -ty * autoInLen };
    a.hOut = { x: tx * autoOutLen, y: ty * autoOutLen };
  }

  a.mode = 'smooth';
}

function toggleFreeAnchorMode(m, i) {
  const anchors = ensureFreeformAnchors(m);
  const a = anchors[i];

  if (!a) return;

  if (a.mode === 'smooth') {
    a.mode = 'corner';
  } else {
    makeFreeAnchorSmooth(m, i);
  }
}

function resetFreeAnchorHandles(m, i) {
  const anchors = ensureFreeformAnchors(m);
  const a = anchors[i];

  if (!a) return;

  a.hIn = { x: 0, y: 0 };
  a.hOut = { x: 0, y: 0 };
}

function setFreeAnchorHandle(m, i, which, dx, dy, altKey) {
  const anchors = ensureFreeformAnchors(m);
  const a = anchors[i];

  if (!a) return;

  a[which] = { x: dx, y: dy };

  if (altKey) {
    a.mode = 'corner';
    return;
  }

  if (a.mode === 'smooth') {
    const other = which === 'hOut' ? 'hIn' : 'hOut';

    const len = Math.hypot(dx, dy);
    const otherLen = Math.hypot(a[other].x, a[other].y);

    if (len > 1e-6) {
      const scale = otherLen > 1e-6 ? otherLen / len : 1;

      a[other] = {
        x: -dx * scale,
        y: -dy * scale
      };
    } else {
      a[other] = { x: 0, y: 0 };
    }
  }
}

const GL = (() => {
  let gl = null;
  let program = null;
  let _generateProg = null;
  let _generateUniforms = [];
  let quadBuf = null;
  let texture = null;
  let animId = null;
  let _onFrame = null;
  let _onError = null;
  let mouseX = 0.5, mouseY = 0.5;

  let pingPongFBs = [null, null];
  let pingPongTexs = [null, null];
  let ppWidth = 0, ppHeight = 0;

  let _frameInterval = 1000 / 60;

  function init(canvas) {
    gl = canvas.getContext('webgl', {
      preserveDrawingBuffer: true,
      antialias: false,
      alpha: true,
      premultipliedAlpha: false
    });
    if (!gl) throw new Error('WebGL не поддерживается');

    canvas.addEventListener('webglcontextlost', e => {
      e.preventDefault();
      if (animId) cancelAnimationFrame(animId);
    });
    canvas.addEventListener('webglcontextrestored', () => {
      _initQuad();
      program = null;
      pingPongFBs = [null, null];
      pingPongTexs = [null, null];
      ppWidth = 0; ppHeight = 0;
      const code = document.getElementById('code-editor').value;
      if (code) compile();
      tick(performance.now());
    });

    _initQuad();

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      mouseX = (e.clientX - r.left) / r.width;
      mouseY = (e.clientY - r.top) / r.height;
    });

    return gl;
  }

  function _initQuad() {
    quadBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1,-1, 1,-1, -1,1, 1,1
    ]), gl.STATIC_DRAW);
  }

  function compileShader(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const err = gl.getShaderInfoLog(sh) || "Unknown compile error";
      gl.deleteShader(sh);
      throw new Error(err);
    }
    return sh;
  }

  function _buildProg(fragSrc) {
    const BUILTIN = ['iResolution','iTime','iMouse','uTexture','uHasTexture'];
    let cleaned = fragSrc;
    for (const name of BUILTIN) {
      const re = new RegExp(`^[ \\t]*uniform\\s+\\w+\\s+${name}\\s*;`, 'gm');
      cleaned = cleaned.replace(re, `// ${name} (injected)`);
    }
    const prefix = `precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec2 iMouse;
uniform sampler2D uTexture;
uniform int uHasTexture;
`;
    const prefixLines = prefix.split('\n').length - 1;
    const injected = prefix + cleaned;

    const vert = compileShader(gl.VERTEX_SHADER, VERTEX_SRC);
    let frag;
    try {
      frag = compileShader(gl.FRAGMENT_SHADER, injected);
    } catch(e) {
      gl.deleteShader(vert);
      const msg = (e.message||'').replace(/ERROR:\s*0:(\d+)/g, (m, ln) =>
        `Line ${Math.max(1, parseInt(ln) - prefixLines)}`);
      throw new Error(msg);
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, vert);
    gl.attachShader(prog, frag);
    gl.linkProgram(prog);
    gl.deleteShader(vert);
    gl.deleteShader(frag);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error('Link error: ' + gl.getProgramInfoLog(prog));
    }
    return prog;
  }

  function buildProgram(fragSrc) {
    if (program) { gl.deleteProgram(program); program = null; }
    program = _buildProg(fragSrc);

    if (_generateProg) { try { gl.deleteProgram(_generateProg); } catch(e){} }
    _generateProg    = program;
    _generateUniforms = S.uniforms.map(u => ({
      ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
    }));

    return true;
  }

  function buildProgramFromLayers(layersData, baseTexture) {
    if (!layersData || layersData.length === 0) {
      if (program) { gl.deleteProgram(program); program = null; }
      return;
    }
    const visible = layersData.filter(l => l.visible);
    if (visible.length === 0) {
      if (program) { gl.deleteProgram(program); program = null; }
      return;
    }
  }

  function _ensurePingPong(w, h) {
    w = Math.max(1, Math.round(w || 1));
    h = Math.max(1, Math.round(h || 1));
    if (ppWidth === w && ppHeight === h && pingPongFBs[0]) return;
    for (let i = 0; i < 2; i++) {
      if (pingPongTexs[i]) { gl.deleteTexture(pingPongTexs[i]); pingPongTexs[i] = null; }
      if (pingPongFBs[i])  { gl.deleteFramebuffer(pingPongFBs[i]); pingPongFBs[i] = null; }
    }
    for (let i = 0; i < 2; i++) {
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      // Явная очистка
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      pingPongTexs[i] = t;
      pingPongFBs[i]  = fb;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    ppWidth = w; ppHeight = h;
  }

  function _drawQuadWithProg(prog, inputTex, hasInputTex, uniforms, time, w, h) {
    gl.useProgram(prog);

    const resLoc = gl.getUniformLocation(prog, 'iResolution');
    if (resLoc) gl.uniform2f(resLoc, w, h);
    const timeLoc = gl.getUniformLocation(prog, 'iTime');
    if (timeLoc) gl.uniform1f(timeLoc, time);
    const mouseLoc = gl.getUniformLocation(prog, 'iMouse');
    if (mouseLoc) gl.uniform2f(mouseLoc, mouseX, mouseY);

    gl.activeTexture(gl.TEXTURE0);
    if (inputTex) {
      gl.bindTexture(gl.TEXTURE_2D, inputTex);
    } else {
      gl.bindTexture(gl.TEXTURE_2D, null);
    }
    const texLoc = gl.getUniformLocation(prog, 'uTexture');
    if (texLoc) gl.uniform1i(texLoc, 0);
    const hasTexLoc = gl.getUniformLocation(prog, 'uHasTexture');
    if (hasTexLoc) gl.uniform1i(hasTexLoc, hasInputTex ? 1 : 0);

    for (const u of (uniforms || [])) {
      _setUniform(prog, u.name, u.type, u.value);
    }

    const posLoc = gl.getAttribLocation(prog, 'aPos');
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function _setUniform(prog, name, type, value) {
    const loc = gl.getUniformLocation(prog, name);
    if (!loc) return;
    switch(type) {
      case 'float':     gl.uniform1f(loc, value); break;
      case 'int':       gl.uniform1i(loc, value|0); break;
      case 'bool':      gl.uniform1i(loc, value ? 1 : 0); break;
      case 'vec2':      gl.uniform2fv(loc, value); break;
      case 'vec3':
      case 'vec3color': gl.uniform3fv(loc, value); break;
    }
  }

  /* ─── MASK STACK ENGINE ───────────────────────────────────────────
     Каждая маска = покрытие (coverage) в альфе. Все включённые маски
     слоя рендерятся аддитивно в отдельный mask-FBO; затем результат
     применяется к слою: out = mix(base, layer, coverage).
     Feather/Invert/Strength запекаются в вывод каждой маски. ───────── */

  let _maskFB = null, _maskTex = null, _maskW = 0, _maskH = 0;
  let _scratchFB = null, _scratchTex = null;
  let _nullTex = null;
  let _maskProg = null, _maskApplyProg = null;
  let _userMaskProgs = {};   // id -> { code, prog } for 'code' type masks

  // Типы масок → int для шейдера
  const _MASK_CODE = { circle:0, ellipse:1, rect:2, rrect:3, square:4, polygon:5, star:6, line:7, noise:8, freeform:9, code:10 };
  let MASK_FRAG_SRC = '';

  function _ensureMaskFB(w, h) {
    w = Math.max(1, Math.round(w || 1));
    h = Math.max(1, Math.round(h || 1));
    if (_maskW === w && _maskH === h && _maskFB) return;
    if (_maskTex) gl.deleteTexture(_maskTex);
    if (_maskFB) gl.deleteFramebuffer(_maskFB);
    _maskTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, _maskTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    _maskFB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, _maskFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, _maskTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    // Очистка новой текстуры маски
    gl.bindFramebuffer(gl.FRAMEBUFFER, _maskFB);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    if (_scratchTex) gl.deleteTexture(_scratchTex);
    if (_scratchFB) gl.deleteFramebuffer(_scratchFB);
    _scratchTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, _scratchTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    _scratchFB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, _scratchFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, _scratchTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    _maskW = w; _maskH = h;
  }

  // 1x1 прозрачная текстура для «пустой» подложки (генератор без слоёв снизу).
  function _ensureNullTex() {
    if (_nullTex) return;
    _nullTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, _nullTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,0]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindTexture(gl.TEXTURE_2D, null);
  }

  // Рисует слой в scratch-FBO (результат в _scratchTex). Нужно до applyLayerMask.
  function _drawLayerToScratch(prog, inputTex, hasInputTex, uniforms, time, w, h) {
    _ensureMaskFB(w, h);
    gl.bindFramebuffer(gl.FRAMEBUFFER, _scratchFB);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    _drawQuadWithProg(prog, inputTex, hasInputTex, uniforms, time, w, h);
    return _scratchTex;
  }

  function _ensureMaskProgs() {
    if (_maskProg) return;
    const fragSrc = `
      // тип маски
      uniform int   uType;
      uniform float uInvert;     // 0 или 1
      uniform float uStrength;   // 0..1
      uniform float uFeather;    // 0..1 (доля размера)
      uniform vec2  uCenter;     // UV
      uniform vec2  uSize;       // полуразмеры UV
      uniform float uRot;        // радианы
      uniform float uSides;      // polygon
      uniform float uPoints;     // star
      uniform float uRadius;     // rrect
      uniform float uThickness;  // line
      uniform float uScale;      // noise
      uniform float uSpeed;      // noise
      uniform float uThreshold;  // noise
      uniform int   uNoiseType;  // 0..5
      uniform float uUneven;     // 0..1 — неровности края
      uniform int   uUnevenType; // 0 = Soft, 1 = Sharp
      uniform vec2  uFreePts[128]; // Free Form вершины спрямлённой Безье-кривой (последняя = первая для замыкания)
      uniform int   uFreeCount;   // кол-во реальных вершин

      float sdCircle(vec2 p, float r){ return length(p) - r; }
      float sdEllipse(vec2 p, vec2 r){ return (length(p / r) - 1.0) * min(r.x, r.y); }
      float sdBox(vec2 p, vec2 b){ vec2 d=abs(p)-b; return length(max(d,0.0))+min(max(d.x,d.y),0.0); }
      mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
      // Знаковая SД расстояния до (возможно невыпуклого) многоугольника с vc
      // вершинами. Вершины генерируются на лету: i-я имеет радиус rr (R или r
      // для звезды). Внутренность определяется корректным ray-cast тестом,
      // поэтому одинаково верно работает для выпуклого полигона и вогнутой
      // звезды (раньше использовался тест «внутри всех полуплоскостей», который
      // для вогнутых фигур давал выпуклую оболочку — отсюда были баги).
      float sdVerts(vec2 p, float vc, float R, float r){
        float an = 6.2831853 / vc;
        float d2 = 1e9;
        bool inside = false;
        for (int i = 0; i < 32; i++) {
          if (float(i) >= vc) break;
          float rri = (mod(float(i), 2.0) < 0.5) ? R : r;
          float rrj = (mod(float(i) + 1.0, 2.0) < 0.5) ? R : r;
          vec2 a = vec2(sin(an * float(i)),       cos(an * float(i)))       * rri;
          vec2 b = vec2(sin(an * float(i + 1)),   cos(an * float(i + 1)))   * rrj;
          vec2 e = b - a;
          vec2 w = p - a;
          vec2 bp = w - e * clamp(dot(w, e) / max(dot(e, e), 1e-6), 0.0, 1.0);
          d2 = min(d2, dot(bp, bp));
          // ray-cast тест (горизонтальный луч вправо)
          if (((a.y > p.y) != (b.y > p.y))) {
            float xint = a.x + (b.x - a.x) * (p.y - a.y) / (b.y - a.y);
            if (p.x < xint) inside = !inside;
          }
        }
        float d = sqrt(d2);
        return inside ? -d : d;
      }
      float sdPolygon(vec2 p, float n, float R){ return sdVerts(p, n, R, R); }
      float sdStar(vec2 p, float points, float R, float r){ return sdVerts(p, points * 2.0, R, r); }
      // Free Form: замкнутый полигон по uFreePts (p уже в shader-space, центр в 0).
      float sdFree(vec2 p){
        float d2 = 1e9;
        bool inside = false;
        for (int i = 0; i < 127; i++) {
          if (i >= uFreeCount) break;
          vec2 a = uFreePts[i];
          vec2 b = uFreePts[i + 1];
          vec2 e = b - a;
          vec2 w = p - a;
          vec2 bp = w - e * clamp(dot(w, e) / max(dot(e, e), 1e-6), 0.0, 1.0);
          d2 = min(d2, dot(bp, bp));
          if (((a.y > p.y) != (b.y > p.y))) {
            float xint = a.x + (b.x - a.x) * (p.y - a.y) / (b.y - a.y);
            if (p.x < xint) inside = !inside;
          }
        }
        return inside ? -sqrt(d2) : sqrt(d2);
      }
      float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      float noise2(vec2 p){
        vec2 i=floor(p), f=fract(p);
        float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
        vec2 u=f*f*(3.0-2.0*f);
        return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
      }
      float fbm(vec2 p){
        float v=0.0, a=0.5;
        for(int i=0;i<5;i++){ v+=a*noise2(p); p*=2.02; a*=0.5; }
        return v;
      }
      float ridged(vec2 p){
        float v=0.0, a=0.5;
        for(int i=0;i<5;i++){ v+=a*(1.0 - abs(2.0*noise2(p)-1.0)); p*=2.02; a*=0.5; }
        return v;
      }
      float turbulence(vec2 p){
        float v=0.0, a=0.5;
        for(int i=0;i<5;i++){ v+=a*abs(2.0*noise2(p)-1.0); p*=2.02; a*=0.5; }
        return v;
      }
      float billow(vec2 p){
        float v=0.0, a=0.5;
        for(int i=0;i<5;i++){ v+=a*(1.0 - abs(2.0*noise2(p+11.3)-1.0)); p*=2.02; a*=0.5; }
        return v;
      }
      float worley(vec2 p){
        vec2 ip=floor(p), fp=fract(p); float md=1.0;
        for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
          vec2 g=vec2(float(x),float(y));
          vec2 o=vec2(hash21(ip+g), hash21(ip+g+7.13));
          vec2 rr=g+o-fp; md=min(md, dot(rr,rr));
        }
        return sqrt(md);
      }
      // Неровности края: смещение SД в зависимости от UV.
      // type 0 (Soft) — плавные закруглённые неровности, тип 1 (Sharp) — острые ступенчатые.
      float edgeUneven(vec2 uv, float edgeScale){
        if (uUneven <= 0.001) return 0.0;
        float amp = uUneven * edgeScale;
        if (uUnevenType == 1) {
          // острые: пороговый шум высокой частоты
          float n = noise2(floor(uv * 220.0));
          return (n - 0.5) * 2.0 * amp;
        }
        // мягкие: сглаженный fbm
        float n = fbm(uv * 14.0);
        return (n - 0.5) * 2.0 * amp;
      }
      void main(){
        vec2 uv = gl_FragCoord.xy / iResolution.xy;
        vec2 p = uv - uCenter;
        p.x *= iResolution.x / iResolution.y;       // аспект-коррекция
        float cov = 0.0;
        float fw = max(uFeather, 0.001);
        float d = 0.0;
        float hw = fw;        // полуширина размытия (в единицах p)
        if (uType == 0) {                            // circle
          d = sdCircle(p, uSize.x); hw = fw*uSize.x;
        } else if (uType == 1) {                     // ellipse
          vec2 q = rot(-uRot) * p;
          d = sdEllipse(q/uSize, vec2(1.0)); hw = fw*min(uSize.x,uSize.y);
        } else if (uType == 2) {                     // rect
          vec2 q = rot(-uRot) * p;
          d = sdBox(q, uSize); hw = fw*min(uSize.x,uSize.y);
        } else if (uType == 3) {                     // rrect
          vec2 q = rot(-uRot) * p;
          vec2 b = uSize;
          float r = min(min(uRadius, b.x), b.y);
          vec2 d2 = abs(q) - (b - vec2(r));
          d = length(max(d2,0.0)) + min(max(d2.x,d2.y),0.0) - r; hw = fw*min(b.x,b.y);
        } else if (uType == 4) {                     // square
          vec2 q = rot(-uRot) * p;
          float s = min(uSize.x, uSize.y);
          d = sdBox(q, vec2(s)); hw = fw*s;
        } else if (uType == 5) {                     // polygon
          vec2 q = rot(-uRot) * p;
          d = sdPolygon(q, max(3.0, floor(uSides+0.5)), uSize.x); hw = fw*uSize.x;
        } else if (uType == 6) {                     // star
          vec2 q = rot(-uRot) * p;
          d = sdStar(q, max(3.0, floor(uPoints+0.5)), uSize.x, uSize.x*0.5); hw = fw*uSize.x;
        } else if (uType == 7) {                     // line
          vec2 q = rot(-uRot) * p;
          d = abs(q.y) - uThickness*0.5; hw = fw*uThickness;
        } else if (uType == 8) {                     // noise
          vec2 np = uv * uScale + iTime * uSpeed;
          float n;
          if (uNoiseType == 0)      n = fbm(np);
          else if (uNoiseType == 1) n = worley(np);
          else if (uNoiseType == 2) n = ridged(np);
          else if (uNoiseType == 3) n = turbulence(np);
          else if (uNoiseType == 4) n = billow(np);
          else                      n = noise2(np);
          cov = 1.0 - smoothstep(uThreshold-fw, uThreshold+fw, n);
        } else if (uType == 9) {                     // free form curve
          // p уже равно (uv - uCenter) с аспект-коррекцией — ровно в той же
          // системе координат, что и uFreePts (точки хранятся относительно центра).
          d = sdFree(p); hw = fw * max(uSize.x, 0.05);
        }
        if (uType != 8) {
          // типы 0..7 и 9 (free form) вычисляют покрытие из SД расстояния d
          float edgeScale = max(hw, 0.02);
          d += edgeUneven(uv, edgeScale);
          cov = 1.0 - smoothstep(-hw, hw, d);
        }
        cov = clamp(cov, 0.0, 1.0);
        if (uInvert > 0.5) cov = 1.0 - cov;
        cov *= uStrength;
        gl_FragColor = vec4(cov, cov, cov, cov);
      }
    `;
    MASK_FRAG_SRC = fragSrc;
    _maskProg = _buildProg(fragSrc);

    _maskApplyProg = _buildProg(`
      uniform sampler2D uBase;
      uniform sampler2D uLayer;
      uniform sampler2D uMask;
      void main(){
        vec2 uv = gl_FragCoord.xy / iResolution.xy;
        vec4 base = texture2D(uBase, uv);
        vec4 layer = texture2D(uLayer, uv);
        float cov = texture2D(uMask, uv).a;
        cov = clamp(cov, 0.0, 1.0);
        gl_FragColor = mix(base, layer, cov);
      }
    `);
  }

  // Возвращает скомпилированную программу для маски типа 'code' (пользовательский
  // фрагментный шейдер). Кэшируется по id и перекомпилируется при изменении кода.
  function _getUserMaskProg(m) {
    const cached = _userMaskProgs[m.id];
    if (cached && cached.code === m.code && cached.prog) return cached.prog;
    if (cached && cached.prog) { try { gl.deleteProgram(cached.prog); } catch (e) {} }
    const prog = _buildProg(m.code || '');
    _userMaskProgs[m.id] = { code: m.code, prog: prog };
    return prog;
  }

  // Замкнутая Catmull-Rom кривая через точки pts, триангулированная в ~steps*N вершин.
  // curv[i] — натяжение (tension 0..1) для сегмента i→i+1 (1 = петли/сильный изгиб, 0 = прямая).
  function _renderMaskTexture(masks, time, w, h) {
    if (!masks || masks.length === 0) return null;
    const enabled = masks.filter(m => m.enabled);
    if (enabled.length === 0) return null;

    _ensureMaskProgs();
    if (!_maskProg) return null;
    _ensureMaskFB(w, h);

    gl.bindFramebuffer(gl.FRAMEBUFFER, _maskFB);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);   // аддитивно накапливаем покрытие
    gl.blendEquation(gl.FUNC_ADD);

    for (const m of enabled) {
      // ── Пользовательский фрагментный шейдер (тип 'code') ──
      if (m.type === 'code') {
        const prog = _getUserMaskProg(m);
        if (!prog) continue;
        gl.useProgram(prog);
        gl.uniform2f(gl.getUniformLocation(prog, 'iResolution'), w, h);
        gl.uniform1f(gl.getUniformLocation(prog, 'iTime'), time);
        const posLoc = gl.getAttribLocation(prog, 'aPos');
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        continue;
      }

      const code = _MASK_CODE[m.type] !== undefined ? _MASK_CODE[m.type] : 0;
      gl.useProgram(_maskProg);
      gl.uniform2f(gl.getUniformLocation(_maskProg, 'iResolution'), w, h);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'iTime'), time);
      gl.uniform1i(gl.getUniformLocation(_maskProg, 'uType'), code);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uInvert'), m.invert ? 1 : 0);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uStrength'), m.strength);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uFeather'), m.feather);
      gl.uniform2f(gl.getUniformLocation(_maskProg, 'uCenter'), m.cx, m.cy);
      gl.uniform2f(gl.getUniformLocation(_maskProg, 'uSize'), m.sx, m.sy);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uRot'), m.rot);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uSides'), m.sides);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uPoints'), m.points);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uRadius'), m.radius);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uThickness'), m.thickness);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uScale'), m.scale);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uSpeed'), m.speed);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uThreshold'), m.threshold);
      const nIdx = { fbm:0, cellular:1, ridged:2, turbulence:3, billow:4, value:5 }[m.noiseType] || 0;
      gl.uniform1i(gl.getUniformLocation(_maskProg, 'uNoiseType'), nIdx);
      gl.uniform1f(gl.getUniformLocation(_maskProg, 'uUneven'), m.uneven || 0.0);
      gl.uniform1i(gl.getUniformLocation(_maskProg, 'uUnevenType'), m.unevenType === 'sharp' ? 1 : 0);
      // Free Form: спрямляем Безье-кривую (по anchors) в плотный полигон —
      // шейдер рисует полигон, поэтому кривая получается аппроксимацией рёбер.
       let fpts = flattenFreeformMask(m, FREE_MAX_SHADER_POINTS);
      const count = Math.max(0, Math.min(fpts.length, FREE_MAX_SHADER_POINTS));
      const fp = [];
      for (let i = 0; i < count; i++) fp.push(fpts[i].x, fpts[i].y);
      if (count > 0) fp.push(fpts[0].x, fpts[0].y);   // замыкание
      // всегда передаём полный вектор (иначе установится мусор из прошлого кадра)
      while (fp.length < 256) fp.push(0, 0);
      gl.uniform2fv(gl.getUniformLocation(_maskProg, 'uFreePts'), new Float32Array(fp));
      gl.uniform1i(gl.getUniformLocation(_maskProg, 'uFreeCount'), count);
      const posLoc = gl.getAttribLocation(_maskProg, 'aPos');
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return _maskTex;
  }

  // Применяет маску слоя. baseTex — то, что было до слоя; layer нарисован в
  // layerFB (и даёт layerTex). Результат подаётся в targetFB с размером w,h.
  function _applyLayerMask(baseTex, layerTex, masks, time, targetFB, w, h) {
    const maskTex = _renderMaskTexture(masks, time, w, h);
    if (!maskTex) {
      // маски нет — просто копируем результат слоя в target
      _ensurePassthrough();
      gl.bindFramebuffer(gl.FRAMEBUFFER, targetFB);
      gl.viewport(0, 0, w, h);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      _drawQuadWithProg(_passthroughProg, layerTex, true, [], time, w, h);
      return;
    }
    _ensureMaskProgs();
    gl.bindFramebuffer(gl.FRAMEBUFFER, targetFB);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(_maskApplyProg);
    gl.uniform2f(gl.getUniformLocation(_maskApplyProg, 'iResolution'), w, h);

    _ensureNullTex();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, baseTex || _nullTex);
    gl.uniform1i(gl.getUniformLocation(_maskApplyProg, 'uBase'), 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, layerTex);
    gl.uniform1i(gl.getUniformLocation(_maskApplyProg, 'uLayer'), 1);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, maskTex);
    gl.uniform1i(gl.getUniformLocation(_maskApplyProg, 'uMask'), 2);

    const posLoc = gl.getAttribLocation(_maskApplyProg, 'aPos');
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.activeTexture(gl.TEXTURE0);
  }

  let _masterMaskApplyProg = null;

  function _ensureMasterMaskApplyProg() {
    if (_masterMaskApplyProg) return;

    _masterMaskApplyProg = _buildProg(`
uniform sampler2D uLayer;
uniform sampler2D uMask;

void main(){
    vec2 uv = gl_FragCoord.xy / iResolution.xy;

    vec4 layer = texture2D(uLayer, uv);
    float cov = texture2D(uMask, uv).a;
    cov = clamp(cov, 0.0, 1.0);

    float a = layer.a * cov;

    if (a <= 0.004) {
      gl_FragColor = vec4(0.0);
    } else {
      gl_FragColor = vec4(layer.rgb, a);
    }
}
`);
  }

  function applyMasterMask(inputTex, w, h, time, targetFB) {
    console.log("[MasterMask] applyMasterMask called", {
        hasInputTex: !!inputTex,
        w, h,
        masksCount: MasterMaskState.masks.length,
        enabledMasks: MasterMaskState.masks.filter(m => m.enabled).length,
        hasProg: !!_masterMaskApplyProg
    });

    const hasMasterMask = MasterMaskState.masks.some(m => m.enabled);
    if (!hasMasterMask) {
        console.log("[MasterMask] No enabled masks, using passthrough");
        _ensurePassthrough();
        gl.bindFramebuffer(gl.FRAMEBUFFER, targetFB);
        gl.viewport(0, 0, w, h);
        gl.clearColor(0,0,0,0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        _drawQuadWithProg(_passthroughProg, inputTex, !!inputTex, [], time, w, h);
        return;
    }

    const maskTex = _renderMaskTexture(MasterMaskState.masks, time, w, h);
    console.log("[MasterMask] maskTex:", !!maskTex);
    if (!maskTex) {
        _ensurePassthrough();
        gl.bindFramebuffer(gl.FRAMEBUFFER, targetFB);
        gl.viewport(0, 0, w, h);
        gl.clearColor(0,0,0,0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        _drawQuadWithProg(_passthroughProg, inputTex, !!inputTex, [], time, w, h);
        return;
    }

    _ensureMasterMaskApplyProg();
    console.log("[MasterMask] _masterMaskApplyProg:", !!_masterMaskApplyProg);

    gl.bindFramebuffer(gl.FRAMEBUFFER, targetFB);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(_masterMaskApplyProg);
    gl.uniform2f(gl.getUniformLocation(_masterMaskApplyProg, 'iResolution'), w, h);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, inputTex);
    gl.uniform1i(gl.getUniformLocation(_masterMaskApplyProg, 'uLayer'), 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, maskTex);
    gl.uniform1i(gl.getUniformLocation(_masterMaskApplyProg, 'uMask'), 1);

    const posLoc = gl.getAttribLocation(_masterMaskApplyProg, 'aPos');
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.activeTexture(gl.TEXTURE0);
    console.log("[MasterMask] Done");
  }

  function renderFrame(layersData, time) {
    if (!gl) return;
    var canvas = gl.canvas;
    var w = canvas.width;
    var h = canvas.height;
    if (!w || !h || w < 1 || h < 1) {
      console.warn("[ShaderFlow] renderFrame aborted: invalid canvas size", w, h);
      return;
    }
    const hasMasterMask = MasterMaskState.masks.some(m => m.enabled);
    const visible = layersData.filter(l => l.visible && l._prog);

    if (visible.length === 0) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, w, h);
      gl.clearColor(0,0,0,0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      if (texture && _passthroughProg) {
        _ensurePassthrough();
        if (hasMasterMask) {
          _ensurePingPong(w, h);
          gl.bindFramebuffer(gl.FRAMEBUFFER, pingPongFBs[0]);
          gl.viewport(0, 0, w, h);
          gl.clearColor(0,0,0,0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          _drawQuadWithProg(_passthroughProg, texture, true, [], time, w, h);
          applyMasterMask(pingPongTexs[0], w, h, time, null);
        } else {
          _drawQuadWithProg(_passthroughProg, texture, true, [], time, w, h);
        }
      } else if (hasMasterMask) {
        applyMasterMask(null, w, h, time, null);
      }
      return;
    }

    _ensurePingPong(w, h);
    let readIdx = 0, writeIdx = 1;
    let prevTex = texture;
    let hasFirst = !!texture;
    for (let i = 0; i < visible.length; i++) {
      const layer = visible[i];
      const isLast = i === visible.length - 1;
      const drawToCanvas = isLast && !hasMasterMask;
      const targetFB = drawToCanvas ? null : pingPongFBs[writeIdx];
      const inputTex = i === 0 ? prevTex : pingPongTexs[readIdx];
      const layerTex = _drawLayerToScratch(layer._prog, inputTex, i === 0 ? hasFirst : true, layer.uniforms, time, w, h);
      _applyLayerMask(prevTex, layerTex, layer.masks, time, targetFB, w, h);
      prevTex = pingPongTexs[writeIdx];
      if (!drawToCanvas) { const tmp = readIdx; readIdx = writeIdx; writeIdx = tmp; }
    }

    if (hasMasterMask) {
      applyMasterMask(prevTex, w, h, time, null);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
  }

  let _passthroughProg = null;
  function _ensurePassthrough() {
    if (_passthroughProg) return;
    _passthroughProg = _buildProg(`
void main() {
  vec2 uv = gl_FragCoord.xy / iResolution.xy;
  if (uHasTexture == 1) {
    gl_FragColor = texture2D(uTexture, uv);
  } else {
    gl_FragColor = vec4(0.0);
  }
}`);
  }

  function uploadTexture(img) {
    if (!gl) return;
    if (texture) gl.deleteTexture(texture);
    texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  }

  function clearTexture() {
    if (texture) { gl.deleteTexture(texture); texture = null; }
  }

  function getTime() {
    return S.timeOffset + (S.animated ? (performance.now() - S.startTime) / 1000 : 0);
  }

  function startLoop(onFrame, onErr) {
    _onFrame = onFrame; _onError = onErr;
    if (animId) cancelAnimationFrame(animId);
    _ensurePassthrough();
    tick(performance.now());
  }

  function renderBaseToTexture(w, h, time) {
    const hasLayers = ShaderLayers.hasLayers();
    const visible = hasLayers ? ShaderLayers.getVisibleLayersData().filter(l => l.visible && l._prog) : [];
    if (!hasLayers && !texture) return null;
    if (hasLayers && visible.length === 0 && !texture) return null;
    const outTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, outTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const outFB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, outFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, outTex, 0);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0,0,0,0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (hasLayers && visible.length > 0) {
      _ensurePingPong(w, h);
      let readIdx = 0, writeIdx = 1, prevTex = texture;
      for (let i = 0; i < visible.length; i++) {
        const layer = visible[i], isLast = i === visible.length - 1;
        const targetFB = isLast ? outFB : pingPongFBs[writeIdx];
        const inputTex = i === 0 ? prevTex : pingPongTexs[readIdx];
        const layerTex = _drawLayerToScratch(layer._prog, inputTex, i === 0 ? !!texture : true, layer.uniforms, time, w, h);
        _applyLayerMask(prevTex, layerTex, layer.masks, time, targetFB, w, h);
        prevTex = isLast ? null : pingPongTexs[writeIdx];
        if (!isLast) { const tmp = readIdx; readIdx = writeIdx; writeIdx = tmp; }
      }
    } else if (texture) {
      _ensurePassthrough();
      _drawQuadWithProg(_passthroughProg, texture, true, [], time, w, h);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(outFB);
    gl.bindTexture(gl.TEXTURE_2D, null);
    return outTex;
  }

  function tick(now) {
    animId = requestAnimationFrame(tick);
    if (!gl || gl.isContextLost()) return;

    if (_frameInterval > 0) {
      const elapsed = now - S.lastFrameTime;
      if (elapsed < _frameInterval - 0.5) return;
      S.lastFrameTime = now - (elapsed % _frameInterval);
    } else {
      S.lastFrameTime = now;
    }

    const t = getTime();
    if (S.activeTab === 'library' && LibraryPreview.isActive()) {
      const lp = LibraryPreview.getData();
      if (lp && lp.prog) {
        const c = gl.canvas;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, c.width, c.height);
        gl.clearColor(0,0,0,0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const baseTex = renderBaseToTexture(c.width, c.height, t);
        _drawQuadWithProg(lp.prog, baseTex, !!baseTex, lp.uniforms, t, c.width, c.height);
        if (baseTex) gl.deleteTexture(baseTex);
      }
      if (_onFrame) _onFrame(t);
      return;
    }
    try {
      const shaderLayers = ShaderLayers.getVisibleLayersData();
      const hasLayers = ShaderLayers.hasLayers();

      if (!hasLayers) {
        // Нет слоёв: показываем картинку Figma-объекта, либо дефолтный шейдер.
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        const canvas = gl.canvas;
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const hasMasterMask = MasterMaskState.masks.some(m => m.enabled);
        if (hasMasterMask) {
          _ensurePingPong(canvas.width, canvas.height);
          gl.bindFramebuffer(gl.FRAMEBUFFER, pingPongFBs[0]);
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.clearColor(0,0,0,0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          if (texture && _passthroughProg) {
            _ensurePassthrough();
            _drawQuadWithProg(_passthroughProg, texture, true, [], t, canvas.width, canvas.height);
          } else if (program) {
            _drawQuadWithProg(program, texture, !!texture, S.uniforms, t, canvas.width, canvas.height);
          }
          applyMasterMask(pingPongTexs[0], canvas.width, canvas.height, t, null);
        } else {
          if (texture && _passthroughProg) {
            _ensurePassthrough();
