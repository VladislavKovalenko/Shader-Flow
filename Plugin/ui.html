// Дефолтный фрагментный шейдер для маски типа 'code'.
// Правило: итоговое покрытие должно лежать в ALPHA-канале
// (gl_FragColor = vec4(rgb, cov)), движок берёт texture2D(uMask, uv).a.
const DEFAULT_MASK_CODE = `precision mediump float;

uniform vec2  iResolution;
uniform float iTime;

void main() {
  vec2 uv = gl_FragCoord.xy / iResolution.xy;

  // Пример: круг радиусом 0.3 в центре.
  vec2 p = uv - 0.5;
  float d = length(p) - 0.3;
  float cov = 1.0 - smoothstep(-0.01, 0.01, d);

  gl_FragColor = vec4(cov, cov, cov, cov);
}`;

const MaskModel = {
  nextId: 1,

  create(type) {
    const base = {
      id: 'm_' + (this.nextId++) + '_' + Math.random().toString(36).slice(2, 7),
      type: type || 'circle',
      name: MASK_TYPES[type] ? MASK_TYPES[type].label : (type || 'Mask'),
      enabled: true,
      invert: false,
      strength: 1.0,
      feather: 0.02,
      cx: 0.5, cy: 0.5,
      sx: 0.3, sy: 0.3,
      rot: 0.0,
      sides: 6,
      points: 5,
      radius: 0.1,
      thickness: 0.04,
      scale: 5.0,
      speed: 0.3,
      threshold: 0.5,
      noiseType: 'fbm',
      uneven: 0.0,
      unevenType: 'soft',
      smooth: false,
      curv: [],   // кривизна по сегментам (tension 0..1), индекс = сегмент i→i+1
      pts: [
        { x: -0.2, y: -0.2 }, { x: 0.2, y: -0.15 }, { x: 0.18, y: 0.2 }, { x: -0.16, y: 0.22 }
      ],
      code: '',
    };
    if (type === 'code') base.code = DEFAULT_MASK_CODE;

      if (type === 'freeform') {
        base.geom = 'bezier';
        base.anchors = [
          {
            x: -0.2,
            y: -0.2,
            mode: 'corner',
            hIn: { x: 0, y: 0 },
            hOut: { x: 0, y: 0 }
          },
          {
            x: 0.2,
            y: -0.15,
            mode: 'corner',
            hIn: { x: 0, y: 0 },
            hOut: { x: 0, y: 0 }
          },
          {
            x: 0.18,
            y: 0.2,
            mode: 'corner',
            hIn: { x: 0, y: 0 },
            hOut: { x: 0, y: 0 }
          },
          {
            x: -0.16,
            y: 0.22,
            mode: 'corner',
            hIn: { x: 0, y: 0 },
            hOut: { x: 0, y: 0 }
          }
        ];
      }

    return base;
  },

  clone(mask) {
    if (!mask) return null;

    const c = { ...mask };

    if (Array.isArray(c.pts)) {
      c.pts = c.pts.map(p => ({ x: p.x, y: p.y }));
    }

    if (Array.isArray(c.anchors)) {
      c.anchors = c.anchors.map(a => _normalizeFreeAnchor(a));
    }

    return c;
  },

  serialize(mask) { return this.clone(mask); },

  deserialize(data) {
    if (!data || !data.type) return null;

    const m = this.create(data.type);
    Object.assign(m, data);

    if (!Array.isArray(m.pts)) {
      m.pts = MaskModel.create('freeform').pts;
    }

    if (m.type === 'freeform') {
      // старая сохранённая маска (без поля anchors) — конвертируем из pts+curv
      if (!Array.isArray(data.anchors) || data.anchors.length === 0) m.anchors = [];
      ensureFreeformAnchors(m);
    }

    return m;
  }
};

const ShaderLayers = (() => {
  let layers = [];
  let activeLayerId = null;
  let editingId = null;   // id слоя, находящегося в режиме переименования (защита от наложения)
  let _gl = null;

  function setGL(gl) { _gl = gl; }

  function _compileProg(code) {
    try {
      const BUILTIN = ['iResolution','iTime','iMouse','uTexture','uHasTexture'];
      let cleaned = code;
      for (const name of BUILTIN) {
        const re = new RegExp(`^[ \\t]*uniform\\s+\\w+\\s+${name}\\s*;`, 'gm');
        cleaned = cleaned.replace(re, `// ${name} (injected)`);
      }
      const prefix = `precision mediump float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec2 iMouse;
uniform sampler2D uTexture;
uniform int uHasTexture;
`;
      const src = prefix + cleaned;
      const vSh = _gl.createShader(_gl.VERTEX_SHADER);
      _gl.shaderSource(vSh, `attribute vec2 aPos; void main(){gl_Position=vec4(aPos,0,1);}`);
      _gl.compileShader(vSh);

      const fSh = _gl.createShader(_gl.FRAGMENT_SHADER);
      _gl.shaderSource(fSh, src);
      _gl.compileShader(fSh);
      if (!_gl.getShaderParameter(fSh, _gl.COMPILE_STATUS)) {
        _gl.deleteShader(vSh); _gl.deleteShader(fSh);
        return null;
      }
      const prog = _gl.createProgram();
      _gl.attachShader(prog, vSh);
      _gl.attachShader(prog, fSh);
      _gl.linkProgram(prog);
      _gl.deleteShader(vSh);
      _gl.deleteShader(fSh);
      if (!_gl.getProgramParameter(prog, _gl.LINK_STATUS)) {
        _gl.deleteProgram(prog); return null;
      }
      return prog;
    } catch(e) { return null; }
  }

  function add(preset) {
    const id = 'el_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const prog = _compileProg(preset.code);
    const layer = {
      id,
      name: preset.name.replace(/^[\s\S]*?(\w)/, '$1').replace(/^[^\w]+/, '').trim(),
      code: preset.code,
      uniforms: (preset.uniforms || []).map(u => ({
        ...u,
        value: Array.isArray(u.value) ? [...u.value] : u.value
      })),
      visible: true,
      _prog: prog,
      masks: (preset.masks || []).map(m => MaskModel.deserialize(m)).filter(Boolean),
    };
    layers.push(layer);
    activeLayerId = id;
    renderList();
    activateLayer(id);
    UndoRedo.pushImmediate();
    return layer;
  }

  function remove(id) {
    const layer = layers.find(l => l.id === id);
    if (layer && layer._prog) {
      try { _gl.deleteProgram(layer._prog); } catch(e){}
    }
    layers = layers.filter(l => l.id !== id);

    if (activeLayerId === id) {
      activeLayerId = layers.length > 0 ? layers[layers.length - 1].id : null;
    }
    renderList();
    UndoRedo.pushImmediate();
    if (activeLayerId) {
      activateLayer(activeLayerId);
    } else {
      document.getElementById('code-editor').value = '';
      S.uniforms = [];
      UniformsUI.renderAll();
      updateLineNumbers();
      GL.buildProgramFromLayers([], null);
    }
  }

  function toggleVisible(id) {
    const l = layers.find(l => l.id === id);
    if (l) { l.visible = !l.visible; renderList(); UndoRedo.pushImmediate(); }
  }

  function rename(id, newName) {
    const l = layers.find(l => l.id === id);
    if (l && newName && newName.trim()) l.name = newName.trim();
    // Всегда перерисовываем: teardown режима редактирования не должен
    // зависеть от того, изменилось ли имя (иначе input остаётся в списке).
    editingId = null;
    renderList();
    UndoRedo.pushImmediate();
  }

  function startRename(row, layer, nameEl) {
    if (editingId) return;                 // уже идёт редактирование — не накладываем
    if (row.querySelector('.effect-layer-rename')) return;
    editingId = layer.id;
    const input = document.createElement('input');
    input.className = 'effect-layer-rename';
    input.value = layer.name;
    input.style.flex = '1';
    input.style.fontSize = '11px';
    nameEl.replaceWith(input);
    input.focus();
    input.select();

    const commit = () => rename(layer.id, input.value);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.stopPropagation(); editingId = null; renderList(); }
    });
    input.addEventListener('blur', commit);
  }

  function saveCurrentToLayer(id) {
    const layer = layers.find(l => l.id === id);
    if (!layer) return;
    const newCode = document.getElementById('code-editor').value;
    if (layer.code !== newCode) {
      layer.code = newCode;
      if (layer._prog) { try { _gl.deleteProgram(layer._prog); } catch(e){} }
      layer._prog = _compileProg(newCode);
    }
    layer.uniforms = S.uniforms.map(u => ({
      ...u,
      value: Array.isArray(u.value) ? [...u.value] : u.value
    }));
  }

  function activateLayer(id, skipSave = false) {
    if (!skipSave && activeLayerId && activeLayerId !== id) {
      saveCurrentToLayer(activeLayerId);
    }
    activeLayerId = id;
    const layer = layers.find(l => l.id === id);
    if (!layer) return;

    document.getElementById('code-editor').value = layer.code;
    S.uniforms = layer.uniforms.map(u => ({
      ...u,
      value: Array.isArray(u.value) ? [...u.value] : u.value
    }));
    UniformsUI.renderAll();
    updateLineNumbers();
    compile();
    // НЕ вызываем renderList(): полная перерисовка уничтожает DOM-узел строки
    // между двумя кликами двойного клика, из-за чего событие dblclick не срабатывает.
    updateActiveHighlight();
  }

  function updateActiveHighlight() {
    const listEl = document.getElementById('shader-layers');
    if (!listEl) return;
    listEl.querySelectorAll('.effect-layer-row').forEach(row => {
      row.classList.toggle('active', row.dataset.id === activeLayerId);
    });
  }

  function saveActive() {
    if (activeLayerId) saveCurrentToLayer(activeLayerId);
  }

  function getVisibleLayersData() {
    return layers.map(l => ({
      id: l.id,
      name: l.name,
      visible: l.visible,
      uniforms: l.uniforms,
      _prog: l._prog,
      masks: (l.masks || []).map(m => MaskModel.clone(m)),
    }));
  }

  function hasLayers() { return layers.length > 0; }

  function clear() {
    layers.forEach(l => {
      if (l._prog) { try { _gl.deleteProgram(l._prog); } catch(e){} }
    });
    layers = [];
    activeLayerId = null;
    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('shader-layers');
    const emptyState = document.getElementById('shader-layers-empty-state');
    if (!listEl) return;
    listEl.innerHTML = '';

    if (layers.length === 0) {
      if (emptyState) emptyState.style.display = 'block';
      return;
    }
    if (emptyState) emptyState.style.display = 'none';

    [...layers].reverse().forEach(layer => {
      const row = document.createElement('div');
      row.className = 'effect-layer-row' + (layer.id === activeLayerId ? ' active' : '');
      row.dataset.id = layer.id;
      row.draggable = true;

      const nameEl = document.createElement('span');
      nameEl.className = 'effect-layer-name';
      nameEl.textContent = layer.name;

      const visBtn = document.createElement('button');
      visBtn.className = 'effect-layer-vis' + (layer.visible ? '' : ' hidden-layer');
      visBtn.setAttribute('data-tip', layer.visible ? 'Hide layer' : 'Show layer');
      visBtn.textContent = layer.visible ? '◉' : '○';
      visBtn.addEventListener('click', e => { e.stopPropagation(); toggleVisible(layer.id); });

      const delBtn = document.createElement('button');
      delBtn.className = 'effect-layer-del';
      delBtn.textContent = '×';
      delBtn.setAttribute('data-tip', 'Delete layer');
      delBtn.addEventListener('click', e => { e.stopPropagation(); remove(layer.id); });

      const maskBtn = document.createElement('button');
      maskBtn.className = 'effect-layer-masks';
      const maskCount = (layer.masks || []).length;
      maskBtn.textContent = '▦' + (maskCount ? maskCount : '');
      maskBtn.setAttribute('data-tip', 'Layer masks (' + maskCount + ')');
      maskBtn.addEventListener('click', e => { e.stopPropagation(); openMaskEditor('shader', layer.id); });

      row.append(nameEl, visBtn, maskBtn, delBtn);
      row.addEventListener('click', () => activateLayer(layer.id));
      row.addEventListener('dblclick', e => {
        e.stopPropagation();
        startRename(row, layer, nameEl);
      });
      listEl.appendChild(row);
    });
    enableLayerDragSort(listEl, () => layers, (arr) => { layers = arr; }, renderList);
    autoUpdatePanelsVisibility();
  }

  function reactivate() {
    if (activeLayerId) {
      const layer = layers.find(l => l.id === activeLayerId);
      if (!layer) return;
      document.getElementById('code-editor').value = layer.code;
      S.uniforms = layer.uniforms.map(u => ({
        ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
      }));
      UniformsUI.renderAll();
      updateLineNumbers();
    }
    renderList();
  }

  function getAll() {
    return layers.map(l => ({
      id: l.id,
      name: l.name,
      code: l.code,
      visible: l.visible,
      uniforms: l.uniforms.map(u => ({ ...u, value: Array.isArray(u.value) ? [...u.value] : u.value })),
      masks: (l.masks || []).map(m => MaskModel.serialize(m))
    }));
  }

  function setAll(arr, activeId = null, skipSave = false) {
    layers = (arr || []).map(l => ({
      id: l.id,
      name: l.name,
      code: l.code,
      visible: l.visible,
      uniforms: l.uniforms.map(u => ({ ...u, value: Array.isArray(u.value) ? [...u.value] : u.value })),
      masks: (l.masks || []).map(m => MaskModel.deserialize(m)).filter(Boolean),
      _prog: _compileProg(l.code)
    }));
    
    let targetId = activeId;
    if (targetId && !layers.find(l => l.id === targetId)) targetId = null;
    if (!targetId && layers.length > 0) targetId = layers[layers.length - 1].id;
    
    activeLayerId = targetId;
    renderList();
    
    if (activeLayerId) {
      activateLayer(activeLayerId, skipSave);
    } else { 
      document.getElementById('code-editor').value = ''; 
      S.uniforms = []; 
      UniformsUI.renderAll(); 
      updateLineNumbers(); 
    }
  }

  return {
    setGL, add, remove, toggleVisible,
    activateLayer, saveActive, reactivate,
    getVisibleLayersData, hasLayers, clear, renderList,
    getAll, setAll,
    getLayer(id) { return layers.find(l => l.id === id) || null; },
    getActive() { return activeLayerId ? (layers.find(l => l.id === activeLayerId) || null) : null; },
    // Восстанавливает весь стек слоёв из цепочки (.sfchain).
    loadChain(stages) {
      layers = (stages || []).map(s => {
        const id = 'el_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const unifs = s.uniforms ? Object.entries(s.uniforms).map(([name, data]) => {
          const isMeta = data && typeof data === 'object' && !Array.isArray(data) && 'value' in data;
          const raw = isMeta ? data.value : data;
          let inferred = 'float';
          if (Array.isArray(raw)) {
            inferred = raw.length === 2 ? 'vec2' : (raw.length === 3 ? 'vec3' : 'vec4');
          } else if (typeof raw === 'boolean') {
            inferred = 'bool';
          } else if (typeof raw === 'number') {
            inferred = Number.isInteger(raw) ? 'int' : 'float';
          }
          return {
            name,
            type: isMeta && data.type ? data.type : inferred, // Сохраняем vec3color
            value: Array.isArray(raw) ? [...raw] : raw,
            min: isMeta && data.min !== undefined ? data.min : undefined,
            max: isMeta && data.max !== undefined ? data.max : undefined
          };
        }) : [];
        return {
          id,
          name: (s.shaderName || 'Effect').replace(/^[\s\S]*?(\w)/, '$1').replace(/^[^\w]+/, '').trim() || 'Effect',
          code: s.shaderSource || '',
          uniforms: unifs,
          visible: s.visible !== false,
          _prog: _compileProg(s.shaderSource || ''),
          masks: (s.masks || []).map(m => MaskModel.deserialize(m)).filter(Boolean)
        };
      });
      activeLayerId = layers.length > 0 ? layers[layers.length - 1].id : null;
      renderList();
      if (activeLayerId) {
        activateLayer(activeLayerId);
      } else {
        document.getElementById('code-editor').value = '';
        S.uniforms = [];
        UniformsUI.renderAll();
        updateLineNumbers();
      }
    }
  };
})();


/* ═══════════════════════════════════════════════════════════════════
   UNDO / REDO
═══════════════════════════════════════════════════════════════════ */

const UndoRedo = (() => {
    const MAX = 50;
    let _locked = false;
    let _pushTimerG = null;
    const H = { stack: [], pointer: -1 };

    function _cloneLayers(list) {
        return (list || []).map(l => ({
            id: l.id, name: l.name, code: l.code, visible: l.visible,
            uniforms: l.uniforms.map(u => ({
                ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
            })),
            masks: (l.masks || []).map(m => MaskModel.serialize(m))
        }));
    }

    function _snapshot() {
        return {
            code: document.getElementById('code-editor').value,
            uniforms: JSON.parse(JSON.stringify(S.uniforms)),
            activeLayerId: ShaderLayers.getActive ? (ShaderLayers.getActive()?.id || null) : null,
            shaderLayers: _cloneLayers(ShaderLayers.getAll()),
            masterMask: MasterMaskState.masks.map(m => MaskModel.serialize(m))
        };
    }

    function _equal(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

    function _pushTo(h, snap) {
        if (h.pointer >= 0 && _equal(h.stack[h.pointer], snap)) return;
        h.stack = h.stack.slice(0, h.pointer + 1);
        h.stack.push(snap);
        if (h.stack.length > MAX) h.stack.shift();
        h.pointer = h.stack.length - 1;
        _updateButtons();
    }

    function push() {
        if (_locked) return;
        clearTimeout(_pushTimerG);
        _pushTimerG = setTimeout(() => _pushTo(H, _snapshot()), 250);
    }

    function pushImmediate() {
        if (_locked) return;
        clearTimeout(_pushTimerG);
        _pushTo(H, _snapshot());
    }

    function undo() { if (H.pointer <= 0) return; H.pointer--; _restore(H.stack[H.pointer]); }
    function redo() { if (H.pointer >= H.stack.length - 1) return; H.pointer++; _restore(H.stack[H.pointer]); }

    function _restore(snap) {
        _locked = true;
        
        S.uniforms = JSON.parse(JSON.stringify(snap.uniforms));
        ShaderLayers.setAll(snap.shaderLayers, snap.activeLayerId, true); // skipSave = true
        
        const active = ShaderLayers.getActive();
        if (!active) {
            document.getElementById('code-editor').value = snap.code;
            S.uniforms = JSON.parse(JSON.stringify(snap.uniforms));
            UniformsUI.renderAll();
            updateLineNumbers();
            compile();
        }
        
        if (snap.masterMask) {
            MasterMaskState.masks = snap.masterMask.map(m => MaskModel.deserialize(m)).filter(Boolean);
        } else {
            MasterMaskState.masks = [];
        }
        updateMasterMaskButton();
        autoUpdatePanelsVisibility();
        
        _locked = false; _updateButtons();
    }

    function _updateButtons() {
        const u = document.getElementById('btn-undo'), r = document.getElementById('btn-redo');
        if (u) u.disabled = H.pointer <= 0;
        if (r) r.disabled = H.pointer >= H.stack.length - 1;
    }

    return { push, pushImmediate, undo, redo, isLocked: () => _locked };
})();

/* ─── Общий drag-and-drop для списков слоёв (Effect и Generator) ───
   listEl     — контейнер со строками .effect-layer-row
   getItems   — () => массив слоёв в порядке обработки (data-порядок)
   setItems   — (arr) => сохраняет новый data-порядок
   render     — () => перерисовывает список
   Строки рендерятся в обратном порядке (верх списка = конец массива),
   поэтому пересчёт позиции ведётся в "экранном" порядке, затем разворачивается. */
function enableLayerDragSort(listEl, getItems, setItems, render) {
  if (!listEl) return;
  if (listEl._dndEnabled) return; // навешиваем обработчики только один раз
  listEl._dndEnabled = true;

  let dragId = null;

  listEl.addEventListener('dragstart', e => {
    const row = e.target.closest('.effect-layer-row');
    if (!row) return;
    dragId = row.dataset.id;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {}
  });

  listEl.addEventListener('dragend', () => {
    const d = listEl.querySelector('.dragging');
    if (d) d.classList.remove('dragging');
    dragId = null;
  });

  // Только разрешаем drop; не перерисовываем список во время перетаскивания,
  // иначе исходный узел удаляется и нативный drag прерывается браузером.
  listEl.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });

  listEl.addEventListener('drop', e => {
    e.preventDefault();
    const row = e.target.closest('.effect-layer-row');
    const id = dragId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
    if (!row || !id) return;
    const overId = row.dataset.id;
    if (id === overId) return;

    const arr = getItems();
    // Экранный порядок = массив, развёрнутый задом наперёд
    const screen = [...arr].reverse();
    const di = screen.findIndex(x => x.id === id);
    const oi = screen.findIndex(x => x.id === overId);
    if (di === -1 || oi === -1) return;

    const rect = row.getBoundingClientRect();
    const after = (e.clientY - rect.top) / rect.height > 0.5;

    const [moved] = screen.splice(di, 1);
    let insertAt = oi + (after ? 1 : 0);
    if (di < oi) insertAt--;
    screen.splice(insertAt, 0, moved);

    setItems([...screen].reverse());
    render();
    UndoRedo.push();
  });
}

function autoUpdatePanelsVisibility() {
  const genList = document.getElementById('shader-layers');
  const effList = document.getElementById('shader-layers');

  // Считаем реальные слои (обе панели используют .effect-layer-row)
  const genCount = genList
    ? genList.querySelectorAll('.effect-layer-row').length : 0;
  const effCount = effList
    ? effList.querySelectorAll('.effect-layer-row').length : 0;

  const genHeader = document.querySelector('[data-target="shader-layers"]');
  if (genList && genHeader) {
    const shouldCollapse = genCount === 0;
    genList.classList.toggle('collapsed', shouldCollapse);
    genHeader.classList.toggle('collapsed', shouldCollapse);
    const arrow = genHeader.querySelector('.arrow-icon');
    if (arrow) arrow.innerText = shouldCollapse ? '▶' : '▼';
  }

  const effHeader = document.querySelector('[data-target="shader-layers"]');
  if (effList && effHeader) {
    const shouldCollapse = effCount === 0;
    effList.classList.toggle('collapsed', shouldCollapse);
    effHeader.classList.toggle('collapsed', shouldCollapse);
    const arrow = effHeader.querySelector('.arrow-icon');
    if (arrow) arrow.innerText = shouldCollapse ? '▶' : '▼';
  }
}

const LibraryManager = {
  treeContainer: null,
  statusLabel: null,
  cachedFiles: [],
  DEFAULT_PRESETS: [],

  init(containerId, statusId) {
    this.treeContainer = document.getElementById(containerId);
    this.statusLabel = document.getElementById(statusId);
    this.buildDefaultPresets();

    parent.postMessage({ pluginMessage: { type: 'get-cached-library' } }, '*');

    const input = document.getElementById('choose-library-input');
    input.addEventListener('change', (e) => {
      this.handleFolderSelect(e.target.files);
    });

    setTimeout(() => {
      if (this.cachedFiles.length === 0 && this.treeContainer.children.length === 0) {
        this.buildAndRenderTree();
      }
    }, 500);
  },

  buildDefaultPresets() {
    this.DEFAULT_PRESETS = PRESETS.filter(p => !p.isCustom).map(p => ({
      name: (p.name || '').replace(/^[^\w\d\u00C0-\u024F]+\s*/, ''),
      type: p.category === 'effect' ? 'Effect' : 'Generate',
      content: p.code,
      uniforms: p.uniforms || []
    }));
  },

  handleFolderSelect(files) {
    if (!files || files.length === 0) return;

    this.cachedFiles = Array.from(files).filter(file =>
      /\.(txt|sfshader|sfchain)$/i.test(file.name)
    );

    if (this.cachedFiles.length > 0) {
      const rootName = this.cachedFiles[0].webkitRelativePath.split('/')[0];
      this.statusLabel.innerText = rootName;
    }

    this.buildAndRenderTree();
    this.saveLibraryToStorage();
  },

  buildAndRenderTree() {
    this.treeContainer.innerHTML = '';
    const combinedTree = {};

    const createDir = () => ({ _type: 'dir', files: {}, isCollapsed: false });

    // ── Basic Library: дефолтные шейдеры (PRESETS) ──
    combinedTree["Basic Library"] = createDir();
    combinedTree["Basic Library"].files["Generate"] = createDir();
    combinedTree["Basic Library"].files["Effect"] = createDir();

    this.DEFAULT_PRESETS.forEach(preset => {
      const targetSubfolder = combinedTree["Basic Library"].files[preset.type].files;
      targetSubfolder[preset.name + '.txt'] = {
        _type: 'file',
        shaderType: preset.type,
        fileFormat: 'txt',
        uniforms: preset.uniforms,
        fileRef: { name: preset.name + '.txt', text: () => Promise.resolve(preset.content) }
      };
    });

    // ── User Library: папки, выбранные через "Choose Shader Library" ──
    combinedTree["User Library"] = createDir();
    if (this.cachedFiles.length > 0) {
      this.cachedFiles.forEach(file => {
        const parts = file.webkitRelativePath.split('/');
        const pathParts = parts.slice(1); // без корневой папки

        let current = combinedTree["User Library"].files;
        pathParts.forEach((part, index) => {
          if (index === pathParts.length - 1) {
            const isGenerate = part.toLowerCase().includes('gen');
            const fmt = SfShader.detectFormat(part);
            current[part] = {
              _type: 'file',
              shaderType: isGenerate ? 'Generate' : 'Effect',
              fileFormat: fmt,
              fileRef: file
            };
          } else {
            if (!current[part]) current[part] = createDir();
            current = current[part].files;
          }
        });
      });
    } else {
      combinedTree["User Library"].files["(no library folder selected)"] = {
        _type: 'empty', text: 'Choose "Shader Library" in Settings to add shaders here.'
      };
    }

    this.renderTree(combinedTree, this.treeContainer);
  },

  renderTree(treeObj, container) {
    for (const key in treeObj) {
      const item = treeObj[key];

      if (item._type === 'dir') {
        const folderEl = document.createElement('div');
        folderEl.className = 'lib-folder';

        const titleEl = document.createElement('div');
        titleEl.className = 'lib-folder-title';
        titleEl.innerText = `📁 ${key}`;

        const contentEl = document.createElement('div');
        contentEl.className = 'lib-folder-content';
        contentEl.style.paddingLeft = '12px';

        if (item.isCollapsed) {
          titleEl.classList.add('collapsed');
          contentEl.classList.add('collapsed');
        }

        titleEl.addEventListener('click', () => {
          const isNowCollapsed = contentEl.classList.toggle('collapsed');
          titleEl.classList.toggle('collapsed', isNowCollapsed);
        });

        this.renderTree(item.files, contentEl);
        folderEl.appendChild(titleEl);
        folderEl.appendChild(contentEl);
        container.appendChild(folderEl);

      } else if (item._type === 'file') {
        const fileEl = document.createElement('div');
        fileEl.className = 'lib-file';

        // Определяем формат и иконку
        const fmt = item.fileFormat || SfShader.detectFormat(key);
        const iconMap = {
          sfshader: { symbol: '◆', cls: 'type-sfshader', label: 'Shader' },
          sfchain:  { symbol: '⛓', cls: 'type-sfchain',  label: 'Chain'  },
          txt:      { symbol: '≡', cls: 'type-txt',      label: 'GLSL'   }
        };
        const icon = iconMap[fmt] || iconMap.txt;

        const iconEl = document.createElement('span');
        iconEl.className = 'lib-file-icon ' + icon.cls;
        iconEl.textContent = icon.symbol;
        iconEl.setAttribute('data-tip', icon.label + ' file');

        const nameSpan = document.createElement('span');
        nameSpan.className = 'lib-file-name';
        nameSpan.textContent = key.replace(/\.(txt|sfshader|sfchain)$/i, '');

        fileEl.append(iconEl, nameSpan);

        const fileName = key.replace(/\.(txt|sfshader|sfchain)$/i, '');

        // ── Вспомогательная: парсит файл в { code, uniforms } ──
        const parseLibFile = async () => {
          const raw = await item.fileRef.text();

          if (item.fileFormat === 'sfshader') {
            try {
              return SfShader.parse(raw);
            } catch (e) {
              console.warn('[ShaderFlow] Bad .sfshader, fallback to raw GLSL:', e);
              return {
                name: fileName,
                code: raw,
                uniforms: UniformParser.sync([], UniformParser.parse(raw)),
                masks: []
              };
            }
          }

          if (item.fileFormat === 'sfchain') {
            return null; // цепочки обрабатываются отдельно
          }

          // .txt — чистый GLSL
          const code = raw;
          let uniforms = item.uniforms;
          if (!Array.isArray(uniforms) || uniforms.length === 0) {
            uniforms = UniformParser.sync([], UniformParser.parse(code));
          }
          return { name: fileName, code, uniforms, masks: [] };
        };

        // ── Добавить как новый слой ──
        const addShaderFromLib = async () => {
          if (item.fileFormat === 'sfchain') {
            const raw = await item.fileRef.text();
            EffectSerializer.deserializeEffect(raw);
            switchTab('shader');
            return;
          }

          const parsed = await parseLibFile();
          if (!parsed) return;

          ShaderLayers.add({
            name: fileName || parsed.name || 'Shader',
            code: parsed.code,
            uniforms: (parsed.uniforms || []).map(u => ({
              ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
            })),
            masks: parsed.masks || []
          });
          switchTab('shader');
        };

        // ── Клик: превью ──
        fileEl.addEventListener('click', async (e) => {
          e.stopPropagation();

          if (item.fileFormat === 'sfchain') {
            setStatus('Chain file — right-click → Load Chain', 'info');
            return;
          }

          const parsed = await parseLibFile();
          if (!parsed) return;

          const ok = LibraryPreview.show(parsed.code, parsed.uniforms);
          if (!ok) { setStatus('Library shader compilation failed', 'error'); return; }
          document.querySelectorAll('.lib-file.selected').forEach(el => el.classList.remove('selected'));
          fileEl.classList.add('selected');
        });

        // ── Двойной клик: добавить как слой ──
        fileEl.addEventListener('dblclick', async (e) => {
          e.stopPropagation();
          await addShaderFromLib();
        });

        // ── ПКМ: контекстное меню ──
        fileEl.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();

          const fmt = item.fileFormat || SfShader.detectFormat(key);
          const actions = [];

          if (fmt === 'sfchain') {
            // Для цепочек — Load Chain
            actions.push({
              label: 'Load Chain',
              handler: async () => {
                const raw = await item.fileRef.text();
                EffectSerializer.deserializeEffect(raw);
                switchTab('shader');
              }
            });
          } else {
            // Для .sfshader и .txt — Add as new layer
            actions.push({
              label: 'Add as new layer',
              handler: addShaderFromLib
            });
          }

          LibraryContextMenu.show(fileEl, actions);
        });

        container.appendChild(fileEl);
      } else if (item._type === 'empty') {
        const emptyEl = document.createElement('div');
        emptyEl.className = 'lib-empty-state';
        emptyEl.innerText = item.text || 'Empty';
        container.appendChild(emptyEl);
      }
    }
  },

  async saveLibraryToStorage() {
    const storageData = {
      rootName: this.statusLabel.innerText,
      files: []
    };
    for (const file of this.cachedFiles) {
      const content = await file.text();
      storageData.files.push({
        path: file.webkitRelativePath,
        content: content
      });
    }
    parent.postMessage({
      pluginMessage: {
        type: 'save-library-data',
        data: storageData
      }
    }, '*');
  },

  restoreFromStorage(storageData) {
    if (!storageData || !storageData.files) return;
    this.statusLabel.innerText = storageData.rootName || "Shader Library";
    this.cachedFiles = storageData.files.map(f => ({
      name: f.path.split('/').pop(),
      webkitRelativePath: f.path,
      text: () => Promise.resolve(f.content)
    }));
    this.buildAndRenderTree();
  }
};

/* ═══════════════════════════════════════════════════════════════════
   LIBRARY CONTEXT MENU (ПКМ по шейдеру в Library)
   Показывает "Add as new layer" — шейдер добавляется как новый слой.
═══════════════════════════════════════════════════════════════════ */
const LibraryContextMenu = (() => {
    let el = null;

    function ensureEl() {
        if (el) return el;
        el = document.createElement('div');
        el.className = 'lib-context-menu';
        el.style.display = 'none';
        document.body.appendChild(el);
        el.addEventListener('click', (e) => { e.stopPropagation(); });
        document.addEventListener('click', () => hide());
        document.addEventListener('contextmenu', (e) => {
            if (!el.contains(e.target)) hide();
        });
        window.addEventListener('blur', () => hide());
        return el;
    }

    function hide() {
        if (el) el.style.display = 'none';
    }

    function show(anchorEl, actions) {
        const menu = ensureEl();
        menu.innerHTML = '';
        menu.style.display = 'block';

        for (const action of actions) {
            const item = document.createElement('button');
            item.className = 'lib-context-menu-item';
            item.innerText = action.label;
            item.addEventListener('click', () => {
                hide();
                action.handler();
            });
            menu.appendChild(item);
        }

        const zoom = parseFloat(document.documentElement.style.zoom) || 1;
        menu.style.left = '0px';
        menu.style.top = '0px';
        const rect = menu.getBoundingClientRect();
        const anchorRect = anchorEl.getBoundingClientRect();
        let x = (anchorRect.right + 4) / zoom;
        let y = anchorRect.top / zoom;
        const ww = window.innerWidth / zoom, wh = window.innerHeight / zoom;
        if (x + rect.width > ww) x = (anchorRect.left - 4) / zoom - rect.width;
        if (y + rect.height > wh) y = wh - rect.height - 4;
        if (y < 4) y = 4;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
    }

    return { show, hide };
})();

/* ═══════════════════════════════════════════════════════════════════
   EFFECT SERIALIZER
═══════════════════════════════════════════════════════════════════ */

const EffectSerializer = {
  CURRENT_VERSION: 1,

  serializeCurrentEffect(effectName) {
    const stagesData = [];
    if (ShaderLayers.hasLayers()) {
      ShaderLayers.saveActive(); // Сохраняем текущие правки из редактора в активный слой
      const layers = ShaderLayers.getAll(); // Используем getAll(), чтобы получить свойство `code`
      for (const layer of layers) {
        const u = {};
        for (const unif of (layer.uniforms || [])) {
          u[unif.name] = { type: unif.type, value: unif.value, min: unif.min, max: unif.max };
        }
        stagesData.push({
          shaderName: layer.name,
          shaderSource: layer.code || '',
          uniforms: u,
          visible: layer.visible !== false,
          masks: (layer.masks || []).map(m => MaskModel.serialize(m))
        });
      }
    } else {
      stagesData.push({
        shaderName: effectName,
        shaderSource: document.getElementById('code-editor').value,
        uniforms: (() => {
          const u = {};
          for (const unif of S.uniforms) u[unif.name] = { type: unif.type, value: unif.value, min: unif.min, max: unif.max };
          return u;
        })(),
        visible: true,
        masks: []
      });
    }
    return JSON.stringify({
      version: this.CURRENT_VERSION,
      name: effectName,
      stages: stagesData,
      masterMask: MasterMaskState.masks.map(m => MaskModel.serialize(m)),
      settings: { // Сохраняем глобальные настройки кнопок
        resolution: S.resolution,
        exactPreview: S.exactPreview,
        animated: S.animated,
        fps: document.getElementById('frame-rate-select') ? document.getElementById('frame-rate-select').value : '60'
      }
    }, null, 2);
  },

  deserializeEffect(jsonString) {
    try {
      const data = JSON.parse(jsonString);
      if (!data || data.version === undefined) throw new Error("Invalid format");
      if (!data.stages || data.stages.length === 0) throw new Error("Empty chain");

      ShaderLayers.clear();
      ShaderLayers.loadChain(data.stages);

      if (data.masterMask) {
        MasterMaskState.masks = data.masterMask.map(m => MaskModel.deserialize(m)).filter(Boolean);
      } else {
        MasterMaskState.masks = [];
      }
      updateMasterMaskButton();

      // Восстанавливаем глобальные настройки плагина
      if (data.settings) {
        if (data.settings.resolution) {
          S.resolution = data.settings.resolution;
          const resSelect = document.getElementById('res-select');
          if (resSelect) resSelect.value = S.resolution;
        }
        if (typeof data.settings.exactPreview === 'boolean') {
          S.exactPreview = data.settings.exactPreview;
          const exactInput = document.getElementById('exact-preview-input');
          if (exactInput) exactInput.checked = S.exactPreview;
          const canvas = document.getElementById('gl-canvas');
          if (canvas) canvas.style.imageRendering = S.exactPreview ? 'pixelated' : 'auto';
        }
        if (typeof data.settings.animated === 'boolean') {
          S.animated = data.settings.animated;
          const playBtn = document.getElementById('btn-play');
          if (playBtn) {
            if (S.animated) {
              S.startTime = performance.now();
              playBtn.textContent = '⏸';
              playBtn.classList.add('active');
            } else {
              S.timeOffset = GL.getTime();
              playBtn.textContent = '▶';
              playBtn.classList.remove('active');
            }
          }
        }
        if (data.settings.fps) {
          const frameRateSelect = document.getElementById('frame-rate-select');
          if (frameRateSelect) {
            frameRateSelect.value = data.settings.fps;
            GL.setFrameRate(parseInt(data.settings.fps));
          }
        }
      }

      // Триггерим ресайз, чтобы canvas обновил размеры согласно S.resolution
      window.dispatchEvent(new Event('resize'));

      if (S.activeTab !== 'shader') switchTab('shader');
      UndoRedo.pushImmediate();
      setStatus('Chain loaded', 'success');
    } catch (e) {
      setStatus('Failed to load effect: ' + e.message, 'error');
      console.error(e);
    }
  },

  downloadFile(content, fileName) {
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    link.click();
    URL.revokeObjectURL(url);
  }
};

/* ═══════════════════════════════════════════════════════════════════════
SFSHADER FORMAT — serialize / parse single shader files
═══════════════════════════════════════════════════════════════════════ */
const SfShader = {

    // Сериализует одиночный шейдер (активный слой или код из редактора)
    serialize(name) {
        let code, uniforms, masks;

        if (ShaderLayers.hasLayers()) {
            ShaderLayers.saveActive();
            const active = ShaderLayers.getActive();
            if (active) {
                code    = active.code;
                uniforms = active.uniforms;
                masks   = active.masks || [];
            } else {
                code    = document.getElementById('code-editor').value;
                uniforms = S.uniforms;
                masks   = [];
            }
        } else {
            code    = document.getElementById('code-editor').value;
            uniforms = S.uniforms;
            masks   = [];
        }

        const u = {};
        for (const unif of (uniforms || [])) {
            u[unif.name] = {
                type:  unif.type,
                value: Array.isArray(unif.value) ? [...unif.value] : unif.value,
                min:   unif.min !== undefined ? unif.min : null,
                max:   unif.max !== undefined ? unif.max : null
            };
        }

        return JSON.stringify({
            version: 1,
            format: 'sfshader',
            name: name || 'Untitled Shader',
            shaderSource: code,
            uniforms: u,
            masks: (masks || []).map(m => MaskModel.serialize(m)),
            settings: {
                resolution: S.resolution,
                animated: S.animated
            }
        }, null, 2);
    },

    // Парсит содержимое .sfshader файла → { code, uniforms, masks, settings, name }
    parse(text) {
        const data = JSON.parse(text);
        if (!data || data.format !== 'sfshader' || !data.shaderSource) {
            throw new Error('Invalid .sfshader file');
        }

        const uniforms = Object.entries(data.uniforms || {}).map(([name, d]) => ({
            name,
            type:  d.type || 'float',
            value: Array.isArray(d.value) ? [...d.value] : d.value,
            min:   (d.min !== null && d.min !== undefined) ? d.min : undefined,
            max:   (d.max !== null && d.max !== undefined) ? d.max : undefined
        }));

        const masks = (data.masks || [])
            .map(m => MaskModel.deserialize(m))
            .filter(Boolean);

        return {
            name:     data.name || 'Shader',
            code:     data.shaderSource,
            uniforms,
            masks,
            settings: data.settings || {}
        };
    },

    // Определяет формат файла по расширению имени
    detectFormat(fileName) {
        const ext = (fileName || '').split('.').pop().toLowerCase();
        if (ext === 'sfshader') return 'sfshader';
        if (ext === 'sfchain')  return 'sfchain';
        return 'txt';
    }
};

/* ═══════════════════════════════════════════════════════════════════
   MAIN INIT
═══════════════════════════════════════════════════════════════════ */

const LibraryPreview = (() => {
    let prog = null, uniforms = [], active = false;
    function show(code, ulist) {
        try { if (prog) GL.deleteProgram(prog); } catch(e){}
        prog = GL.compileProgram(code);
        if (!prog) { active = false; uniforms = []; return false; }
        uniforms = (ulist || []).map(u => ({...u, value: Array.isArray(u.value) ? [...u.value] : u.value}));
        active = true; return true;
    }
    function clear() {
        try { if (prog) GL.deleteProgram(prog); } catch(e){}
        prog = null; uniforms = []; active = false;
    }
    return { show, clear, isActive: () => active, getData: () => ({ prog, uniforms }) };
})();

(function init() {
  const canvas = document.getElementById('gl-canvas');
  try { GL.init(canvas); }
  catch(e) { setStatus('WebGL недоступен: ' + e.message, 'error'); return; }

  ShaderLayers.setGL(canvas.getContext('webgl'));

  function resizeCanvas() {
    const wrap = document.getElementById('preview-canvas-wrap');
    const displayW = wrap.clientWidth;
    const displayH = wrap.clientHeight;
    let renderW = displayW, renderH = displayH;
    if (S.resolution === 'node') {
      if (S.nodeWidth > 0 && S.nodeHeight > 0) {
        renderW = Math.min(S.nodeWidth, 4096);
        renderH = Math.min(S.nodeHeight, 4096);
      }
    } else if (S.resolution !== 'image' && S.resolution !== 'preview') {
      const f = parseInt(S.resolution, 10);
      if (f > 0) { renderW = f; renderH = f; }
    }
    if (canvas.width !== renderW || canvas.height !== renderH) {
      canvas.width = renderW; canvas.height = renderH;
    }
    canvas.style.width = displayW + 'px';
    canvas.style.height = displayH + 'px';
    updatePreviewSizeLabel();
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // На старте грузим базовый шейдер-пример с инструкцией (как писать шейдеры)
  const defaultGenCode = DEFAULT_SHADER_TEMPLATE;
  const defaultGenUniforms = [
    { name: 'uSpeed',       type: 'float',     value: 0.3,  min: 0.0,  max: 2.0 },
    { name: 'uScale',       type: 'float',     value: 3.0,  min: 1.0,  max: 10.0 },
    { name: 'uIridescence', type: 'float',     value: 1.5,  min: 0.0,  max: 3.0 },
    { name: 'uColorA',      type: 'vec3color', value: [0.1,  0.4,  0.9] },
    { name: 'uColorB',      type: 'vec3color', value: [0.9,  0.2,  0.6] },
    { name: 'uColorC',      type: 'vec3color', value: [0.95, 0.85, 0.4] }
  ];
  document.getElementById('code-editor').value = defaultGenCode;
  S.uniforms = defaultGenUniforms.map(u => ({
    ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
  }));
  UniformsUI.renderAll();
  updateLineNumbers();
  compile();
  S.activeTab  = 'shader';

  document.getElementById('shader-layers-container').style.display = 'flex';

  let fpsFrameCount = 0;
  let fpsLastTime = performance.now();

  GL.startLoop(() => {
    fpsFrameCount++;
    const now = performance.now();
    const delta = now - fpsLastTime;
    if (delta >= 500) {
      const fps = Math.round(fpsFrameCount / delta * 1000);
      document.getElementById('fps-label').textContent = fps + ' fps';
      fpsFrameCount = 0;
      fpsLastTime = now;
    }
    resizeCanvas();
  }, e => {
    setError(e.message);
  });

  let compileTimer = null;
  document.getElementById('code-editor').addEventListener('input', () => {
    if (UndoRedo.isLocked()) return;
    updateLineNumbers();
    clearTimeout(compileTimer);
    compileTimer = setTimeout(() => {
      UndoRedo.push(); // no more codeVisible split — always full snapshot
      if (ShaderLayers.hasLayers()) {
        ShaderLayers.saveActive();
      } else {
        EditorState.generate.code     = document.getElementById('code-editor').value;
        EditorState.generate.uniforms = S.uniforms.map(u => ({
          ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
        }));
      }
      compile();
    }, 400);
  });
  document.getElementById('code-editor').addEventListener('scroll', () => {
    document.getElementById('line-numbers').scrollTop =
      document.getElementById('code-editor').scrollTop;
  });

  function switchTab(tabName) {
    if (tabName !== 'library') LibraryPreview.clear();
    if (S.activeTab === 'shader' && ShaderLayers.hasLayers()) {
      ShaderLayers.saveActive();
    }

    document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`.tab-pill[data-tab="${tabName}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    const shaderContainer = document.getElementById('shader-layers-container');

    if (tabName === 'shader') {
      S.activeTab = 'shader';

      if (shaderContainer) shaderContainer.style.display = 'flex';
      togglePanelCollapseBasedOnLayers('shader-layers');

      if (ShaderLayers.hasLayers()) {
        ShaderLayers.reactivate();
      } else {
        document.getElementById('code-editor').value = EditorState.generate.code;
        S.uniforms = EditorState.generate.uniforms.map(u => ({
          ...u, value: Array.isArray(u.value) ? [...u.value] : u.value
        }));
        UniformsUI.renderAll();
        updateLineNumbers();
      }
      document.getElementById('settings-tab-content').style.display = 'none';
      document.getElementById('library-tab-content').style.display = 'none';
      document.getElementById('uniforms-list').style.display = '';
      document.getElementById('left-panel-header').style.display = '';

      compile();

    } else if (tabName === 'library') {
      S.activeTab = 'library';

      if (shaderContainer) shaderContainer.style.display = 'none';

      document.getElementById('library-tab-content').style.display = 'flex';
      document.getElementById('settings-tab-content').style.display = 'none';
      document.getElementById('uniforms-list').style.display = 'none';
      document.getElementById('left-panel-header').style.display = 'none';

      LibraryManager.buildAndRenderTree();
    } else if (tabName === 'settings') {
      S.activeTab = 'settings';

      if (shaderContainer) shaderContainer.style.display = 'none';

      document.getElementById('settings-tab-content').style.display = 'flex';
      document.getElementById('library-tab-content').style.display = 'none';
      document.getElementById('uniforms-list').style.display = 'none';
      document.getElementById('left-panel-header').style.display = 'none';
    }
  }

  function togglePanelCollapseBasedOnLayers(listId) {
    const listEl = document.getElementById(listId);
    const header = document.querySelector(`[data-target="${listId}"]`);
    if (!listEl || !header) return;
    const hasLayers = listEl.querySelectorAll('.layer-item, .effect-layer-row').length > 0;
    if (!hasLayers) {
      listEl.classList.add('collapsed');
      header.classList.add('collapsed');
      const arrow = header.querySelector('.arrow-icon');
      if (arrow) arrow.innerText = '▶';
    } else {
      listEl.classList.remove('collapsed');
      header.classList.remove('collapsed');
      const arrow = header.querySelector('.arrow-icon');
      if (arrow) arrow.innerText = '▼';
    }
  }

  document.querySelectorAll('.tab-pill').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // Базовый шаблон для кнопки (+) — добавляет минимальный слой шейдера

  const addShaderBtn = document.getElementById('add-default-shader-btn');
  if (addShaderBtn) {
    addShaderBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      ShaderLayers.add({
        name: "New Shader Layer",
        code: DEFAULT_SHADER_TEMPLATE,
        uniforms: [
          { name: 'uSpeed',       type: 'float',     value: 0.3,  min: 0.0,  max: 2.0 },
          { name: 'uScale',       type: 'float',     value: 3.0,  min: 1.0,  max: 10.0 },
          { name: 'uIridescence', type: 'float',     value: 1.5,  min: 0.0,  max: 3.0 },
          { name: 'uColorA',      type: 'vec3color', value: [0.1,  0.4,  0.9] },  // синий
          { name: 'uColorB',      type: 'vec3color', value: [0.9,  0.2,  0.6] },  // розовый
          { name: 'uColorC',      type: 'vec3color', value: [0.95, 0.85, 0.4] }   // золотой
        ]
      });
    });
  }

  // Manual collapse toggle for layer panels (arrow / title click)
  document.querySelectorAll('.toggle-collapse').forEach(toggle => {
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const listId = toggle.getAttribute('data-target');
      const listEl = document.getElementById(listId);
      const header = toggle.closest('.panel-section-header');
      if (!listEl || !header) return;
      const collapsed = listEl.classList.toggle('collapsed');
      header.classList.toggle('collapsed', collapsed);
      const arrow = toggle.querySelector('.arrow-icon') || header.querySelector('.arrow-icon');
      if (arrow) arrow.innerText = collapsed ? '▶' : '▼';
    });
  });

  // ── Dynamic window resize vars ──
  let currentWindowW = 900;
  let currentWindowH = 620;

  // ── Show/Hide code ──
  const btnShowCode = document.getElementById('btn-show-code');
  const centerEl = document.getElementById('center');
  let codeVisible = false;

  function applyCodeVisibility() {
    const divider = document.getElementById('panel-divider');

    centerEl.style.display = codeVisible ? 'flex' : 'none';

    if (divider) {
      divider.classList.toggle('hidden', !codeVisible);
    }

    const rightPanel = document.getElementById('right-panel');
    if (codeVisible) {
      rightPanel.style.width = rightW + 'px';
      rightPanel.style.flex  = 'none';
    } else {
      rightPanel.style.width = '';
      rightPanel.style.flex  = '1';
    }

    btnShowCode.classList.toggle('active', codeVisible);
  }

  btnShowCode.addEventListener('click', () => {
    codeVisible = !codeVisible;
    applyCodeVisibility();
    parent.postMessage({
      pluginMessage: {
        type: 'resize',
        width: Math.round(currentWindowW),
        height: Math.round(currentWindowH)
      }
    }, '*');
  });

  // Применить начальное состояние (code скрыт)
  applyCodeVisibility();

  // Установить дефолтное значение
  document.getElementById('res-select').value = 'node';
  S.resolution = 'node';

  document.getElementById('res-select').addEventListener('change', e => {
    S.resolution = e.target.value;
    resizeCanvas();
    updatePreviewSizeLabel();
  });

  document.getElementById('exact-preview-input').addEventListener('change', e => {
    S.exactPreview = e.target.checked;
    canvas.style.imageRendering = e.target.checked ? 'pixelated' : 'auto';
    resizeCanvas();
  });

  // ── Settings tab logic ──
  const fpsLabel = document.getElementById('fps-label');
  const showFpsInput = document.getElementById('show-fps-input');
  const fpsColorSelect = document.getElementById('fps-color-select');
  const frameRateSelect = document.getElementById('frame-rate-select');

  fpsLabel.style.display = 'none';

  showFpsInput.addEventListener('change', (e) => {
    fpsLabel.style.display = e.target.checked ? 'block' : 'none';
  });

  fpsColorSelect.addEventListener('change', (e) => {
    fpsLabel.style.color = e.target.value === 'white'
      ? 'rgba(255, 255, 255, 0.8)'
      : 'rgba(0, 0, 0, 0.6)';
  });

  frameRateSelect.addEventListener('change', (e) => {
    GL.setFrameRate(parseInt(e.target.value));
  });
  GL.setFrameRate(parseInt(frameRateSelect.value));

  // ── UI Scale ──
  const BASE_W = 900, BASE_H = 620;
  const uiScaleSelect = document.getElementById('ui-scale-select');
  let _currentUiScale = 1; // текущий масштаб

  function applyUiScale(scale) {
    const s = parseFloat(scale) || 1;
    _currentUiScale = s;
    document.documentElement.style.zoom = s;
    // Обновляем текущие размеры окна с учётом масштаба
    currentWindowW = Math.round(BASE_W * s);
    currentWindowH = Math.round(BASE_H * s);
    parent.postMessage({ pluginMessage: { type: 'resize', width: currentWindowW, height: currentWindowH } }, '*');
    parent.postMessage({ pluginMessage: { type: 'save-ui-scale', scale: s } }, '*');
    if (typeof resizeCanvas === 'function') resizeCanvas();
  }

  uiScaleSelect.addEventListener('change', (e) => applyUiScale(e.target.value));

  (function restoreUiScale() {
    parent.postMessage({ pluginMessage: { type: 'get-ui-scale' } }, '*');
  })();

  window.addEventListener('message', (e) => {
    const msg = e.data && e.data.pluginMessage;
    if (msg && msg.type === 'restore-ui-scale' && msg.scale) {
      uiScaleSelect.value = String(msg.scale);
      applyUiScale(msg.scale);
    }
  });

  // ── Library & Export event handlers ──
  LibraryManager.init('shader-library-tree', 'library-path-status');

  document.getElementById('export-shader-btn').addEventListener('click', () => {
    const shaderName = prompt("Enter shader name:", "MyShader") || "MyShader";
    const jsonOutput = SfShader.serialize(shaderName);
    EffectSerializer.downloadFile(jsonOutput, shaderName + '.sfshader');
    setStatus('Exported as ' + shaderName + '.sfshader', 'success');
  });

  document.getElementById('save-effect-btn').addEventListener('click', () => {
    const effectName = prompt("Enter effect name:", "Dream Effect") || "Dream";
    const jsonOutput = EffectSerializer.serializeCurrentEffect(effectName);
    EffectSerializer.downloadFile(jsonOutput, effectName + '.sfchain');
  });

  const playBtn = document.getElementById('btn-play');
  playBtn.addEventListener('click', () => {
    S.animated = !S.animated;
    if (S.animated) {
      S.startTime = performance.now();
      playBtn.textContent = '⏸';
      playBtn.classList.add('active');
    } else {
      S.timeOffset = GL.getTime();
      playBtn.textContent = '▶';
      playBtn.classList.remove('active');
    }
  });
  playBtn.textContent = '⏸';

  document.getElementById('btn-reset-time').addEventListener('click', () => {
    S.startTime = performance.now();
    S.timeOffset = 0;
  });

  // Отражение только для Preview (сессионное, не сохраняется и не влияет на Export).
  const previewFlip = { v: false, h: false };
  function applyPreviewFlip() {
    const c = document.getElementById('gl-canvas');
    let transforms = [];
    if (previewFlip.v) transforms.push('scaleY(-1)');
    if (previewFlip.h) transforms.push('scaleX(-1)');
    c.style.transform = transforms.length ? transforms.join(' ') : 'none';
  }
  const flipVBtn = document.getElementById('btn-flip-v');
  const flipHBtn = document.getElementById('btn-flip-h');
  flipVBtn.addEventListener('click', () => {
    previewFlip.v = !previewFlip.v;
    flipVBtn.classList.toggle('active', previewFlip.v);
    applyPreviewFlip();
  });
  flipHBtn.addEventListener('click', () => {
    previewFlip.h = !previewFlip.h;
    flipHBtn.classList.toggle('active', previewFlip.h);
    applyPreviewFlip();
  });
  applyPreviewFlip();

  const btnReplace = document.getElementById('btn-replace');
  const btnAdd = document.getElementById('btn-add');

  async function triggerApply(method) {
    if (!S.nodeId) {
      parent.postMessage({ pluginMessage: { type: 'requestImage' } }, '*');
      setTimeout(() => {
        if (!S.nodeId) { setStatus('Select a layer in Figma', 'error'); return; }
        executeApply(method);
      }, 1500);
      return;
    }
    executeApply(method);
  }

  function getExportDimensions() {
    var w, h;
    if (S.resolution === "node") {
      w = S.nodeWidth || 512;
      h = S.nodeHeight || 512;
    } else if (S.resolution === "image") {
      w = S.imageOriginWidth || S.nodeWidth || 512;
      h = S.imageOriginHeight || S.nodeHeight || 512;
    } else {
      w = parseInt(S.resolution, 10) || 512;
      h = parseInt(S.resolution, 10) || 512;
    }
    w = Math.max(1, Math.round(w));
    h = Math.max(1, Math.round(h));
    return { w: w, h: h };
  }

  function updatePreviewSizeLabel() {
    var label = document.getElementById("preview-size-label");
    if (!label) return;
    var dims = getExportDimensions();
    label.textContent = dims.w + " \u00D7 " + dims.h;
  }

  async function executeApply(method) {
    btnReplace.disabled = true; btnAdd.disabled = true;
    setStatus('Rendering...', 'info');

    var dims = getExportDimensions();
    console.log("[ShaderFlow] Exporting at", dims.w, "x", dims.h, "mode:", S.resolution);

    if (!S.hasTexture) {
      console.warn("[ShaderFlow] No texture loaded; shader will run without input image.");
    }

    try {
      var result = GL.getPixels(dims.w, dims.h);
      if (!result || !result.pixels || result.pixels.length !== dims.w * dims.h * 4) {
        setStatus("Render failed: pixel buffer mismatch", "error");
        console.error("[ShaderFlow] Bad buffer. Expected:", dims.w * dims.h * 4, "Got:", result ? result.pixels.length : "null");
        btnReplace.disabled = false;
        btnAdd.disabled = false;
        return;
      }
      const { pixels, width, height } = result;
      const oc = document.createElement('canvas'); oc.width = width; oc.height = height;
      oc.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels), width, height), 0, 0);
      const blob = await new Promise(res => oc.toBlob(res, 'image/png'));
      const base64 = await blobToBase64(blob);

      parent.postMessage({
        pluginMessage: { type: 'applyImage', base64, nodeId: S.nodeId, width, height, method }
      }, '*');
      setTimeout(() => {
        btnReplace.disabled = false;
        btnAdd.disabled = false;
      }, 10000);
    } catch(e) {
      btnReplace.disabled = false; btnAdd.disabled = false;
      setStatus('Error: ' + e.message, 'error');
    }
  }

  btnReplace.addEventListener('click', () => triggerApply('replace'));
  btnAdd.addEventListener('click', () => triggerApply('add'));

  UniformsUI.onChange(() => {
    if (ShaderLayers.hasLayers()) {
      ShaderLayers.saveActive();
    } else {
      GL.setGenerateUniforms(S.uniforms);
    }
    Pipeline.rebuildAndRender();
  });

  document.getElementById('code-editor').addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = e.target;
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = start + 2;
      updateLineNumbers();
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      compile();
      UndoRedo.pushImmediate();
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
      e.preventDefault();
      UndoRedo.undo();
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) {
      e.preventDefault();
      UndoRedo.redo();
    }
  });

  window.onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case 'selectionInfo': {
        S.nodeId = msg.nodeId;
        S.nodeName = msg.nodeName;

        var badge = document.getElementById("node-badge");
        var btnAdd = document.getElementById("btn-add");
        var btnReplace = document.getElementById("btn-replace");

        if (msg.hasNode) {
          badge.textContent = msg.nodeName || "Unknown";
          if (btnAdd) btnAdd.disabled = false;
          if (btnReplace) btnReplace.disabled = false;
        } else {
          badge.textContent = "No selection";
          if (btnAdd) btnAdd.disabled = true;
          if (btnReplace) btnReplace.disabled = true;
        }

        if (msg.error) {
          setStatus("Error loading image: " + msg.error, "error");
        }

        // Round and clamp incoming dimensions immediately so export never sees undefined.
        var rawW = (typeof msg.nodeWidth === "number" && !isNaN(msg.nodeWidth)) ? msg.nodeWidth : 0;
        var rawH = (typeof msg.nodeHeight === "number" && !isNaN(msg.nodeHeight)) ? msg.nodeHeight : 0;

        if (msg.imageBase64) {
          var img = new Image();
          img.onload = function() {
            var nw = rawW > 0 ? rawW : (img.naturalWidth || 512);
            var nh = rawH > 0 ? rawH : (img.naturalHeight || 512);
            S.nodeWidth = Math.max(1, Math.round(nw));
            S.nodeHeight = Math.max(1, Math.round(nh));
            S.imageOriginWidth = img.naturalWidth || nw;
            S.imageOriginHeight = img.naturalHeight || nh;
            S.hasTexture = true;
            GL.uploadTexture(img);
            S.textureImage = img;
            updatePreviewSizeLabel();
            setStatus("Layer: " + (msg.nodeName || "Unknown"), "info");
            console.log("[ShaderFlow] Image OK. Dims:", S.nodeWidth, "x", S.nodeHeight, "Origin:", S.imageOriginWidth, "x", S.imageOriginHeight);
          };
          img.onerror = function() {
            setStatus("Failed to decode image", "error");
            S.hasTexture = false;
            GL.clearTexture();
            S.textureImage = null;
            S.nodeWidth = Math.max(1, Math.round(rawW || 512));
            S.nodeHeight = Math.max(1, Math.round(rawH || 512));
            updatePreviewSizeLabel();
          };
          img.src = "data:" + msg.imageMime + ";base64," + msg.imageBase64;
        } else {
          S.hasTexture = false;
          GL.clearTexture();
          S.textureImage = null;
          if (msg.hasNode) {
            S.nodeWidth = Math.max(1, Math.round(rawW || 512));
            S.nodeHeight = Math.max(1, Math.round(rawH || 512));
            setStatus("Layer: " + (msg.nodeName || "Unknown") + " (no image fill)", "info");
          } else {
            S.nodeWidth = 512;
            S.nodeHeight = 512;
            setStatus("Select a layer", "");
          }
          updatePreviewSizeLabel();
          console.log("[ShaderFlow] No image. Dims:", S.nodeWidth, "x", S.nodeHeight);
        }
        break;
      }

      case 'applySuccess': {
        document.getElementById('btn-replace').disabled = false;
        document.getElementById('btn-add').disabled = false;
        setStatus(`✅ Applied successfully!`, 'success');
        break;
      }

      case 'applyError':
        document.getElementById('btn-replace').disabled = false;
        document.getElementById('btn-add').disabled = false;
        setStatus('Error: ' + msg.message, 'error');
        break;

      case 'error':
        setStatus('Error: ' + msg.message, 'error');
        break;

      case 'restore-library-data':
        if (msg.data && msg.data.files && msg.data.files.length > 0) {
          LibraryManager.restoreFromStorage(msg.data);
        } else {
          LibraryManager.buildAndRenderTree();
        }
        break;
    }
  };

  updateLineNumbers();

  document.getElementById('btn-undo').addEventListener('click', () => UndoRedo.undo());
  document.getElementById('btn-redo').addEventListener('click', () => UndoRedo.redo());

  setTimeout(() => UndoRedo.push(), 100);

  parent.postMessage({ pluginMessage: { type: 'requestImage' } }, '*');

  // ── Dynamic window resize ──
  const resizeHandle = document.getElementById('resize-handle');
  let isResizing = false;
  let resizeStartX = 0, resizeStartY = 0;
  let resizeStartW = 0, resizeStartH = 0;

  const MIN_W = 480, MIN_H = 360;
  const MAX_W = 2000, MAX_H = 1400; // увеличены для масштаба 200%+

  resizeHandle.addEventListener('mousedown', e => {
    e.preventDefault();
    isResizing = true;
    resizeStartX = e.screenX;
    resizeStartY = e.screenY;
    resizeStartW = currentWindowW;
    resizeStartH = currentWindowH;
    document.body.style.cursor = 'se-resize';
  });

  window.addEventListener('mousemove', e => {
    if (!isResizing) return;
    const dw = e.screenX - resizeStartX;
    const dh = e.screenY - resizeStartY;
    currentWindowW = Math.max(MIN_W, Math.min(MAX_W, resizeStartW + dw));
    currentWindowH = Math.max(MIN_H, Math.min(MAX_H, resizeStartH + dh));
    parent.postMessage({
      pluginMessage: { type: 'resize', width: Math.round(currentWindowW), height: Math.round(currentWindowH) }
    }, '*');
  });

  window.addEventListener('mouseup', () => {
    if (!isResizing) return;
    isResizing = false;
    document.body.style.cursor = '';
  });

  // ── Panel divider drag ──
  const divider = document.getElementById('panel-divider');
  const mainEl  = document.getElementById('main');
  const rightPanel = document.getElementById('right-panel');

  let rightW = 300;
  rightPanel.style.width = rightW + 'px';

  let isDividerDragging = false;
  let divStartX = 0;
  let divStartRightW = 0;

  divider.addEventListener('mousedown', e => {
    e.preventDefault();
    isDividerDragging = true;
    divStartX = e.clientX;
    divStartRightW = rightPanel.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  window.addEventListener('mousemove', e => {
    if (!isDividerDragging) return;
    const dx = divStartX - e.clientX;
    const mainW = mainEl.getBoundingClientRect().width;
    const leftW = document.getElementById('left-panel').getBoundingClientRect().width;
    const minRight = 160;
    const maxRight = mainW - leftW - 120 - 4;
    rightW = Math.max(minRight, Math.min(maxRight, divStartRightW + dx));
    rightPanel.style.width = rightW + 'px';
    rightPanel.style.flex  = 'none';
  });

  window.addEventListener('mouseup', e => {
    if (!isDividerDragging) return;
    isDividerDragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

/* ═══════════════════════════════════════════════════════════════════
   TOOLTIPS — подсказка появляется при удержании курсора >1с
   на элементе с атрибутом data-tip (кнопки, параметры, селекты).
   Автоматически подписывает строки параметров (uniform rows).
   ═══════════════════════════════════════════════════════════════════ */
(function initTooltips() {
  const tip = document.createElement('div');
  tip.id = 'tooltip';
  document.body.appendChild(tip);

  // =============================================================
  // Normalize native title tooltips into the custom data-tip system
  // =============================================================
  function convertTitleToDataTip(el) {
    if (!el || el.nodeType !== 1 || !el.hasAttribute) return;

    if (!el.hasAttribute('title')) return;

    const titleText = el.getAttribute('title');

    if (titleText && !el.hasAttribute('data-tip')) {
      el.setAttribute('data-tip', titleText);
    }

    el.removeAttribute('title');
  }

  function normalizeTitleAttributes(root) {
    if (!root || root.nodeType !== 1) return;

    convertTitleToDataTip(root);

    if (root.querySelectorAll) {
      root.querySelectorAll('[title]').forEach(convertTitleToDataTip);
    }
  }

  normalizeTitleAttributes(document.body);

  const titleObserver = new MutationObserver(mutations => {
    mutations.forEach(mut => {
      if (mut.type === 'attributes' && mut.attributeName === 'title') {
        convertTitleToDataTip(mut.target);
      }

      if (mut.type === 'childList') {
        mut.addedNodes.forEach(node => {
          normalizeTitleAttributes(node);
        });
      }
    });
  });

  titleObserver.observe(document.body, {
    attributes: true,
    attributeFilter: ['title'],
    childList: true,
    subtree: true
  });

  const HOLD_MS = 1000;
  let hoverEl = null;
  let timer = null;
  let lastX = 0, lastY = 0;

  function show(text, x, y) {
    if (!text) return;
    tip.textContent = text;
    tip.style.display = 'block';
    position(x, y);
  }
  function hide() {
    tip.style.display = 'none';
    if (timer) { clearTimeout(timer); timer = null; }
  }
  function position(x, y) {
    const zoom = parseFloat(document.documentElement.style.zoom) || 1;
    const pad = 14;
    const r = tip.getBoundingClientRect();
    let left = x / zoom + pad, top = y / zoom + pad;
    if (left + r.width > window.innerWidth / zoom - 8) left = x / zoom - r.width - pad;
    if (top + r.height > window.innerHeight / zoom - 8) top = y / zoom - r.height - pad;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = Math.max(4, top) + 'px';
  }

  function eligible(el) {
    if (!el || !el.closest) return null;
    return el.closest('[data-tip]');
  }

  document.addEventListener('mouseover', e => {
    const t = eligible(e.target);
    if (!t) { hide(); return; }
    hoverEl = t;
    lastX = e.clientX; lastY = e.clientY;
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      show(t.getAttribute('data-tip'), lastX, lastY);
    }, HOLD_MS);
  });

  document.addEventListener('mousemove', e => {
    if (hoverEl && tip.style.display === 'block') { lastX = e.clientX; lastY = e.clientY; position(lastX, lastY); }
  });

  document.addEventListener('mouseout', e => {
    const to = e.relatedTarget;
    if (hoverEl && (!to || !hoverEl.contains(to))) { hide(); hoverEl = null; }
  });

  document.addEventListener('mousedown', hide);
  document.addEventListener('keydown', hide);

  // Авто-подпись строк параметров (uniform rows) по имени параметра.
  const UNIFORM_HINTS = {
    uSpeed: 'Shader animation speed.',
    uScale: 'Pattern scale.',
    uColor1: 'First gradient color.',
    uColor2: 'Second gradient color.'
  };
  function autoTagUniforms() {
    document.querySelectorAll('#uniforms-list .u-row, #uniforms-list .uniform-row, #uniforms-list .param-row').forEach(row => {
      if (row.hasAttribute('data-tip')) return;
      const label = row.querySelector('.u-label, .uniform-label, label');
      const name = label ? label.textContent.trim() : '';
      const hint = UNIFORM_HINTS[name] || (name ? 'Shader parameter "' + name + '".' : '');
      if (hint) row.setAttribute('data-tip', hint);
    });
  }
  const _uniformObserver = new MutationObserver(autoTagUniforms);
  const ul = document.getElementById('uniforms-list');
  if (ul) _uniformObserver.observe(ul, { childList: true, subtree: true });
  autoTagUniforms();
})();

function updateMasterMaskButton() {
    const btn = document.getElementById('btn-master-mask');
    if (!btn) return;
    const hasMasks = MasterMaskState.masks.length > 0;
    if (hasMasks) {
        btn.className = 'btn btn-primary';
    } else {
        btn.className = 'btn btn-ghost';
    }
}

document.getElementById('btn-master-mask').addEventListener('click', () => {
    openMaskEditor('master', 'master');
});

updateMasterMaskButton();
</script>
